version: 2

references:
  
  container_config: &container_config
    docker:
      - image: nikengp/node6:v0.4
    working_directory: /tmp/app

  workspace_root: &workspace_root
    /tmp
    
  attach_workspace: &attach_workspace
    attach_workspace:
      at: *workspace_root

  persist_to_workspace: &persist_to_workspace
    persist_to_workspace:
      root: *workspace_root
      paths:
        - app

  branch_filter_master: &branch_filter_master
    filters:
      branches:
        only: master
        
workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build
      - deploy:
          <<: *branch_filter_master
          context: org-global
          requires:
            - build
jobs:
  build:
    <<: *container_config
    steps:
      - checkout
      - run:
          name: placeholder step
          command: echo success
  deploy:
    <<: *container_config
    steps:
      - *attach_workspace
      - run: aws configure set aws_access_key_id "${AWS_ACCESS_KEY_ID_PROD}"
      - run: aws configure set aws_secret_access_key "${AWS_SECRET_ACCESS_KEY_PROD}"
      - run: echo 'export terraform_state_bucket="ngp-prod-terraform-remote-config"' >> $BASH_ENV
      - run: echo 'export terraform_state_bucket="ngp-terraform-remote-config"' >> $BASH_ENV
#      - run:
#          name: deploy
#          command: aws s3 sync build/ s3://YOURBUCKET.niketech.com/ --exclude \"*.DS_Store*\"; exit_status=$?; if [ $exit_status -eq 2 ]; then exit 0; fi; exit $exit_status
