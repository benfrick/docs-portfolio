D to check the status of your job.\n\n    To know if the job is done, check the value of the status field in the response body as follows:\n\n    \n      \n        \"status\": \"PENDING\": job processing has not started\n      \n      \n        \"status\": \"IN_PROGRESS\": job processing in progress\n      \n      \n        \"status\": \"COMPLETED\": job has completed\n      \n    \n\n    Once you observe a job status of COMPLETED, get the results of your job by parsing the data in the response object from this endpoint. Alternatively, follow the link to the Retrieve Checkout Results endpoint which is provided in the response body (see links object).\n\n    \n      TIP: Parsing the ‘Completed’ job result directly is a best practice because it eliminates doing another service call.\n    \n\n    Endpoint Details\n\n    \n      \n        \n          HTTP Method\n          URI Path\n          JWT Restricted?\n        \n      \n      \n        \n          GET\n          /buy/checkouts/v2/jobs/{id}\n          no\n        \n      \n    \n\n    Path &amp; Query Parameters\n\n    \n      \n        \n          Parameter\n          Type\n          Description\n          Data Type\n          Required?\n        \n      \n      \n        \n          id\n          Path\n          Unique client-generated identifier (UUID) for the checkout\n          string\n          Required\n        \n      \n    \n\n    Request Headers\n\n    Required request headers:\n\n    \n      \n        \n          Header Name\n          Description\n          Member\n          Guest\n          Employee\n        \n      \n      \n        \n          Accept\n          Content type you will accept in response, application/json is only value allowed\n          X\n          X\n          X\n        \n        \n          Content-Type\n          Content type of the request, application/json is only value allowed\n          X\n          X\n          X\n        \n        \n          Authorization\n          Your access token in the format of Bearer {token} indicating the customer is logged in\n          X\n           \n          X\n        \n        \n          x-nike-visitorid\n          Identifier for the guest (i.e. not logged-in) user, validated by the Edge router and passed through to the service\n           \n          X\n           \n        \n        \n          appId\n          Your application identifier\n           \n          X\n           \n        \n      \n    \n\n    Request Body\n\n    There is no body for a GET request.\n\n    Response Body\n\n    For a job that is in either “PENDING” or “IN_PROGRESS” status, the response is abbreviated and only contains the following:\n\n    \n      \n        \n          Element Name\n          Description\n        \n      \n      \n        \n          id\n          Checkout id you sent in the request, also your job ID\n        \n        \n          status\n          Status of the job\n        \n        \n          eta\n          Estimated wait time before polling the jobs endpoint to get your results\n        \n        \n          links\n          Relative URL path you can use to poll the jobs endpoint (see nested ref field)\n        \n      \n    \n\n    Sample Retrieve Checkout Submit Job response body with “IN_PROGRESS” status:\n    {\n  \"id\": \"7a37290b-c724-4f87-aeef-821265853546\",\n  \"status\": \"IN_PROGRESS\",\n  \"eta\": 250,\n  \"resourceType\": \"job\",\n  \"links\": {\n    \"self\": {\n      \"ref\": \"/buy/checkouts/v2/jobs/7a37290b-c724-4f87-aeef-821265853546\"\n    }\n  }\n}\n    \n\n    For a job that is in “COMPLETED” status and had no errors, the response also contains a response object that has the details of your successfully-submitted checkout. The structure of the response object is similar in structure to the request body, with the following notable additions:\n\n    \n      \n        \n          Element Name\n          Description\n        \n      \n      \n        \n          shippingGroups\n          Array found under response object containing items and corresponding VAS, taxes, shipping address/method/cost. Grouped based on Nike business rules\n        \n        \n          priceInfo\n          Object containing price details. Found under the items, valueAddedServices, and shippingCosts objects\n        \n        \n          priceInfo.employeePrice\n          Employee price of the cart item. Only present if an employee price is used when pricing the checkout\n        \n        \n          taxes\n          Array of tax details. Found under items and shippingCosts objects\n        \n        \n          taxes.type\n          Type of tax (e.g. SALESTAX, SHIPPINGTAX, VALUEADDEDTAX)\n        \n        \n          taxes.rate\n          Tax rate\n        \n        \n          taxes.total\n          Total tax amount\n        \n        \n          promotionDiscounts\n          Array found under items and shippingGroups containing a list of promotions and their discount amounts\n        \n        \n          promotionDiscounts.code\n          Promotion code entered by the user\n        \n        \n          promotionDiscounts.amount\n          Promotion discount amount\n        \n        \n          promotionDiscounts.id\n          Promotion identifier\n        \n        \n          shippingMethod\n          Object found under shippingGroups containing cost of shipping method and estimated delivery date(s)\n        \n        \n          shippingMethod.id\n          Identifier for the shipping method, e.g. STANDARD for standard ground shipping in the US\n        \n        \n          shippingMethod.cost\n          Retail cost of shipping via the shipping method\n        \n        \n          shippingMethod.daysToArrive\n          DEPRECATED - do not use\n        \n        \n          shippingMethod.estimatedDelivery\n          Estimated delivery date for the items\n        \n        \n          shippingMethod.estimatedDelivery.**estimatedDeliveryDetails\n          Object containing unique identifier of the delivery estimate\n        \n        \n          shippingMethod.estimatedDelivery.estimatedDeliveryDetails.id\n          Unique identifier (UUID) of the delivery estimate\n        \n        \n          shippingMethod.estimatedDelivery.estimatedDeliveryDetails.date\n          Estimated delivery date for the items\n        \n        \n          shippingMethod.estimatedDelivery.estimatedDeliveryDetails.message\n          Message describing the delivery estimate\n        \n        \n          shippingCosts\n          Object found under shippingGroups containing total shipping costs, discounts, taxes, totals\n        \n        \n          shippingCosts.price\n          Price of the shipping costs\n        \n        \n          shippingCosts.discount\n          Shipping costs discount\n        \n        \n          shippingCosts.total\n          Total price of the shipping costs, not including tax, less any discounts\n        \n        \n          shippingCosts.taxTotal\n          Total tax amount based on the total\n        \n        \n          promotionCodes\n          Array found under response containing distinct summary of status for the provided promotion codes\n        \n        \n          promotionCodes.code\n          Provided promotion code\n        \n        \n          promotionCodes.status\n          Status of whether the promotion code was applied, e.g. PROMOTION_APPLIED, PROMOTION_NOT_APPLIED, PROMOTION_INVALID\n        \n        \n          totals\n          Object under response containing price subtotals for the entire checkout by items, VAS, taxes, discounts, shipping. Total checkout price also included\n        \n        \n          totals.subtotal\n          Subtotal of the item costs for all items\n        \n        \n          totals.valueAddedServicesTotal\n          Total of value-added services on the items\n        \n        \n          totals.taxTotal\n          Total of all taxes applied to the checkout, including VALUEADDEDTAX\n        \n        \n          totals.discountTotal\n          Total of all discoutns (excluding shipping discounts) applied to the checkout\n        \n        \n          totals.shippingTotal\n          Total of all shipping costs, less any shipping discounts, on the checkout\n        \n        \n          totals.total\n          Total prices of the entire checkout (item costs + shipping costs + taxes (including VALUEADDEDTAX) less any discounts\n        \n        \n          paymentToken\n          Found under resource, the unique identifier of the payment details in the payment domain\n        \n        \n          paymentApprovalId\n          Found under resource, the unique identifier of the payment approval\n        \n        \n          paymentStatus\n          Found under resource, the status of payment approval (“ACCEPT”, “PENDING_PAYMENT”, “REJECT”)\n        \n        \n          invoiceInfo\n          Found under resource, an array with special instructions for invoicing. Optional and applies to China only\n        \n        \n          invoiceInfo.type\n          Type of instruction, e.g. ELECTRONIC_FAPIAO to indicate a Chinese Fapiao tax receipt\n        \n        \n          invoiceInfo.detail\n          Supporting details for the instruction, e.g. the title to be used with a Fapiao tax receipt\n        \n      \n    \n\n    Sample Retrieve Checkout Submit Job response body with “COMPLETED” status:\n    {\n  \"id\": \"7a37290b-c724-4f87-aeef-821265853546\",\n  \"status\": \"COMPLETED\",\n  \"resourceType\": \"job\",\n  \"links\": {\n    \"self\": {\n      \"ref\": \"/buy/checkouts/v2/jobs/7a37290b-c724-4f87-aeef-821265853546\"\n    },\n    \"result\": {\n      \"ref\": \"/buy/checkout_results/v2/7a37290b-c724-4f87-aeef-821265853546\"\n    }\n  },\n  \"response\": {\n    \"id\": \"7a37290b-c724-4f87-aeef-821265853546\",\n    \"resourceType\": \"checkoutResult\",\n    \"links\": {\n      \"self\": {\n        \"ref\": \"/buy/checkout_results/v2/7a37290b-c724-4f87-aeef-821265853546\"\n      }\n    },\n    \"email\": \"null@null.com\",\n    \"country\": \"US\",\n    \"currency\": \"USD\",\n    \"locale\": \"en_US\",\n    \"orderId\": \"C00000000001\",\n    \"shippingGroups\": [\n      {\n        \"items\": [\n          {\n            \"id\": \"a05dcb8a-79e5-4f69-bc30-213dd93f429c\",\n            \"skuId\": \"15611769-e81b-45dd-b28c-ca0effb272de\",\n            \"quantity\": 1,\n            \"valueAddedServices\": [\n              {\n                \"id\": \"88d0475d-30e5-4c2f-9a87-7a31938f8ace\",\n                \"instruction\": {\n                  \"id\": \"2027261230\",\n                  \"type\": \"customization/nike_id\"\n                },\n                \"priceInfo\": {\n                  \"price\": 10,\n                  \"discount\": 0,\n                  \"total\": 10,\n                  \"priceSnapshotId\": \"12319076-f81c-4fdb-8beb-2510ba74e9fe\"\n                }\n              },\n              {\n                \"id\": \"ac9fd9d3-3815-44ce-8b1f-18cce7abd488\",\n                \"instruction\": {\n                  \"id\": \"1027551960\",\n                  \"type\": \"customization/nike_id\"\n                },\n                \"priceInfo\": {\n                  \"price\": 12,\n                  \"discount\": 0,\n                  \"total\": 12,\n                  \"priceSnapshotId\": \"12319076-f81c-4fdb-8beb-2510ba74e9ff\"\n                }\n              }\n            ],\n            \"priceInfo\": {\n              \"price\": 200,\n              \"valueAddedServices\": 22,\n              \"discount\": 0,\n              \"total\": 222,\n              \"taxTotal\": 20\n            },\n            \"taxes\": [\n              {\n                \"type\": \"SALESTAX\",\n                \"rate\": 10,\n                \"total\": 20\n              }\n            ]\n          }\n        ],\n        \"recipient\": {\n          \"firstName\": \"John\",\n          \"altFirstName\": \"J\",\n          \"lastName\": \"Doe\",\n          \"altLastName\": \"Deer\",\n          \"middleName\": \"Henry\"\n        },\n        \"shippingAddress\": {\n          \"address1\": \"1234 NW Test\",\n          \"address2\": \"Suite 22\",\n          \"address3\": \"Door 1\",\n          \"city\": \"Beaverton\",\n          \"state\": \"OR\",\n          \"postalCode\": \"97006\",\n          \"country\": \"US\",\n          \"county\": \"Washington\"\n        },\n        \"contactInfo\": {\n          \"phoneNumber\": \"555-555-5555\",\n          \"email\": \"null@null.com\"\n        },\n        \"shippingMethod\": {\n          \"id\": \"STANDARD\",\n          \"cost\": 8,\n          \"daysToArrive\": 5,\n          \"estimatedDelivery\": \"2016-02-09T00:00:00.000Z\"\n        },\n        \"shippingCosts\": {\n          \"priceInfo\": {\n            \"price\": 8,\n            \"discount\": 0,\n            \"total\": 8,\n            \"taxTotal\": 0.8\n          },\n          \"taxes\": [\n            {\n              \"type\": \"SHIPPINGTAX\",\n              \"rate\": 10,\n              \"total\": 0.8\n            }\n          ]\n        }\n      }\n    ],\n    \"paymentToken\": \"fe2cc7d6-9b40-4b64-81bf-afa11c8b43e4\",\n    \"totals\": {\n      \"subtotal\": 200,\n      \"valueAddedServicesTotal\": 22,\n      \"taxTotal\": 20.8,\n      \"discountTotal\": 0,\n      \"shippingTotal\": 8,\n      \"total\": 230.8\n    }\n  }\n}\n    \n\n    Retrieve Checkout Results\n\n    After calling both the Request Checkout Submit and Retrieve Checkout Submit Job endpoints, you can call this endpoint to retrieve the result of your request. This step is optional, as the same result is already available in the response from the Retrieve Checkout Submit Job endpoint.\n\n    Endpoint Details\n\n    \n      \n        \n          HTTP Method\n          URI Path\n          JWT Restricted?\n        \n      \n      \n        \n          GET\n          /buy/checkout_results/v2/{id}\n          no\n        \n      \n    \n\n    Path &amp; Query Parameters\n\n    \n      \n        \n          Parameter\n          Type\n          Description\n          Data Type\n          Required?\n        \n      \n      \n        \n          id\n          Path\n          Unique client-generated identifier (UUID) for the checkout\n          string\n          Required\n        \n      \n    \n\n    Request Checkout Submit (Launch)\n\n    The Request Checkout Submit (Launch) endpoint is used exclusively for Nike Launch experiences and features JWT authentication to enforce that. All other types of checkouts need to be sent to the regular Request Checkout Submit endpoint.\n\n    The Launch endpoint has the same contract as the Request Checkout Submit endpoint so for additional details see that section.\n\n    Endpoint Details\n\n    \n      \n        \n          HTTP Method\n          URI Path\n          JWT Restricted?\n        \n      \n      \n        \n          PUT\n          /buy/launch_checkouts/v2/{id}\n          Yes\n        \n      \n    \n\n    Path &amp; Query Parameters\n\n    \n      \n        \n          Parameter\n          Type\n          Description\n          Data Type\n          Required?\n        \n      \n      \n        \n          id\n          Path\n          Unique client-generated identifier (UUID) for the checkout\n          string\n          Required\n        \n      \n    \n\n    Checkouts Error Handling\n\n    Following is a summary of the errors and warnings that can come back in responses from the Checkouts API:\n\n    Error Responses\n\n    \n      \n        \n          HTTP Response Code\n          Relevant HTTP Method(s)\n          Error Code\n          Error Description\n          Action to Take\n        \n      \n      \n        \n          200\n          GET\n          INVALID_PAYMENT_TYPE\n          The selected payment type is invalid for the checkout\n           \n        \n        \n          200\n          GET\n          INVALID_SHIPPING_BILLING_COMBINATION\n          The shipping and billing country combination is not supported\n           \n        \n        \n          200\n          GET\n          ITEM_QUANTITY_LIMIT\n          Shopper has exceeded the per-user quantity limit for the product (total purchase quantity over multiple checkouts).\n          Notify the user as necessary\n        \n        \n          200\n          GET\n          NO_INVENTORY\n          Unable to reserve inventory for the SKU\n          Notify user as necessary\n        \n        \n          200\n          GET\n          OFFER_INVALID\n          The exclusive access offer is not valid (Launch only)\n          Notify user as necessary\n        \n        \n          200\n          GET\n          PAYMENT_INSUFFICIENT\n          Unable to allocate order total across all payment types. Need more payment\n          Prompt user to select another payment method\n        \n        \n          200\n          GET\n          PAYMENT_INVALID\n          “Payment failed”\n          Check the paymentToken. Correct and retry\n        \n        \n          200\n          GET\n          PAYPAL_AUTH_FAILURE_10411\n          Express Checkout transaction has expired\n          Notify the user as necessary\n        \n        \n          200\n          GET\n          PAYPAL_AUTH_FAILURE_10417\n          Retry using alternative method from PayPal wallet\n          Notify the user as necessary\n        \n        \n          200\n          GET\n          PAYPAL_AUTH_FAILURE_10422\n          Retry using alternative method\n          Notify the user as necessary\n        \n        \n          200\n          GET\n          PAYPAL_AUTH_FAILURE_10445\n          Error occurred, retry the transaction\n          Notify the user as necessary\n        \n        \n          200\n          GET\n          PAYPAL_AUTH_FAILURE_10486\n          Retry using alternative method\n          Notify the user as necessary\n        \n        \n          200\n          GET\n          PAYPAL_AUTH_FAILURE_11084\n          PayPal transaction declined\n          Notify the user as necessary\n        \n        \n          200\n          GET\n          PAYPAL_AUTH_FAILURE_13113\n          PayPal payment failed\n          Notify the user as necessary\n        \n        \n          200\n          GET\n          PRODUCT_NOT_BUYABLE\n          “Non buyable product(s)”\n          Notify the user as necessary\n        \n        \n          200\n          GET\n          PRODUCT_NOT_FOUND\n          Item sku not found or not valid for the country.\n          Check the skuId. Correct and retry\n        \n        \n          200\n          GET\n          PROMOTION_CODE_INVALID\n          Promotion code is invalid\n          Notify the user as necessary\n        \n        \n          200\n          GET\n          QUANTITY_INVALID\n          “Product(s) exceeded quantity limit”. This is on a per-checkout basis.\n          Check the item quantity. Reduce and retry\n        \n        \n          200\n          GET\n          REJECTED\n          Request was rejected\n           \n        \n        \n          200\n          GET\n          REQUEST_INVALID\n          “Unable to obtain checkout request”\n          skuID invalid? Correct and retry\n        \n        \n          200\n          GET\n          SHIPPING_METHOD_INVALID\n          “Invalid shipping method(s)”\n          Check the shipping method(s). Correct and retry\n        \n        \n          200\n          GET\n          SYSTEM_ERROR\n          General system error occurred. Typically, due to a timeout in the job\n          Submit checkout again\n        \n        \n          200\n          GET\n          UNSUPPORTED_CREDIT_CARD_ISSUER_COUNTRY\n          The credit card number is from a country that is not supported\n           \n        \n        \n          200\n          GET\n          UNSUPPORTED_PAYMENT_FOR_COUNTRY\n          The selected payment type is not supported in the selected billing country\n           \n        \n        \n          400\n          PUT\n          FIELD_INVALID\n          The value of a field or fields in the request was not valid. Examples include providing too many items, country code and/or brand not supported, etc.\n          Check the indicated field/value. Correct and retry\n        \n        \n          400\n          PUT\n          MISSING_REQUIRED\n          A required field or fields in the request was missing. Examples include not providing country, currency etc.\n          Retry the request while supplying the missing field/value\n        \n        \n          400\n          PUT\n          REQUEST_INVALID\n          “Invalid request body”\n          Check for malformed JSON in the request and retry\n        \n        \n          401\n          PUT, GET\n          35\n          The operation was requested by an unauthorized user.\n          Check that your auth token was sent in Authorization request header in format Bearer {token} or that the token has not expired\n        \n        \n          404\n          PUT, GET\n          310\n          The resource you requested does not exist.\n          Check the URL. Adjust as necessary and retry\n        \n        \n          409\n          PUT\n          REQUEST_INVALID\n          “Request conflicts with previous request for same checkout”\n          Same checkout ID was used previously with different request body. Generate new checkout ID and retry\n        \n        \n          500\n          PUT\n          Server error\n          Error occurred processing the request.\n          Checkout ID not in UUID format? Bad shipping method? skuId isn’t in UUID format? Line item id not in UUID format?\n        \n        \n          500\n          PUT\n          n/a\n          Request was structurally invalid, such as malformed JSON.\n          Check the syntax of the request body, or item quantity for validity\n        \n      \n    \n\n    Example error response bodies:\n\n    \n      Response for a request containing an invalid skuId (Checkout Preview only):\n        {\n \"id\": \"0be43157-32e6-45ea-ad94-6832419a714e\",\n \"status\": \"COMPLETED\",\n \"links\": {\n     \"self\": {\n         \"ref\": \"/buy/checkout_previews/v2/jobs/0be43157-32e6-45ea-ad94-6832419a714e\"\n     },\n     \"result\": {\n         \"ref\": \"/buy/checkout_preview_results/v2/0be43157-32e6-45ea-ad94-6832419a714e\"\n     }\n },\n \"error\": {\n     \"message\": \"Product data not found\",\n     \"httpStatus\": 400,\n     \"code\": \"PRODUCT_NOT_FOUND\",\n     \"errors\": []\n },\n \"resourceType\": \"job\"\n}\n        \n      \n      HTTP 401 response for a request containing an invalid access token in Authorization header (all Checkouts endpoints):\n    \n\n    {\n    \"error_id\": \"132ef514-5c28-40d8-8c52-8e2a60cd3182\",\n    \"errors\": [\n        {\n            \"code\": 35,\n            \"message\": \"Unauthorized user access\"\n        }\n    ]\n}\n    \n\n    \n      HTTP 404 response for request sent to an unrecognized URL (all Checkouts endpoints):\n        {\n \"error_id\": \"0c4a083e-b86d-471e-9d95-a2d14e7c001c\",\n \"errors\": [\n     {\n         \"code\": 310,\n         \"message\": \"The resource you requested does not exist.\"\n     }\n ]\n}\n        \n      \n      HTTP 500 response for a request where the checkout id in the URL was not in UUID format (Checkout Preview only):\n        {\n \"httpStatus\": 500,\n \"code\": \"5005\",\n \"timestamp\": 1501001555623,\n \"service\": \"checkoutpreviewscmd\",\n \"message\": \"Internal Server Error: type: class com.sun.jersey.api.ParamException$PathParamExceptionmessage: java.lang.IllegalArgumentException: Invalid UUID string: footrace: \"\n}\n        \n      \n      HTTP 500 response for a request where the checkout id in the URL was not in UUID format (Checkout Submit only):\n        {\n \"httpStatus\": 500,\n \"timestamp\": 1501003356822,\n \"service\": \"checkoutscmd\",\n \"message\": \"An unhandled error has occurred.\"\n}\n        \n      \n      Response for a request where a required field was missing (Checkout Preview and Checkout Submit only):\n        {\n \"message\": \"Validation Failed\",\n \"errors\": [\n     {\n         \"field\": \"request.country\",\n         \"message\": \"Required field\",\n         \"code\": \"MISSING_REQUIRED\"\n     }\n ]\n}\n        \n      \n      Response for a request containing an invalid field value (Checkout Preview and Checkout Submit only):\n        {\n \"message\": \"Validation Failed\",\n \"errors\": [\n     {\n         \"field\": \"request.country\",\n         \"message\": \"Invalid field\",\n         \"code\": \"FIELD_INVALID\"\n     }\n ]\n}\n        \n      \n      Response for a request containing a line item id that was not in UUID format (Checkout Preview and Checkout Submit only):\n        {\n \"message\": \"Validation Failed\",\n \"errors\": [\n     {\n         \"field\": \"request.items[0].id\",\n         \"message\": \"Invalid field\",\n         \"code\": \"FIELD_INVALID\"\n     }\n ]\n}\n        \n      \n      Response for a request where the item quantity limit was exceeded (Checkout Preview and Checkout Submit only):\n        {\n \"id\": \"9b0a2af0-cdb5-423f-864f-1a9f8e0a8110\",\n \"status\": \"COMPLETED\",\n \"links\": {\n     \"self\": {\n         \"ref\": \"/buy/checkout_previews/v2/jobs/9b0a2af0-cdb5-423f-864f-1a9f8e0a8110\"\n     },\n     \"result\": {\n         \"ref\": \"/buy/checkout_preview_results/v2/9b0a2af0-cdb5-423f-864f-1a9f8e0a8110\"\n     }\n },\n \"error\": {\n     \"message\": \"Product(s) exceeded quantity limit\",\n     \"httpStatus\": 400,\n     \"errors\": [\n         {\n             \"field\": \"request.items[0].quantity\",\n             \"message\": \"skuId=2f127fe4-78d4-5042-a944-b8a4938aff10, quantity=1000000, quantityLimit=1\",\n             \"code\": \"QUANTITY_INVALID\"\n         }\n     ]\n },\n \"resourceType\": \"job\"\n}\n        \n      \n      Response for a request where the field length limit was exceeded (Checkout Preview and Checkout Submit only):\n        {\n\"id\": \"7a200850-dd7a-4def-9851-e55846db1334\",\n\"status\": \"COMPLETED\",\n\"links\": {\n    \"self\": {\n        \"ref\": \"/buy/checkout_previews/v2/jobs/7a200850-dd7a-4def-9851-e55846db1334\"\n    },\n    \"result\": {\n        \"ref\": \"/buy/checkout_preview_results/v2/7a200850-dd7a-4def-9851-e55846db1334\"\n    }\n},\n\"error\": {\n    \"message\": \"Validation Failed\",\n    \"httpStatus\": 400,\n    \"errors\": [\n        {\n            \"field\": \"request.items[0].recipient.firstName\",\n            \"message\": \"Value is invalid length\",\n            \"code\": \"FIELD_INVALID\"\n        }\n    ]\n},\n\"resourceType\": \"job\"\n}\n        \n      \n      Response for a request where the shipping address country did not match the checkout (i.e. top-level) country (Checkout Preview and Checkout Submit only):\n        {\n\"id\": \"1589b213-2083-4d9d-83ac-79f4c54abbe9\",\n\"status\": \"COMPLETED\",\n\"links\": {\n    \"self\": {\n        \"ref\": \"/buy/checkout_previews/v2/jobs/1589b213-2083-4d9d-83ac-79f4c54abbe9\"\n    },\n    \"result\": {\n        \"ref\": \"/buy/checkout_preview_results/v2/1589b213-2083-4d9d-83ac-79f4c54abbe9\"\n    }\n},\n\"error\": {\n    \"message\": \"Validation Failed\",\n    \"httpStatus\": 400,\n    \"errors\": [\n        {\n            \"field\": \"request.items[0].shippingAddress.country\",\n            \"message\": \"The shipping address country does not match the checkout country\",\n            \"code\": \"FIELD_INVALID\"\n        }\n    ]\n},\n\"resourceType\": \"job\"\n}\n        \n      \n      Response for a request with an invalid shipping method (Checkout Preview only):\n        {\n\"id\": \"827913ea-bad5-4561-8281-d7fd0667856a\",\n\"status\": \"COMPLETED\",\n\"links\": {\n    \"self\": {\n        \"ref\": \"/buy/checkout_previews/v2/jobs/827913ea-bad5-4561-8281-d7fd0667856a\"\n    },\n    \"result\": {\n        \"ref\": \"/buy/checkout_preview_results/v2/827913ea-bad5-4561-8281-d7fd0667856a\"\n    }\n},\n\"error\": {\n    \"message\": \"Invalid shipping method(s)\",\n    \"httpStatus\": 400,\n    \"errors\": [\n        {\n            \"field\": \"request.items[0].shippingMethod\",\n            \"message\": \"shippingMethod=null, styleType=INLINE, country=US, postalCode=47403\",\n            \"code\": \"SHIPPING_METHOD_INVALID\"\n        }\n    ]\n},\n\"resourceType\": \"job\"\n}\n        \n      \n      Response for a request where the contact phone number included invalid character, e.g. hyphens (Checkout Preview and Checkout Submit only):\n        {\n\"id\": \"9278e33a-19c5-4c71-9b2b-164e19b71291\",\n\"status\": \"COMPLETED\",\n\"links\": {\n    \"self\": {\n        \"ref\": \"/buy/checkout_previews/v2/jobs/9278e33a-19c5-4c71-9b2b-164e19b71291\"\n    },\n    \"result\": {\n        \"ref\": \"/buy/checkout_preview_results/v2/9278e33a-19c5-4c71-9b2b-164e19b71291\"\n    }\n},\n\"error\": {\n    \"message\": \"Validation Failed\",\n    \"httpStatus\": 400,\n    \"errors\": [\n        {\n            \"field\": \"request.items[0].contactInfo.phoneNumber\",\n            \"message\": \"Value includes invalid characters\",\n            \"code\": \"FIELD_INVALID\"\n        }\n    ]\n},\n\"resourceType\": \"job\"\n}\n        \n      \n      Response for a request containing an invalid skuId (Checkout Submit only):\n        {\n\"id\": \"5eaca359-12d2-49ee-a6b4-69619d29a2e6\",\n\"status\": \"COMPLETED\",\n\"error\": {\n    \"message\": \"Unable to obtain checkout request\",\n    \"httpStatus\": 400,\n    \"code\": \"REQUEST_INVALID\",\n    \"errors\": []\n},\n\"links\": {\n    \"self\": {\n        \"ref\": \"/buy/checkouts/v2/jobs/5eaca359-12d2-49ee-a6b4-69619d29a2e6\"\n    }\n},\n\"resourceType\": \"job\"\n}\n        \n      \n      Response for a request containing an invalid paymentToken (Checkout Submit only):\n        {\n\"id\": \"745ec668-ff96-40cf-afe4-24080b9cd8c7\",\n\"status\": \"COMPLETED\",\n\"error\": {\n    \"message\": \"Validation Failed\",\n    \"httpStatus\": 400,\n    \"code\": \"PAYMENT_INVALID\",\n    \"errors\": [\n        {\n            \"field\": \"paymentPreviewId\",\n            \"message\": \"Payment failed\",\n            \"code\": \"PAYMENT_INVALID\"\n        }\n    ]\n},\n\"links\": {\n    \"self\": {\n        \"ref\": \"/buy/checkouts/v2/jobs/745ec668-ff96-40cf-afe4-24080b9cd8c7\"\n    }\n},\n\"resourceType\": \"job\"\n}\n        \n      \n      Response for a request containing an invalid shipping method (Checkout Submit only):\n        {\n    \"id\": \"4329122c-740f-4fc0-83cf-d8f0b4bdd1c2\",\n    \"status\": \"COMPLETED\",\n    \"error\": {\n        \"message\": \"Internal Server Error\",\n        \"httpStatus\": 500,\n        \"code\": \"INTERNAL_ERROR\",\n        \"errors\": []\n    },\n    \"links\": {\n        \"self\": {\n            \"ref\": \"/buy/checkouts/v2/jobs/4329122c-740f-4fc0-83cf-d8f0b4bdd1c2\"\n        }\n    },\n    \"resourceType\": \"job\"\n}\n        \n      \n      HTTP 409 response for a request with a previously-used checkout ID but a new entity in request body (Checkout Submit only):\n        {\n\"message\": \"Request conflicts with previous request for same checkout\",\n\"code\": \"REQUEST_INVALID\"\n}\n        \n      \n      Response for a request with a skuID that is not ‘buyable’, e.g. due to upcoming launch (Checkout Preview only):\n        {\n\"id\": \"9278e33a-19c5-4c71-9b2b-164e19b71291\",\n\"status\": \"COMPLETED\",\n\"links\": {\n    \"self\": {\n        \"ref\": \"/buy/checkout_previews/v2/jobs/9278e33a-19c5-4c71-9b2b-164e19b71291\"\n    },\n    \"result\": {\n        \"ref\": \"/buy/checkout_preview_results/v2/9278e33a-19c5-4c71-9b2b-164e19b71291\"\n    }\n},\n\"error\": {\n    \"message\": \"Non buyable product(s)\",\n    \"httpStatus\": 400,\n    \"errors\": [\n        {\n            \"field\": \"request.items[0].skuId\",\n            \"message\": \"skuId=386375f9-4908-52fb-bcd7-d43e42a5f5d3, productId=352ce8c0-e04a-58ba-8d3c-7398d0084958, status=HOLD, startDate=2017-02-23T15:00Z[UTC], endDate=null, availability=true, publishType=LAUNCH\",\n            \"code\": \"PRODUCT_NOT_BUYABLE\"\n        }\n    ]\n},\n\"resourceType\": \"job\"\n}\n        \n      \n      Response for a request with a skuId that is not ‘buyable’, e.g. due to upcoming launch (Checkout Submit only):\n        {\n\"id\": \"c6e266c6-a892-4833-b1df-c98145c66ee7\",\n\"status\": \"COMPLETED\",\n\"error\": {\n    \"message\": \"Invalid launch request\",\n    \"httpStatus\": 401,\n    \"code\": \"REQUEST_INVALID\",\n    \"errors\": [\n        {\n            \"field\": \"request.items[0].skuId\",\n            \"message\": \"productPublishType=LAUNCH not compatible with launch request source=\",\n            \"code\": \"INVALID_LAUNCH_PRODUCT\"\n        }\n    ]\n},\n\"links\": {\n    \"self\": {\n        \"ref\": \"/buy/checkouts/v2/jobs/c6e266c6-a892-4833-b1df-c98145c66ee7\"\n    }\n},\n\"resourceType\": \"job\"\n}\n        \n      \n    \n\n    \n\n    Upgrading to the Latest Version\n\n    Here is the version status of each of the APIs described in this document, along with notes about upgrade paths:\n\n    Checkouts\n\n    The latest version of the Checkouts endpoints is v2. All Nike experiences are currently using v2. If a v3 of any of these endpoints becomes available, then the process of upgrading will be documented here.\n\n    Carts\n\n    The latest version of the Carts is v2. Information for upgrading from v1 to v2 is provided below:\n\n    Carts v1-to-v2 Endpoint Mapping\n\n    Use the following table to understand which v2 endpoint has replaced a corresponding v1 endpoint, and also which endpoints are new with v2:\n\n    \n      \n        \n          V1 Endpoint Name\n          Equivalent V2 Endpoint Name\n        \n      \n      \n        \n          Create or Update a Cart\n          Create or Update a Cart by Cart ID\n        \n        \n          Retrieve Carts by ID\n          Get a Cart by Cart ID\n        \n        \n          Retrieve Carts by Filter\n          Get a Cart by Filter Criteria (Query Param)\n        \n        \n          Delete All Items from a Cart\n          Delete All Items from a Cart by Cart ID\n        \n        \n          None\n          Modify a Cart by Cart ID\n        \n        \n          None\n          Create or Update a Cart by Filter Criteria\n        \n        \n          None\n          Modify a Cart by Filter Criteria\n        \n        \n          None\n          Get a Cart by Filter Criteria (Path Param)\n        \n        \n          None\n          Delete all Items from a Cart by Filter Criteria\n        \n      \n    \n\n    Carts v1-to-v2 Other Changes\n\n    Request Headers\n\n    For all v2 endpoints, the following additional request headers are required for guest (i.e. non-logged-in) users:\n\n    \n      \n        \n          Header Name\n          Description\n        \n      \n      \n        \n          appId\n          Unique application identifier of the calling app\n        \n        \n          x-nike-visitid\n          Count of visits by the guest user\n        \n      \n    \n\n    Query Parameters\n\n    For all v2 GET endpoints where query parameters are used, the fields query parameter is no longer supported.\n\n    Request Body\n\n    The following changes apply to all v2 endpoints with a request body:\n\n    \n      \n        \n          Field Name\n          Description of Change\n        \n      \n      \n        \n          currency\n          Not required at top level as with v1, instead is optional in items.priceInfo object\n        \n        \n          items.giftCard.amount\n          New field added in v2\n        \n        \n          items.recipient\n          New field added in v2\n        \n        \n          items.recipient.firstName\n          New field added in v2\n        \n        \n          items.recipient.lastName\n          New field added in v2\n        \n        \n          items.recipient.altFirstName\n          New field added in v2\n        \n        \n          items.recipient.altLastName\n          New field added in v2\n        \n        \n          items.recipient.givenName\n          New field added in v2\n        \n        \n          items.recipient.middleInitial\n          New field added in v2\n        \n        \n          items.recipient.middleName\n          New field added in v2\n        \n        \n          items.shippingAddress\n          New field added in v2\n        \n        \n          items.shippingAddress.country\n          New field added in v2\n        \n        \n          items.shippingAddress.address1\n          New field added in v2\n        \n        \n          items.shippingAddress.address2\n          New field added in v2\n        \n        \n          items.shippingAddress.address3\n          New field added in v2\n        \n        \n          items.shippingAddress.city\n          New field added in v2\n        \n        \n          items.shippingAddress.county\n          New field added in v2\n        \n        \n          items.shippingAddress.email\n          New field added in v2\n        \n        \n          items.shippingAddress.postalCode\n          New field added in v2\n        \n        \n          items.shippingAddress.state\n          New field added in v2\n        \n      \n    \n\n    Response Body\n\n    The following changes apply to all v2 endpoints with a response body:\n\n    \n      \n        \n          Field Name\n          Description of Change\n        \n      \n      \n        \n          items.priceInfo.fullPrice\n          New field added in v2\n        \n        \n          items.priceInfo.msrp\n          New field added in v2\n        \n      \n    \n\n    Error Messages\n\n    \n      \n        \n          Error Code\n          Description of Change\n        \n      \n      \n        \n          OUT_OF_STOCK\n          New code added in v2\n        \n        \n          INVALID_GIFT_CARD_AMOUNT\n          New code added in v2\n        \n      \n    \n\n    Cart Reviews\n\n    The Cart Reviews endpoint are in v1 due to being released more recently. If a v2 of any of these endpoints becomes available, then the process of upgrading will be documented here.\n\n    Shipping Options\n\n    The Shipping Options endpoint is in v2. If a v3 of this endpoint becomes available, then the process of upgrading will be documented here.\n\n    Best Practices\n\n    Conditions for Retries\n\n    For retry information by Checkout endpoint, visit Retry Patterns for Checkout Clients in Confluence.\n\n    For all Checkout APIs, the general rule is that HTTP 4XX error codes (except for 429) should not be retried but HTTP 5XX errors can be retried. For general information on Nike error retry practices, see API Error Patterns on Confluence.\n\n    Honor the ETAs for Best Performance\n\n    For async endpoints that return an ETA, i.e. the estimated time for the job to be completed, it is important for your app to honor the ETA for best performance. For example, if the ETA is 2000ms, your app should wait 2000ms to start polling the /jobs endpoint to avoid consuming network and other resources unnecessarily.\n\n    Test Scenarios\n\n    Here is an example list of test scenarios for a user experience that is integrating with the Checkout APIs. Note: in this context, inline refers to a regular Nike product as opposed to a customized Nike iD product.\n\n    \n      \n        Single Item (Inline) - Single Payment (Credit Card)\n      \n      \n        Single Item (Inline) - Single Payment (Gift Card)\n      \n      \n        Single Item (Inline) - Single Payment (PayPal)\n      \n      \n        Single Item (NikeID) - Single Payment (Credit Card)\n      \n      \n        Single Item (NikeID) - Single Payment (PayPal)\n      \n      \n        Single Item (Inline) - Multiple Payment (Credit Card &amp; Gift Card)\n      \n      \n        Single Item (NikeID) - Multiple Payment (Credit Card &amp; Gift Card)\n      \n      \n        Mixed Items (Inline &amp; NikeID) - Single Payment (Credit Card)\n      \n      \n        Mixed Items (Inline &amp; NikeID) - Single Payment (PayPal)\n      \n      \n        Mixed Items (Inline &amp; NikeID) - Multiple Payment (Credit Card &amp; Gift Card)\n      \n    \n\n    Additionally, it’s useful to add scenarios for multi-quantity (i.e. quantity &gt; 1) for Inline items, as well as scenarios with multiple Nike iD items in same checkout.\n\n    \n      TIP: While inspecting browser activity on www.nike.com/launch, you can change your shopping country with the flag icon at the upper right of the homepage. Also, as necessary you can place an order to observe all the checkout calls. Orders can be cancelled via self-service within 30 minutes of submission, otherwise contact Nike Customer Service.\n    \n\n    Test Environment\n\n    It is recommended to test all Checkout endpoints in the production environment as opposed to the test environment. Using the test environment can have unpredictable results due to the many downstream services which these endpoints are reliant upon in order to provide typical ‘production-like’ responses.\n\n    There are boundaries for testing in production:\n\n    \n      \n        Performance tests at high volumes should never be done in production.\n      \n      \n        Calling ‘Request a Checkout Submit’ in production can result in actual Nike orders being sent for fulfillment, and actual payment methods being authorized and/or charged. Proceed with caution.\n      \n    \n\n    Caching Data\n\n    None of the endpoints described in this document support caching.\n\n    Error Handling: Which JSON Field Had The Error?\n\n    In error responses from APIs, Nike uses the JSON Pointer standard to indicate which field of the request JSON had the error.\n\n    However, not all Checkout APIs are the same in this regard. This is due to some APIs having been built before Nike decided to use JSON Pointer standard.\n\n    For example, error responses from the Checkouts v2 API will vary from error responses from the Carts API.\n\n    Examples of both:\n\n    Checkouts (built before adopting JSON Pointer standard):\n\n    {\n    \"message\": \"Validation Failed\",\n    \"errors\": [{\n        \"field\": \"request.items[0].contactInfo.email\",\n        \"code\": \"INVALID_EMAIL\",\n        \"message\": \"Invalid email\"\n    }]\n}\n    \n\n    Carts (built after adopting JSON Pointer standard):\n    {\n    \"message\": \"Validation Failed\",\n    \"errors\": [{\n        \"field\": \"/request/items/0/contactInfo/email\",\n        \"code\": \"INVALID_EMAIL\",\n        \"message\": \"Invalid email\"\n    }]\n}\n    \n\n    If you are a client of both of the above APIs, you will need to parse error responses in two different ways.\n\n    Troubleshooting\n\n    Listed below are ways to troubleshoot unexpected responses using this API.\n\n    Use Troubleshooting Tools\n\n    \n      \n        Use the general troubleshooting tips in the Using NDe APIs guide.\n      \n      \n        Use a Splunk query (requires access) to check for issues with your request.\n      \n      \n        Contact the Buy team on the #cic-order-integration Slack channel for assistance.\n      \n    \n\n    Common Questions\n\n    Is it okay to call Checkout APIs if my app is hosted in an Amazon Web Services VPC?\n\n    Yes. The APIs are exposed publicly so it shouldn’t matter where you are calling from. If you are calling repeatedly from a small set of IP addresses, it might be possible that Nike’s bot-mitigation tools could interfere with your ability to make calls. If you are having issues, reach out to us for help.\n\n    My Checkout Submit job is taking a long time to complete. What gives?\n\n    Checkout Submits initiate a lot of behind-the-scenes API calls, the duration of which is somewhat unpredictable. Depending on the total volume of requests happening at the time your request was submitted, combined with the payment method and shipping country selected by the user, it may take several seconds to get a completed job. Best case is about 5 seconds, worst case can be well over a minute. If the job times out, you will get a ‘completed with error’ job status.\n\n    Glossary\n\n    See the Glossary\n\n    Release Notes\n\n    No release notes available.\n\n    Document Change Log\n\n    \n      \n        \n          Summary\n          Date\n          Description\n        \n      \n      \n        \n          Initial draft\n          10/02/2018\n          Initial Draft\n        \n        \n          Added Carts v2\n          03/16/2018\n          Updates based on Carts v2 API being released\n        \n        \n          Updated links\n          03/20/2018\n          Updated links to point to new dev portal\n        \n        \n          Updated external links\n          04/02/2018\n          Updated external links to open in new browser window, commented out ‘Try It Now’ buttons\n        \n      \n    \n\n    Related Links\n\n    NDe Documentation Home\n\n    Getting Started\n\n    Business Guides\n\n    Developer’s Guides"
