							"url": "/#apiapi_product_feeds",
							"content": "Product Feeds API - Developer’s guide\n\n\nLast Updated: 04/03/2018Submit Feedback: API Doc Slack channel #nde-doc\n\nIf you’ve read Using NDe APIs and Get Started With Product Feeds, this guide provides the additional details necessary to integrate with Product Feeds.\n\nIn this guide:\n\nAPI at a Glance\n\nTerms of Service\n\nAuthentication\n\nUse Cases\n\nExample Implementation Diagram\n\nAPI Endpoint Quick Reference\n\nWhat are Cards, Threads, and Feeds?\n\nWhere Do Cards, Threads, and Feeds Come From?\n\nWhat are Channels and Why Do I Need One?\n\nTerminology Differences Between CMS and Product Feeds\n\nMaking Your First API Request\n\nUsing Product Feeds v2\n\nAll Product Feeds\n\nProduct Feed by ID\n\nProduct Threads List\n\nProduct Thread by ID\n\nProduct Feeds Error Handling\n\nUpgrading to the Latest Version\n\nV1.x to V2 Endpoint Mapping\n\nAll Product Feeds &amp; Product Feed by ID v1 to v2 Field Mapping\n\nAll Product Threads &amp; Product Thread by ID v1 to v2 Field Mapping\n\nURL Patterns By Version\n\nBest Practices\n\nTest Environment\n\nTroubleshooting\n\nUse Troubleshooting Tools\n\nCommon Questions\n\nGlossary\n\nRelease Notes\n\nDocument Change Log\n\nRelated Links\n\nAPI at a Glance\n\nProduct Feeds enables users of your app to browse a feed of relevant Nike product-related content, including details about the products with images, videos, and more.\n\n\n  \n    \n      Topic\n      Details\n    \n  \n  \n    \n      Use this API to\n      Access Nike product data and content in the form of Cards, Threads, and Feeds\n    \n    \n      Who calls this API?\n      SNKRS (iOS/Android), Bootroom (Web), Nike.com (Web), Retail Wall (Apple TV)\n    \n    \n      Versions\n      v2\n    \n    \n      Supported Languages\n      See here for supported languages and locales\n    \n    \n      SLA\n      Response time: 250 ms for all endpoints\n    \n    \n      Domain\n      Commerce\n    \n    \n      Prerequisites\n      None (public API)\n    \n    \n      Contact Info\n      Slack: #cic-merchConfluence: Product and Feeds APIProduct Owner: Andy Sun\n    \n  \n\n\n\n  TIP: This guide covers the v2 Product Feeds APIs in detail, as well as the process to upgrade from v1.x to v2. The v1.x endpoints are not otherwise covered in this guide.\n\n\nTerms of Service\n\nIt is highly recommended that you send a caller ID header in every request to this API to help troubleshoot unexpected responses.  See the Registration section of the Using NDe APIs guide on how to create and register your caller ID.\n\nAuthentication\n\nThere are no authentication requirements for Product Feeds except when using the preview query parameter to preview a Feed or Thread, which is not common. See the Using Product Feeds v2 section for more details.\n\nUse Cases\n\n\n  \n    \n      I want to…\n      API(s) to use\n    \n  \n  \n    \n      List all Product Feeds for a specific channel\n      All Product Feeds\n    \n    \n      Get a specific Product Feed by its ID\n      Product Feed by ID\n    \n    \n      List all Product Threads for a channel, language, marketplace, feed ID, SEO slug, style-color, gender, keywords, and more\n      Threads List\n    \n    \n      Get a specific Product Thread by its ID\n      Product Thread by ID\n    \n  \n\n\n\n  TIP: See the Threads List section for the full list of use cases. After that, if you still didn’t find your product use case, check out the Merchandised Products API Developer’s Guide for more.\n\n\nExample Implementation Diagram\n\nHere is an example of a sequence of API calls to get content from Product Feeds v2:\n\n\n\n\n\nAPI Endpoint Quick Reference\n\nProduct Feeds v2 Endpoints\n\n\n  \n    \n      HTTP Verb\n      Endpoint Name\n      Endpoint Description\n      URI Format\n    \n  \n  \n    \n      GET\n      All Product Feeds\n      Get all feeds for a channel\n      /product_feed/feeds/v2{?filter}\n    \n    \n      GET\n      Product Feed by ID\n      Get a specific feed or feed preview by its identifier\n      [product_feed/feeds/v2/{id}]\n    \n    \n      GET\n      Product Threads List\n      Get all threads for a channel, marketplace, language combination\n      /product_feed/threads/v2{?filter,fields,anchor,count,sort,searchTerms}\n    \n    \n      GET\n      Product Thread by ID\n      Get a specific thread by its identifier\n      /product_feed/threads/v2/{id}{?channel,marketplace,language,fields,preview}\n    \n  \n\n\nWhat are Cards, Threads, and Feeds?\n\nUse Product Feeds to get product data and content in the form of Cards, Threads, and Feeds.\n\n Cards contain Nike product information or content such as notifications about upcoming Nike events.\n\n Related Cards are organized into Threads that tell a Nike story.\n\n Multiple Threads make up Feeds, customized for your users based on their chosen preferences in a Nike experience.\n\nTo summarize, a Feed is comprised of multiple Threads, and within each Thread resides a set of Cards. For an in-depth explanation of Cards, Threads, and Feeds, see here.\n\n\n\n\n\nWhere Do Cards, Threads, and Feeds Come From?\n\nThe Product Feeds API combines product information with product content into Cards, Threads, and Feeds by pulling data from the following Nike Cloud APIs:\n\n\n  \n    \n      Cloud API\n      Data Type\n      Examples\n      Data Source\n    \n  \n  \n    \n      Merchandised Product Information\n      Product attributes per style-color, country\n      styleCode, colorCode, status, genders, sportTags\n      Prodigy &amp; Product Information Services\n    \n    \n      Merchandised Product Price\n      Pricing per style-color, country\n      msrp, currentPrice, discounted, currency\n      Prodigy &amp; Product Information Services\n    \n    \n      Merchandised Product SKU\n      SKU-related attributes per style-color-size, country\n      gtin, nikeSize, localizedSize, commodityCode\n      Prodigy &amp; Product Information Services\n    \n    \n      Merchandised Product Content\n      Display-oriented content by style, country\n      colorDescription, fullTitle, colors, bestFor, athletes, widths\n      Prodigy &amp; Product Information Services\n    \n    \n      Product Inventory Availability\n      Inventory availability by style-color\n      true/false\n      Sterling\n    \n    \n      SKU Inventory Availability\n      Inventory availability by style-color-size\n      true/false\n      Sterling\n    \n    \n      Published Content\n      Authored cards and threads\n      title, seo slug, image URL, video URL, text\n      Nike CMS (Content Management System)\n    \n    \n      Launch Views\n      Launch attributes by style-color (SNKRS, Bootroom only)\n      method, startEntryDate, stopEntryDate\n      Launch Admin Tool\n    \n  \n\n\n\n  TIP: The full response from all of the above APIs is passed along to you in the Product Feeds response, i.e. nothing is filtered out by default.\n\n\nWhat are Channels and Why Do I Need One?\n\nA channel is a distinct user experience where Nike products are showcased and made available for purchase, for example in SNKRS or the Nike app. Each channel has a unique channelId (channel identifier) that is required by certain Product Feeds API endpoints. This allows the results in responses to be filtered appropriately for your experience.\n\nEach channelId value originates in Nike CMS under a different name, collectionGroupId.\n\nEach Feed can be associated with one or more channels, opening up the personalized Feed to many Nike experiences.\n\n\n  NOTE: The channelIds used in examples in this guide are invalid. In order to submit requests successfully, you need a valid channelId. Work with the Product Feeds Product Owner to inquire about a channelId for your app.\n\n\nTerminology Differences Between CMS and Product Feeds\n\nAs mentioned earlier, the Product Feeds API pulls product content from Nike CMS and includes it in responses. One thing to be aware of is that Nike CMS sometimes uses different names for the same field than Product Feeds. For example, the CMS collectionGroupId that you will see in responses is synonymous with the channelId query parameter you might send to Product Feeds.\n\nHere is a terminology guide between Nike CMS and Product Feeds:\n\n\n  \n    \n      CMS Term\n      Product Feeds Term\n    \n  \n  \n    \n      Collection Group\n      Channel\n    \n    \n      Collection\n      Feed\n    \n    \n      Content/Thread\n      Thread\n    \n    \n      Node\n      Card\n    \n  \n\n\nMaking Your First API Request\n\nFor your first API request, call Product Feeds v2 to get a list of all Threads for a particular channel:\n\n1. Gather the data\n\nThe Product Feeds v2 Threads List endpoint only supports the HTTP GET method, so you do not need to send a request body. Only the required request headers and URL query parameters should be sent.\n\nThe API.md states that there are no required request headers and the only required query parameter is filter in the format of ?filter=channelId(your_channel_Id_here).\n\n\n  TIP: The channelId value is in UUID format\n\n\nDon’t have a channelId yet? Request that the Product Owner assign one for your app.\n\n2. Create the URL\n\nThe API.md states that the required URL format is [/product_feed/threads/v2{?filter,fields,anchor,count}].\n\nTo build the full URL, prepend https://api.nike.com to the above path, then append after ‘v2’ with the required filter query parameter. The resulting full URL would be:\n\nhttps://api.nike.com/product_feed/feeds/v2?filter=\"channelId(your_channel_Id_here)\".\n\nTest the URL using the Postman app or your favorite browser. You should receive a response body similar to the following (note: your values will vary):\n\n{\n    \"pages\": {\n      \"prev\": \"\",\n      \"next\": \"\"\n    },\n    \"objects\": [\n      {\n        \"id\": \"80bbdb01-114d-474f-a4e3-99e4e70f4931\",\n        \"marketplace\": \"US\",\n        \"language\": \"en\",\n        \"lastFetchTime\": \"2017-02-23T16:42:00.711Z\",\n        \"publishedContent\": {\n          \"collectionGroupId\": \"dc8a8c4b-4924-4e13-a04b-ba96b6b72766\",\n          \"marketplace\": \"US\",\n          \"language\": \"en\",\n          \"resourceType\": \"publishedContent\",\n          \"id\": \"80bbdb01-114d-474f-a4e3-99e4e70f4931\",\n          \"relationalId\": \"80bbdb01-114d-474f-a4e3-99e4e70f4931\",\n          \"version\": \"1487089517266\",\n          \"type\": \"thread\",\n          \"subType\": \"thread\",\n          \"publishStartDate\": \"2017-02-10T17:15:00.000Z\",\n          \"publishEndDate\": \"2999-01-01T08:00:00.000Z\",\n          \"viewStartDate\": \"2017-02-10T17:15:00.000Z\",\n          \"supportedLanguages\": [],\n          \"properties\": {\n            \"title\": \"BEHIND THE DESIGN\",\n            \"coverCard\": {\n              \"id\": \"f97b6bfa-4231-4e69-a3fe-7f83cae4829a\",\n              \"version\": \"1486746663030\",\n              \"type\": \"card\",\n              \"subType\": \"image\",\n              \"properties\": {\n                \"altText\": \"\",\n                \"colorTheme\": \"light\",\n                \"landscapeURL\": \"https://static.nike.com/images/h54tkibftysvmsjkymg9/image.jpg\",\n                \"portraitURL\": \"\",\n                \"squarishURL\": \"\",\n                \"subtitle\": \"Insights from Inside\",\n                \"title\": \"BEHIND THE DESIGN\",\n                \"custom\": {\n                  \"feedImageOverride\": \"landscape\"\n                }\n              }\n            },\n            \"subtitle\": \"\",\n            \"seo\": {\n              \"slug\": \"behind-the-design\"\n            },\n            \"publish\": {\n              \"countries\": [\n                \"US\"\n              ],\n              \"collectionGroups\": [\n                \"dc8a8c4b-4924-4e13-a04b-ba96b6b72766\"\n              ],\n              \"collections\": [\n                \"514dcaea-b752-11e6-80f5-76304dec7eb7\"\n              ]\n            },\n            \"threadType\": \"editorial\",\n            \"products\": [],\n            \"consumerLabels\": [],\n            \"custom\": {\n              \"snkrsDiscover\": {\n                \"order\": \"6\",\n                \"query\": [\n                  \"Behind the Design\"\n                ]\n              }\n            }\n          },\n          \"nodes\": [\n            {\n              \"id\": \"556b8a85-b58d-46ce-bb50-81a17200b44c\",\n              \"version\": \"1486746676247\",\n              \"type\": \"card\",\n              \"subType\": \"image\",\n              \"properties\": {\n                \"landscapeURL\": \"https://static.nike.com/images/yqbuzhb5zypbdz2jfirn/image.jpg\",\n                \"title\": \"\",\n                \"colorTheme\": \"dark\",\n                \"subtitle\": \"\",\n                \"squarishURL\": \"\",\n                \"portraitURL\": \"\",\n                \"altText\": \"\",\n                \"custom\": {\n                  \"threadImageOverride\": \"landscape\"\n                }\n              }\n            },\n            {\n              \"id\": \"3b0e3594-2875-48a5-9367-c05110d0d04c\",\n              \"version\": \"1487089477265\",\n              \"type\": \"card\",\n              \"subType\": \"text\",\n              \"properties\": {\n                \"body\": \"Explore the design process with an inside look at the exclusive designer interviews, original sketches and prototypes.\\n\",\n                \"title\": \"BEHIND THE DESIGN\",\n                \"subtitle\": \"INSIGHTS FROM THE INSIDE\"\n              }\n            }\n          ],\n          \"links\": {\n            \"self\": \"/content/threads/v1/80bbdb01-114d-474f-a4e3-99e4e70f4931?collectionGroupId=dc8a8c4b-4924-4e13-a04b-ba96b6b72766&amp;marketplace=US&amp;language=en\"\n          },\n          \"classifications\": []\n        },\n        \"productInfo\": [],\n        \"resourceType\": \"thread\",\n        \"links\": {\n          \"self\": {\n            \"ref\": \"/product_feed/threads/v2/80bbdb01-114d-474f-a4e3-99e4e70f4931?channel=dc8a8c4b-4924-4e13-a04b-ba96b6b72766&amp;marketplace=US&amp;langauge=en\"\n          }\n        }\n      }\n    ]\n  }\n\n\n3. Execute the request\n\nUltimately you will want to call this API from within your app and this is usually done with a cURL command. For example:\n\ncurl -X GET \\\n     'https://api.nike.com/product_feed/feeds/v2?filter=channelId(your_channel_Id_here)' \\\n     -H 'cache-control: no-cache'\n\n\nMore Complex Examples\n\nNext, let’s call the Threads List endpoint from the Product Feeds v2 API with a combination of query parameters.\n\nPretend that you only want to display Thread content for a NBA Finals campaign called “FINALS FRESH” for the US market and you know that the related SEO slug is ‘finals-fresh’.\n\nYou can send a request with the additional parameters marketplace, language, and publishedContentproperties.seo.slug and get just that.\n\nfilter=marketplace(US)\n\nfilter=language(en)\n\nfilter=publishedContent.properties.seo.slug(finals-fresh)\n\nYour full URL would be:\n\nhttps://api.nike.com/product_feed/threads/v2?filter=channelId(your_channel_id_here)&amp;filter=marketplace(US)&amp;filter=language(en)&amp;filter=publishedContent.properties.seo.slug(finals-fresh)\n\nFinally, query the Threads List endpoint by the Nike style-color code.\n\nPretend that you want to display all Threads for a specific soccer boot and you know that the Nike style-color code is AA0612-706.\n\nYou can send a request with the parameter filter=publishedContent.properties.products.styleColor and include that style-color code:\n\nfilter=publishedContent.properties.products.styleColor(AA0612-706)\n\nYour full URL would be:\n\nhttps://api.nike.com/product_feed/threads/v2?filter=channelId(your_channel_here)&amp;filter=marketplace(US)&amp;filter=language(en)&amp;count=50&amp;filter=publishedContent.properties.products.styleColor(AA0612-706)\n\nUsing Product Feeds v2\n\n\n  \n    All Product Feeds\n  \n  \n    Product Feed by ID\n  \n  \n    Product Threads List\n  \n  \n    Product Thread by ID\n  \n  \n    Product Feeds Error Handling\n  \n\n\nThe following sections explain each Product Feeds endpoint in detail, concluding with a section on error handling.\n\nAll Product Feeds\n\nGet all product feeds for a particular channel by referencing its identifier in the request.\n\nEndpoint Details\n\n\n  \n    \n      HTTP Method\n      URI Path\n      Restricted?\n    \n  \n  \n    \n      GET\n      /product_feed/feeds/v2{?filter}\n      No\n    \n  \n\n\nPath &amp; Query Parameters\n\n\n  \n    \n      Parameter\n      Type\n      Description\n      Data Type\n      Required?\n    \n  \n  \n    \n      filter\n      Query\n      Restrict the response by filter criteria. Only channelId is supported, e.g. ?filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)\n      String\n      Required\n    \n  \n\n\nExample Scenarios\n\n\n  \n    \n      I Want to List\n      Sample Query\n    \n  \n  \n    \n      Feeds for a channelId\n      https://api.nike.com/product_feed/feeds/v2?filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)\n    \n  \n\n\nRequest Headers\n\nThere are no required request headers.\n\nRequest Body\n\nThere is no body for a GET request.\n\nResponse Body\n\nThe important elements of the All Product Feeds response body are as follows:\n\n\n  \n    \n      Element Name\n      Description\n    \n  \n  \n    \n      pages\n      Object at top level containing link to previous and next pages of results\n    \n    \n      pages.prev\n      Link to previous page of results\n    \n    \n      pages.next\n      Link to next page of results\n    \n    \n      objects\n      Array at top level containing feed data\n    \n    \n      objects.id\n      Unique identifier for the feed in UUID format\n    \n    \n      objects.name\n      Human-readable nickname for the feed\n    \n    \n      objects.status\n      Status of the feed/collection, ‘ACTIVE’ or ‘INACTIVE’\n    \n    \n      objects.parentGroupIds\n      Lists all the collection groups (channels) that this feed belongs to\n    \n    \n      objects.imageUrl\n      URL for a full-sized product image\n    \n    \n      objects.listingEnabled\n      Boolean indicator showing whether the feed should be listed\n    \n  \n\n\nSample All Product Feeds response body (HTTP 200):\n\n{\n    \"pages\": {\n        \"prev\": \"\",\n        \"next\": \"\"\n    },\n    \"objects\": [\n        {\n            \"id\": \"01894a4a-9f7a-4b32-b334-651afd0c35ee\",\n            \"name\": \"Air Icarus\",\n            \"status\": \"ACTIVE\",\n            \"parentGroupIds\": [\n                \"79a3408f-590e-4f59-a22c-fd00377a6251\"\n            ],\n            \"imageUrl\": \"https://secure-images.nike.com/is/image/DotCom/896447_004\",\n            \"listingEnabled\": false,\n            \"resourceType\": \"feed\",\n            \"links\": {\n                \"self\": {\n                    \"ref\": \"/product_feed/feeds/v2/01894a4a-9f7a-4b32-b334-651afd0c35ee?channelId=dc8a8c4b-4924-4e13-a04b-ba96b6b72766\"\n                }\n            }\n        },\n        {\n            \"id\": \"02974fb2-0acf-4797-9376-55873c34b4ad\",\n            \"name\": \"Uptempo\",\n            \"status\": \"ACTIVE\",\n            \"parentGroupIds\": [\n                \"79a3408f-590e-4f59-a22c-fd00377a6251\"\n            ],\n            \"imageUrl\": null,\n            \"listingEnabled\": false,\n            \"resourceType\": \"feed\",\n            \"links\": {\n                \"self\": {\n                    \"ref\": \"/product_feed/feeds/v2/02974fb2-0acf-4797-9376-55873c34b4ad?channelId=dc8a8c4b-4924-4e13-a04b-ba96b6b72766\"\n                }\n            }\n        },\n    ]\n}\n\n\n\n\n\n\nProduct Feed by ID\n\nGet a specific product Feed by its unique identifier.\n\nEndpoint Details\n\n\n  \n    \n      HTTP Method\n      URI Path\n      Restricted?\n    \n  \n  \n    \n      GET\n      /product_feed/feeds/v2/{id}\n      No\n    \n  \n\n\nPath &amp; Query Parameters\n\n\n  \n    \n      Parameter\n      Type\n      Description\n      Data Type\n      Required?\n    \n  \n  \n    \n      id\n      Path\n      Unique identifier of the feed in UUID format\n      String\n      Required\n    \n  \n\n\nExample Scenarios\n\n\n  \n    \n      I Want to List\n      Sample Query\n    \n  \n  \n    \n      Single feed by ID\n      https://api.nike.com/product_feed/feeds/v2/01894a4a-9f7a-4b32-b334-651afd0c35ee\n    \n  \n\n\nRequest Headers\n\nThere are no required request headers.\n\nRequest Body\n\nThere is no body for a GET request.\n\nResponse Body\n\nThe important elements of the Product Feed by ID response body are as follows:\n\n\n  \n    \n      Element Name\n      Description\n    \n  \n  \n    \n      id\n      Unique identifier for the feed in UUID format\n    \n    \n      name\n      Human-readable nickname for the feed\n    \n    \n      status\n      Status of the collection, ‘active’ or ‘inactive’\n    \n    \n      parentGroupIds\n      Lists all the collection groups (i.e. channels) that this feed belongs to\n    \n    \n      imageUrl\n      URL for a full-sized product image\n    \n    \n      listingEnabled\n      Boolean indicator showing whether the feed should be listed on a target app\n    \n  \n\n\nSample Product Feed by ID response body (HTTP 200):\n\n{\n    \"id\": \"01894a4a-9f7a-4b32-b334-651afd0c35ee\",\n    \"name\": \"Air Icarus\",\n    \"status\": \"ACTIVE\",\n    \"parentGroupIds\": [\n        \"79a3408f-590e-4f59-a22c-fd00377a6251\"\n    ],\n    \"imageUrl\": \"https://secure-images.nike.com/is/image/DotCom/896447_004\",\n    \"listingEnabled\": false,\n    \"resourceType\": \"feed\",\n    \"links\": {\n        \"self\": {\n            \"ref\": \"/product_feed/feeds/v2/01894a4a-9f7a-4b32-b334-651afd0c35ee?channelId=dc8a8c4b-4924-4e13-a04b-ba96b6b72766\"\n        }\n    }\n}\n\n\n\n\n\n\nProduct Threads List\n\nList all threads by one or more filter criteria, e.g. channel and style-color.\n\nEndpoint Details\n\n\n  \n    \n      HTTP Method\n      URI Path\n      Restricted?\n    \n  \n  \n    \n      GET\n      /product_feed/threads/v2{?filter,fields,anchor,count,sort,searchTerms}\n      No\n    \n  \n\n\nPath &amp; Query Parameters\n\n\n  \n    \n      Parameter\n      Type\n      Description\n      Data Type\n      Required?\n    \n  \n  \n    \n      filter\n      Query\n      Restrict the response by one or more criteria. channelId, marketplace, and language are required\n      String\n      Required\n    \n    \n      fields\n      Query\n      Select the fields to be included in the response\n      String\n      Optional\n    \n    \n      anchor\n      Query\n      Return elements after this anchor\n      String\n      Optional\n    \n    \n      count\n      Query\n      Maximum number of objects to return. Default: 50\n      String\n      Optional\n    \n    \n      sort\n      Query\n      Field(s) by which the results are sorted. Default: publishedContent.viewStartDateDesc, then id.keywordAsc. See below for allowed sort parameters\n      String\n      Optional\n    \n    \n      searchTerms\n      Query\n      Search for threads by one or more keywords separated with spaces. Request exact match by enclosing in double quotes. Default: partial match\n      String\n      Optional\n    \n  \n\n\n\n  TIP: For a list of supported marketplaces (country codes) and languages, see here.\n\n\nAllowed Sort Parameters\n\nThe following are the allowed fields that can be send in the sort query parameter:\n\n\n  \n    publishedContent.publishStartDateAsc\n  \n  \n    publishedContent.publishStartDateDesc\n  \n  \n    publishedContent.viewStartDateAsc\n  \n  \n    publishedContent.viewStartDateDesc\n  \n  \n    productInfo.merchProduct.commerceStartDateAsc\n  \n  \n    productInfo.merchProduct.currentPriceAsc\n  \n  \n    productInfo.merchProduct.currentPriceDesc\n  \n  \n    productInfo.merchProduct.commercePublishDateDesc\n  \n  \n    id.keywordAsc\n  \n  \n    id.keywordDesc\n  \n\n\nAllowed Filter Parameters\n\nThe following is a list of scenarios that illustrate which filter parameters are supported:\n\n\n  \n    \n      I Want to List\n      Sample Query\n    \n  \n  \n    \n      Threads for a channelId, marketplace of US, and language of English\n      https://api.nike.com/product_feed/threads/v2?filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)&amp;filter=marketplace(US)&amp;filter=language(en)\n    \n    \n      Threads for a feed\n      https://api.nike.com/product_feed/threads/v2?filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)&amp;filter=marketplace(US)&amp;filter=language(en)&amp;filter=publishedContent.properties.publish.collections(364c1c0e-f67f-45f0-a107-d0a60876d835)\n    \n    \n      Threads for a SEO slug (short text for search engines)\n      https://api.nike.com/product_feed/threads/v2?filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)&amp;filter=marketplace(US)&amp;filter=language(en)&amp;filter=publishedContent.properties.seo.slug(sock-dart-university-gold-safari-2017)\n    \n    \n      Threads for a style-color code\n      https://api.nike.com/product_feed/threads/v2?filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)&amp;filter=marketplace(US)&amp;filter=language(en)&amp;filter=publishedContent.properties.products.styleColor(942198-700)\n    \n    \n      Threads for a style code\n      https://api.nike.com/product_feed/threads/v2?filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)&amp;filter=marketplace(US)&amp;filter=language(en)&amp;filter=productInfo.merchProduct.styleCode(942198)\n    \n    \n      Threads for a color code\n      https://api.nike.com/product_feed/threads/v2?filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)&amp;filter=marketplace(US)&amp;filter=language(en)&amp;filter=productInfo.merchProduct.colorCode(001)\n    \n    \n      Threads for a product ID\n      https://api.nike.com/product_feed/threads/v2?filter=marketplace(US)&amp;filter=language(en)&amp;filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)filter=productInfo.merchProduct.id(62404604-1e78-5e53-b8f1-6632543cb986)\n    \n    \n      Threads for a gender name\n      https://api.nike.com/product_feed/threads/v2?filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)&amp;filter=marketplace(US)&amp;filter=language(en)&amp;filter=productInfo.merchProduct.genders(WOMEN)\n    \n    \n      Threads for a Merch Product channel name\n      https://api.nike.com/product_feed/threads/v2?filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)&amp;filter=marketplace(US)&amp;filter=language(en)&amp;filter=productInfo.merchProduct.channels(SNKRS)\n    \n    \n      Threads Merch Product main color\n      https://api.nike.com/product_feed/threads/v2?filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)&amp;filter=marketplace(US)&amp;filter=language(en)&amp;filter=productInfo.merchProduct.mainColor(true)\n    \n    \n      Threads for product attribute “best for”\n      https://api.nike.com/product_feed/threads/v2?filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)&amp;filter=marketplace(US)&amp;filter=language(en)&amp;filter=productInfo.productContent.bestFor.value(Firm%20Ground)\n    \n    \n      Threads with buyable product\n      https://api.nike.com/product_feed/threads/v2?filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)&amp;filter=marketplace(US)&amp;filter=language(en)&amp;filter=inStock(true)\n    \n    \n      Threads with a specific available size\n      https://api.nike.com/product_feed/threads/v2?filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)&amp;filter=marketplace(US)&amp;filter=language(en)&amp;filter=availableSizes(9)\n    \n    \n      Threads with a specific available localized size\n      https://api.nike.com/product_feed/threads/v2?filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)&amp;filter=marketplace(US)&amp;filter=language(en)&amp;filter=availableLocalizedSizes(27)\n    \n    \n      Threads for an athlete\n      https://api.nike.com/product_feed/threads/v2?filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)&amp;filter=marketplace(US)&amp;filter=language(en)&amp;filter=productInfo.productContent.athletes.value(Kobe%20Bryant)\n    \n    \n      Threads for a channel with only selected fields returned\n      https://api.nike.com/product_feed/threads/v2?filter=marketplace(US)&amp;filter=language(en)&amp;filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)&amp;fields=publishedContent.properties.products.styleColor,publishedContent.nodes.nodes.properties.squarishURL,productInfo.merchPrice.currentPrice\n    \n    \n      Threads for keywords ‘Chuck Taylor’\n      https://api.nike.com/product_feed/threads/v2?filter=marketplace(US)&amp;filter=language(en)&amp;filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)&amp;searchTerms=Chuck%20Taylor\n    \n    \n      Threads for a product rollup key\n      https://api.nike.com/product_feed/threads/v2?filter=marketplace(US)&amp;filter=language(en)&amp;filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)&amp;filter=productInfo.merchProduct.productRollup.key(YPTArgON)\n    \n    \n      Threads for upcoming products\n      https://api.nike.com/product_feed/threads/v2?filter=marketplace(US)&amp;filter=language(en)&amp;filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)&amp;filter=upcoming(true)&amp;sort=productInfo.merchProduct.commerceStartDateAsc\n    \n    \n      Thread for a thread ID\n      https://api.nike.com/product_feed/threads/v2?filter=marketplace(US)&amp;filter=language(en)&amp;filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)filter=id(2efdc3a4-7214-3a88-b1b0-4083dc9657d5))\n    \n    \n      Threads for Exclusive Access products\n      https://api.nike.com/product_feed/threads/v2?filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)&amp;filter=language(en)&amp;filter=marketplace(US)&amp;filter=exclusiveAccess(true,false)\n    \n    \n      Threads for a Global Trade Identification Number (GTIN)\n      https://api.nike.com/product_feed/threads/v2?filter=channelId(79a3408f-590e-4f59-a22c-fd00377a6251)&amp;filter=language(en)&amp;filter=marketplace(US)&amp;filter=productInfo.skus.gtin(00884500634190)\n    \n  \n\n\n\n  TIPS:\n\n\n\n  \n    Use dot notation to indicate nesting while using the fields parameter, e.g. field1.field2. Always start your nesting below the objects element of the response structure, so rather than objects.id use id, for example.\n  \n\n\n\n  \n    Most filters allow comma-separated values to retrieve multiple values at a time: ?filter=productInfo.merchProduct.styleCode(942198,AA1697)\n  \n\n\nUsing Search-Based Queries\n\nSend one or more search keywords in the searchTerms query parameter to list only the threads that contain those keywords. In order for a thread to be returned in the response, all included keywords must be found in a searchable field within that thread.\n\nThe four searchable fields are:\n\n\n  \n    productInfo.productContent.fullTitle\n  \n  \n    productInfo.productContent.title\n  \n  \n    productInfo.productContent.subtitle\n  \n  \n    publishedContent.properties.consumerLabels.classification.text\n  \n\n\nFor example, using searchTerms=Chuck Taylor would return any threads where the words ‘Chuck’ and ‘Taylor’ are found anywhere in a searchable field.\n\nThe default search behavior is partial match. Limiting the search to only full string matches can be done by enclosing the keywords in double quotes, like searchTerms=\"Chuck Taylor\". In this case, the thread must contain the exact full string ‘Chuck Taylor’ in a searchable field in order to be returned in the response.\n\nRequest Headers\n\nThere are no required request headers.\n\nRequest Body\n\nThere is no body for a GET request.\n\nResponse Body\n\nThe important elements of the Threads List response body are as follows:\n\n\n  Note: The productInfo array contains responses from up to 8 other APIs, and are formatted according to the same schema as the source APIs. Rather than list out all of the elements in this table, links are provided to the relevant API.md for you to find the corresponding response schema.\n\n\n\n  \n    \n      Element Name\n      Description\n    \n  \n  \n    \n      pages\n      Object at top level containing link to previous and next pages of results\n    \n    \n      pages.prev\n      Link to previous page of results\n    \n    \n      pages.next\n      Link to next page of results\n    \n    \n      objects\n      Array at top level containing feed data\n    \n    \n      objects.id\n      Unique identifier for the feed in UUID format\n    \n    \n      objects.marketplace\n      ISO 3166 two-letter country code for the user’s current location\n    \n    \n      objects.language\n      BCP-47 language code\n    \n    \n      objects.lastFetchTime\n      Time when the data was aggregated in ISO-8601 compliant format: yyyy-MM-ddTHH:mm:ss.SSSZZ\n    \n    \n      objects.active\n      Boolean indicator for whether or not this thread is currently available for general use\n    \n    \n      objects.publishedContent\n      Object containing display-oriented information, such as image links and prose descriptions\n    \n    \n      objects.publishedContent.collectionGroupId\n      Identifier for CMS collection group in UUID format. Synonymous to channelId\n    \n    \n      objects.publishedContent.marketplace\n      Marketplace of the thread as ISO 3166 country code format, e.g. ‘US’\n    \n    \n      objects.publishedContent.language\n      Language of the thread using BCP 47 format\n    \n    \n      objects.publishedContent.id\n      Thread identifier in UUID format\n    \n    \n      objects.publishedContent.relationalId\n      Identifier of parent thread in UUID format. Ties various language threads to the source version\n    \n    \n      objects.publishedContent.version\n      Version of CMS content node. String\n    \n    \n      objects.publishedContent.publishStartDate\n      Date-time string of when the publishing schedule is set to start\n    \n    \n      objects.publishedContent.publishEndDate\n      Date-time string of when the publishing schedule is set to end\n    \n    \n      objects.publishedContent.viewStartDate\n      Date-time string of when the thread can be viewed on client apps\n    \n    \n      objects.publishedContent.supportedLanguages\n      Array containing list of languages that are currently available\n    \n    \n      objects.publishedContent.properties\n      Free-form JSON object that contains properties for the thread\n    \n    \n      objects.publishedContent.properties.title\n      Thread title\n    \n    \n      objects.publishedContent.properties.products\n      Array containing thread products\n    \n    \n      objects.publishedContent.properties.products.styleColor\n      Identifier for product style-color, e.g. 831958-616\n    \n    \n      objects.publishedContent.properties.products.productId\n      Product identifier in UUID format\n    \n    \n      objects.publishedContent.properties.publish\n      Array containing relational data about thread\n    \n    \n      objects.publishedContent.properties.publish.countries\n      List of ISO 3166 country codes that the thread has been published to\n    \n    \n      objects.publishedContent.properties.publish.collectionGroups\n      List of collection groups (UUID) that the thread belongs to\n    \n    \n      objects.publishedContent.properties.publish.collections\n      List of collections (UUID) that the thread belongs to\n    \n    \n      objects.publishedContent.properties.consumerLabels\n      Array of tags/classifications on the thread\n    \n    \n      objects.publishedContent.properties.consumerLabels.classification\n      Object containing classification info\n    \n    \n      objects.publishedContent.properties.consumerLabels.classification.type\n      Type of classification, e.g. TAXONOMY\n    \n    \n      objects.publishedContent.properties.consumerLabels.classification.id\n      Identifier of the classification value in UUID format\n    \n    \n      objects.publishedContent.properties.consumerLabels.classification.text\n      Text value for the classification\n    \n    \n      objects.publishedContent.properties.consumerLabels.value\n      Object containing classification value info\n    \n    \n      objects.publishedContent.properties.consumerLabels.value.type\n      Type of classification value, e.g. TAXONOMY\n    \n    \n      objects.publishedContent.properties.consumerLabels.value.id\n      Identifier of the classification value in UUID format\n    \n    \n      objects.publishedContent.properties.consumerLabels.value.text\n      Text for the classification value\n    \n    \n      objects.publishedContent.properties.threadType\n      Type of thread, e.g. product\n    \n    \n      objects.publishedContent.properties.relatedThreads\n      Array containing a list of related threads by their UUIDs\n    \n    \n      objects.publishedContent.properties.seo\n      Object containing SEO info\n    \n    \n      objects.publishedContent.properties.seo.title\n      Title tag for SEO\n    \n    \n      objects.publishedContent.properties.seo.description\n      Meta description for SEO\n    \n    \n      objects.publishedContent.properties.seo.keywords\n      Keywords for SEO\n    \n    \n      objects.publishedContent.properties.seo.slug\n      URL SEO slug of the thread\n    \n    \n      objects.publishedContent.properties.coverCard\n      Object containing info about the cover card\n    \n    \n      objects.publishedContent.properties.coverCard.id\n      Identifier of cover card in UUID format\n    \n    \n      objects.publishedContent.properties.coverCard.version\n      Specific version number of the cover card\n    \n    \n      objects.publishedContent.properties.coverCard.type\n      Type of content, e.g. card\n    \n    \n      objects.publishedContent.properties.coverCard.subType\n      Subtype of card, e.g. image, video, carousel, text\n    \n    \n      objects.publishedContent.properties.coverCard.properties\n      Free-form JSON object that contains properties for the card\n    \n    \n      objects.publishedContent.properties.coverCard.properties.altText\n      Cover card image alternate text\n    \n    \n      objects.publishedContent.properties.coverCard.properties.colorTheme\n      Cover card image color theme, i.e. dark\n    \n    \n      objects.publishedContent.properties.coverCard.properties.landscapeURL\n      URL for landscape cover card image\n    \n    \n      objects.publishedContent.properties.coverCard.properties.portraitURL\n      URL for portrait cover card image\n    \n    \n      objects.publishedContent.properties.coverCard.properties.squarishURL\n      URL for squarish cover card image\n    \n    \n      objects.publishedContent.properties.coverCard.properties.subtitle\n      Cover card image subtitle\n    \n    \n      objects.publishedContent.properties.coverCard.properties.title\n      Cover card image title\n    \n    \n      objects.publishedContent.nodes\n      Array of card info\n    \n    \n      objects.publishedContent.nodes.id\n      Card identifier in UUID format\n    \n    \n      objects.publishedContent.nodes.version\n      Card version identifier\n    \n    \n      objects.publishedContent.nodes.type\n      Card type, i.e. ‘card’\n    \n    \n      objects.publishedContent.nodes.subType\n      Card subtype (text, image, video, carousel)\n    \n    \n      objects.publishedContent.nodes.properties\n      Object containing info about the card, varies by card type\n    \n    \n      objects.publishedContent.nodes.properties.loop\n      Boolean for whether video will loop or not\n    \n    \n      objects.publishedContent.nodes.properties.providerId\n      Name of video provider\n    \n    \n      objects.publishedContent.nodes.properties.subtitle\n      Subtitle for video\n    \n    \n      objects.publishedContent.nodes.properties.colorTheme\n      Color theme for video, i.e. dark\n    \n    \n      objects.publishedContent.nodes.properties.videoId\n      Identifier for video\n    \n    \n      objects.publishedContent.nodes.properties.autoPlay\n      Boolean for whether video will auto-play or not\n    \n    \n      objects.publishedContent.nodes.properties.title\n      Card title\n    \n    \n      objects.publishedContent.nodes.properties.body\n      Card body text\n    \n    \n      objects.publishedContent.nodes.properties.actions\n      Array of action info\n    \n    \n      objects.publishedContent.nodes.properties.actions.actionType\n      Type of action\n    \n    \n      objects.publishedContent.nodes.properties.actions.product\n      Object containing product info for the action\n    \n    \n      objects.publishedContent.nodes.properties.actions.product.styleColor\n      Style-color code\n    \n    \n      objects.publishedContent.nodes.properties.actions.product.productId\n      Product identifier in UUID format\n    \n    \n      objects.publishedContent.nodes.properties.actions.destinationType\n      Type of destination, i.e link\n    \n    \n      objects.publishedContent.nodes.properties.actions.destinationId\n      Identifier for destination, i.e. a URL\n    \n    \n      objects.publishedContent.nodes.properties.speed\n      Speed of video\n    \n    \n      objects.publishedContent.classifications\n      Array of classifications\n    \n    \n      objects.publishedContent.classifications.classification\n      Object containing classification info\n    \n    \n      objects.publishedContent.classifications.classification.type\n      Type of classification\n    \n    \n      objects.publishedContent.classifications.classification.id\n      Identifier of the classification value\n    \n    \n      objects.publishedContent.classifications.classification.text\n      Text value for the classification\n    \n    \n      objects.publishedContent.classifications.value.type\n      Type of classification value\n    \n    \n      objects.publishedContent.classifications.value.id\n      Identifier of the classification value\n    \n    \n      objects.publishedContent.classifications.value.text\n      Text for the classification value\n    \n    \n      objects.productInfo\n      Array of responses from other APIs with product info\n    \n    \n      objects.productInfo.merchProduct\n      API.md link\n    \n    \n      objects.productInfo.merchPrice\n      API.md link\n    \n    \n      objects.productInfo.availability\n      API.md link\n    \n    \n      objects.productInfo.productContent\n      API.md link\n    \n    \n      objects.productInfo.imageUrls\n      Object containing product image URL\n    \n    \n      objects.productInfo.imageUrls.productImageUrl\n      URL for product image\n    \n    \n      objects.productInfo.skus\n      API.md link\n    \n    \n      objects.productInfo.availableSkus\n      &lt;a href=https://bitbucket.nike.com/projects/PHYLINV/repos/v2-deliver-api/browse/availability/API.MD#!/Sku_Availability/get_deliver_available_skus_v1_id” target=”_blank”&gt;API.md link&lt;/a&gt;\n    \n    \n      objects.productInfo.launchView\n      API.md link\n    \n  \n\n\nSample Threads List response body (HTTP 200):\n\n\n  TIP: Scroll to the right to see the entire code snippet.\n\n\n{\n    \"pages\": {\n        \"prev\": \"\",\n        \"next\": \"\"\n    },\n    \"objects\": [\n        {\n            \"id\": \"2383e522-7d71-4ad7-8d9f-506aad2d8923\",\n            \"channelId\": \"dc8a8c4b-4924-4e13-a04b-ba96b6b72766\",\n            \"channelName\": \"BOOTROOM\",\n            \"marketplace\": \"US\",\n            \"language\": \"en\",\n            \"lastFetchTime\": \"2017-10-19T05:28:29.983Z\",\n            \"active\": true,\n            \"publishedContent\": {\n                \"collectionGroupId\": \"dc8a8c4b-4924-4e13-a04b-ba96b6
