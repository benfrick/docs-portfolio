     \n          brand\n          Path\n          Brand name of the shopping cart\n          string\n          Required\n        \n        \n          channel\n          Path\n          Sales channel of the shopping cart\n          string\n          Required\n        \n      \n    \n\n    Request Headers\n\n    See the required request headers of the Modify a Cart by Cart ID endpoint as it is the same for this endpoint.\n\n    Request Body\n\n    See the request body format and sample request of the Modify a Cart by Cart ID endpoint as it is the same for this endpoint.\n\n    Response Body\n\n    See the response body format and sample response of the Modify a Cart by Cart ID endpoint as it is the same for this endpoint.\n\n    Get a Cart by Filter Criteria (Path Param)\n\n    Retrieve a user’s cart by country, brand, and (optionally) channel values sent as path parameters. The default format of each cart in the HTTP 200 response is the same as doing a GET by ID.\n\n    Endpoint Details\n\n    \n      \n        \n          HTTP Method\n          URI Path\n          JWT Restricted?\n        \n      \n      \n        \n          GET\n          /buy/carts/v2?filter\n          no\n        \n      \n    \n\n    Path &amp; Query Parameters\n\n    \n      \n        \n          Parameter\n          Type\n          Description\n          Data Type\n          Required?\n        \n      \n      \n        \n          country\n          Path\n          ISO 3166-1 two-letter code\n          string\n          Required\n        \n        \n          brand\n          Path\n          Brand name, e.g. ‘NIKE’\n          string\n          Required\n        \n        \n          channel\n          Path\n          Sales channel\n          string\n          Optional\n        \n      \n    \n\n    Request Headers\n\n    Required request headers:\n\n    \n      \n        \n          Header Name\n          Description\n          Member\n          Guest\n          Employee\n        \n      \n      \n        \n          Accept\n          Content type you will accept in response, application/json is only value allowed\n          X\n          X\n          X\n        \n        \n          Content-Type\n          Content type of the request, application/json is only value allowed\n          X\n          X\n          X\n        \n        \n          Authorization\n          Your access token in the format of Bearer {token} indicating the customer is logged in\n          X\n           \n          X\n        \n        \n          x-nike-visitorid\n          Identifier for the guest (i.e. not logged-in) user, validated by the Edge router and passed through to the service\n           \n          X\n           \n        \n        \n          x-nike-visitid\n          Count of visits by the guest user\n           \n          X\n           \n        \n        \n          appId\n          Unique application identifier of the calling app\n           \n          X\n           \n        \n      \n    \n\n    Request Body\n\n    There is no body on a GET request.\n\n    Response Body\n\n    See the response body from the Create or Update Cart by Cart ID endpoint as it is the same for this endpoint.\n\n    Delete All Items from a Cart by Filter Criteria\n\n    Delete all items in a cart by country, brand, and (optionally) channel values sent as path parameters and receive a HTTP 204 response if successful. Subsequent calls to GET that same cart ID will return a HTTP 404 status (‘Not Found’).\n\n    \n      Note: The delete operation is optional; carts will automatically purge from storage after 90 days of inactivity.\n    \n\n    Endpoint Details\n\n    \n      \n        \n          HTTP Method\n          URI Path\n          JWT Restricted?\n        \n      \n      \n        \n          DELETE\n          /buy/carts/v2/{id}\n          no\n        \n      \n    \n\n    Path &amp; Query Parameters\n\n    \n      \n        \n          Parameter\n          Type\n          Description\n          Data Type\n          Required?\n        \n      \n      \n        \n          id\n          Path\n          Unique client-generated identifier for the cart\n          string\n          Required\n        \n      \n    \n\n    Request Headers\n\n    \n      \n        \n          Header Name\n          Description\n          Member\n          Guest\n          Employee\n        \n      \n      \n        \n          Accept\n          Content type you will accept in response, application/json is only value allowed\n          X\n          X\n          X\n        \n        \n          Content-Type\n          Content type of the request, application/json is only value allowed\n          X\n          X\n          X\n        \n        \n          Authorization\n          Your access token in the format of Bearer {token} indicating the customer is logged in\n          X\n           \n          X\n        \n        \n          x-nike-visitorid\n          Identifier for the guest (i.e. not logged-in) user, validated by the Edge router and passed through to the service\n           \n          X\n           \n        \n        \n          x-nike-visitid\n          Count of visits by the guest user\n           \n          X\n           \n        \n        \n          appId\n          Unique application identifier of the calling app\n           \n          X\n           \n        \n      \n    \n\n    Request Body\n\n    There is no body on a DELETE request.\n\n    Response Body\n\n    The HTTP 204 response (successful delete) returns an empty response body.\n\n    Carts v2 Error Handling\n\n    Following is a summary of the errors and warnings that can come back in responses from the Carts v2 API:\n\n    \n      \n        \n          HTTP Response Code\n          Relevant HTTP Method(s)\n          Error Code\n          Error Description\n          Action to Take\n        \n      \n      \n        \n          400\n          GET, PUT, PATCH\n          REQUEST_INVALID\n          Request was structurally invalid, such as malformed JSON.\n          Check the URL, syntax of the request body, or item quantity for validity.\n        \n        \n          400\n          PUT, PATCH\n          MISSING_REQUIRED\n          Required field(s) missing in the request (e.g. cart ID, country, brand, etc.\n          Retry the request while supplying the missing field/value\n        \n        \n          400\n          PUT, PATCH\n          INVALID_VALUE\n          Value of field(s) in the request not valid (e.g. &gt;100 items, unsupported country code and/or brand, etc.).\n          Check the indicated field/value. Correct and retry\n        \n        \n          400\n          GET, PUT, PATCH\n          PRODUCT_NOT_BUYABLE\n          Item sku not ‘buyable’, either due to being inactive, being outside sell dates, or launch product purchase being attempted outside of launch.\n          Notify user as necessary\n        \n        \n          400\n          PUT, PATCH\n          ITEM_QUANTITY_LIMIT\n          Quantity limit (for single cart) exceeded for the item sku.\n          Notify the user as necessary\n        \n        \n          400\n          PUT, PATCH\n          INVALID_QUANTITY\n          The item total requested quantity was too high.\n           \n        \n        \n          500\n          GET, PUT, PATCH, DELETE\n          SYSTEM_ERROR\n          Error occurred processing the request.\n           \n        \n        \n          503\n          GET, PUT, PATCH, DELETE\n          N/A\n          Service unavailable\n           \n        \n        \n          401\n          GET, PUT, PATCH, DELETE\n          35\n          The operation was requested by an unauthorized user.\n          Check that your access token was sent in Authorization request header in format Bearer {token} or that the token has not expired.\n        \n        \n          404\n          GET\n          N/A\n          The operation was not requested by the cart owner or ownership was not provided.\n          Check that the access token sent in the request header was for the correct user.\n        \n        \n          404\n          GET\n          N/A\n          Cart just created or cart has expired\n          If cart was just created, try GET again later or do a PUT. If cart was created &gt; 180 days ago, create a new cart.\n        \n        \n          409\n          PUT, PATCH\n          N/A\n          Cart ID already exists and is associated with a different user ID, country or brand.\n          Choose a unique cartId and retry.\n        \n        \n          200\n          PUT, PATCH\n          VALUE_ADDED_SERVICE_INVALID\n          VAS associated with the item is invalid.\n           \n        \n        \n          200\n          PUT, PATCH\n          VALUE_ADDED_SERVICE_SKU_COMBINATION_INVALID\n          The items on the cart is not a VAS item.\n           \n        \n        \n          200\n          PUT, PATCH\n          EXCLUSIVE_OFFER_INVALID\n          OfferId used on the item is not valid.\n           \n        \n        \n          200\n          PUT, PATCH\n          EXCLUSIVE_OFFER_PRODUCT_COMBINATION_INVALID\n          OfferId applied on on-exclusive access product.\n           \n        \n        \n          200\n          PUT, PATCH\n          INTERNAL_ERROR\n          Error occurred while calling the exclusive access service for validating the offer.\n           \n        \n        \n          200\n          PUT, PATCH\n          OUT_OF_STOCK\n          Item does not have available inventory.\n          Notify the user as necessary\n        \n        \n          200\n          PUT, PATCH\n          INVALID_GIFT_CARD_AMOUNT\n          Gift Card does not have a valid price amount.\n          Notify the user as necessary\n        \n        \n          200\n          GET, PUT, PATCH\n          PRICE_CHANGED\n          This is a warning only that the price of an item or value-added service has changed since the item was added to the cart.\n          Notify the user as necessary\n        \n      \n    \n\n    Example error response bodies:\n\n    \n      Response for a request where the values in items.id (cart line item number) were not unique:\n        {\n \"code\": \"REQUEST_INVALID\",\n \"message\": \"Bad Request\",\n \"errors\": [\n     {\n         \"code\": \"REQUEST_INVALID\",\n         \"field\": \"/item/id\",\n         \"message\": \"Item ids are not unique\"\n     }\n ]\n}\n        \n      \n      Response for a request that included an invalid country value:\n        {\n \"code\": \"CART_COUNTRY_INVALID\",\n \"message\": \"Bad Request\"\n}\n        \n      \n      Response for a request where the items.quantity value exceeded the allowed limit:\n        {\n \"code\": \"ITEM_QUANTITY_LIMIT\",\n \"message\": \"Product item quantity limit exceeded. skuId=ef3222c4-5571-591f-b450-9f87a09df9e3, productId=2bff389a-59b9-5b86-9cbb-30b82f932b6e, itemQuantity=1,000, accumulatedQuantity=1,000, quantityLimit=10\",\n \"field\": \"/items/0/quantity\"\n}\n        \n      \n      Response for a request that included an invalid value (not a UUID) in items.skuId:\n        {\n \"message\": \"Request validation failed\",\n \"errors\": [\n     {\n         \"field\": \"items..skuId\",\n         \"code\": \"INVALID_VALUE\",\n         \"message\": \"The field value is invalid\"\n     }\n ]\n}\n        \n      \n    \n\n    \n\n    Using Cart Reviews\n\n    \n      \n        Cart Reviews Overview\n      \n      \n        Augment a Cart\n      \n      \n        Cart Reviews Error Handling\n      \n    \n\n    Cart Reviews Overview\n\n    After the customer has provided a shipping address and chosen a shipping method, use this service to retrieve an enhanced cart summary before the customer proceeds to the checkout process. Use the Cart Reviews API in conjunction with the Carts API to achieve this.\n\n    Cart Reviews returns sales and shipping taxes, estimated delivery date(s), and shipping group information (when applicable), as well as item and subtotal information for a customer’s cart.\n\n    \n      TIP: Shipping group refers to the grouping of items into multiple shipments with potentially different delivery dates. This is done automatically for you based on Nike business rules.\n    \n\n    More Facts About Cart Reviews:\n\n    \n      \n        To get sales tax and shipping tax, the request must include postal code.\n      \n      \n        To get estimated delivery date(s), the request must include the shipping method(s) the shopper had selected.\n      \n      \n        To get shipping group information, the request must include the shipping method and the shipping address associated with each item.\n      \n      \n        Items with the same shipping address and same shipping method will be in the same shipping group. If two items have either a different shipping address or different shipping method, the two items will be in different shipping groups in the response.\n      \n      \n        This API is ‘ephemeral’ in that it does not create a resource for later retrieval.\n      \n      \n        Subsequent calls for a given cart may result in different responses if underlying tax or delivery estimate details have changed.\n      \n      \n        Requests not having a fields parameter will return the complete cart reviews response content.\n      \n      \n        The Cache-Control response header indicates that responses must not be cached and thus not used across multiple requests.\n      \n    \n\n    \n      TIP: It is a best practice to send all of the optional request headers and request body fields, if the data is available, to avoid unexpected responses.\n    \n\n    The following section describes the endpoint of the Cart Reviews API in detail:\n\n    Augment a Cart\n\n    Endpoint Details\n\n    \n      \n        \n          HTTP Method\n          URI Path\n          JWT Restricted?\n        \n      \n      \n        \n          POST\n          /buy/cart_reviews/v1\n          no\n        \n      \n    \n\n    Path &amp; Query Parameters\n\n    \n      \n        \n          Parameter\n          Type\n          Description\n          Data Type\n          Required?\n        \n      \n      \n        \n          fields\n          Query\n          Fields to be included in the response (all fields included by default)\n          string\n          Optional\n        \n      \n    \n\n    Request Headers\n\n    Required request headers:\n\n    \n      \n        \n          Header Name\n          Description\n          Member\n          Guest\n          Employee\n        \n      \n      \n        \n          Accept\n          Content type you will accept in response, application/json is only value allowed\n          X\n          X\n          X\n        \n        \n          Content-Type\n          Content type of the request, application/json is only value allowed\n          X\n          X\n          X\n        \n        \n          Authorization\n          Your access token in the format of Bearer {token} indicating the customer is logged in\n          X\n           \n          X\n        \n        \n          x-nike-visitorid\n          Identifier for the guest (i.e. not logged-in) user, validated by the Edge router and passed through to the service\n           \n          X\n           \n        \n      \n    \n\n    Request Body\n\n    \n      \n        \n          Element Name\n          Required?\n          Description\n        \n      \n      \n        \n          country\n          Required\n          ISO 3166 country code, e.g. US\n        \n        \n          currency\n          Required\n          ISO 4217 currency code, e.g. USD\n        \n        \n          brand\n          Required\n          Nike brand name associated with the cart, only NIKE is supported\n        \n        \n          items\n          Required\n          Array containing list of item objects, with the following required fields:\n        \n        \n          items.id\n          Required\n          Unique identifier of the line item in the request. You create this value.\n        \n        \n          items.skuId\n          Required\n          Stock Keeping Unit (SKU) unique identifier of the product, as obtained from Nike Product services.\n        \n        \n          items.quantity\n          Required\n          Unit quantity (integer) of the SKU.\n        \n        \n          items.shippingAddress\n          Required\n          Address to which items are to be shipped. Only the following field is required:\n        \n        \n          items.shippingAddress.country\n          Required\n          Shipping address country. 2-alpha character ISO 3166 country code.\n        \n        \n          channel\n          Optional\n          Sales channel of the shopping cart, only ‘NIKECOM’ is supported. Located at top level of request.\n        \n        \n          shippingMethod\n          Optional\n          The method by which the item will be shipped. Located under items array. Only the following field is required:\n        \n        \n          shippingMethod.id\n          Optional\n          The identifier for the shipping method, e.g. ‘STANDARD’ for standard ground shipping in the US.\n        \n        \n          valueAddedServices\n          Optional\n          List of value-added service (VAS) line items. One or more VAS line items can be associated with a Nike product (i.e. skuId). Examples of VAS are a customization service for a shoe or a gift-wrapping service.\n        \n        \n          valueAddedServices.id\n          Optional\n          Unique identifier for the VAS. In nested Instruction object, the following are required:\n        \n        \n          valueAddedServices.Instruction.id\n          Optional\n          Instruction unique identifier for the value-added service, related to the various service domains, e.g. design id for Nike iD customization.\n        \n        \n          valueAddedServices.Instruction.type\n          Optional\n          Instruction Type, e.g. customization/nike_id (only one currently available), customization/my_print, customization/gift_card, buy/gift_wrap, buy/gift_message.\n        \n      \n    \n\n    \n      TIPS:\n    \n\n    \n      \n        For the list of supported country code and currency code combinations, see here.\n      \n    \n\n    \n      \n        Use the same brand and channel values for all calls for a particular cart, else you will get a 409 Conflict error when the value varies from the initial PUT.\n      \n    \n\n    \n      \n        Although optional, send the postalCode in the shippingAddress in addition to the required country code. If so, the sales tax will be returned in items.priceInfo.tax and shipping tax will be returned in items.shippingCosts.priceInfo.tax.\n      \n    \n\n    \n      \n        Although optional, if you send a valid shippingMethod in the request, the net shipping cost for the item will be returned in shippingCosts.priceInfo.total. If you also send a valid postalCode in the shippingAddress, the shipping tax for the item will be returned in shippingCosts.priceInfo.tax and also in shippingCosts.taxes.total.\n      \n    \n\n    \n      \n        To retrieve VAS data to include in your checkout request, call the Merchandised Value Added Services endpoints of the Merchandised Products API. See the Merchandised Products API Developer’s Guide for more information.\n      \n    \n\n    Sample Cart Reviews request body:\n\n    {\n  \"country\": \"US\",\n  \"currency\": \"USD\",\n  \"brand\": \"NIKE\",\n  \"channel\": \"NIKECOM\",\n  \"items\": [\n    {\n      \"id\": \"9892b8cb-e4ac-42af-a8bb-3454d8509d32\",\n      \"skuId\": \"d3d15345-63e6-4cf9-9135-c2beacbbe352\",\n      \"quantity\": 1,\n      \"valueAddedServices\": [\n        {\n          \"id\": \"88d0475d-30e5-4c2f-9a87-7a31938f8ace\",\n          \"instruction\": {\n            \"id\": \"2027261230\",\n            \"type\": \"customization/nike_id\"\n          }\n        }\n      ],\n      \"shippingMethod\": {\n        \"id\": \"STANDARD\"\n      },\n      \"shippingAddress\": {\n        \"city\": \"Beaverton\",\n        \"state\": \"OR\",\n        \"postalCode\": \"97006\",\n        \"country\": \"US\",\n        \"county\": \"Washington\"\n      }\n    },\n    {\n      \"id\": \"e945e0fd-cdcf-4005-9fe4-9302b9d6235c\",\n      \"skuId\": \"f030bb22-4859-404e-82c9-aa9a23582e4f\",\n      \"quantity\": 1,\n      \"shippingMethod\": {\n        \"id\": \"STANDARD\"\n      },\n      \"shippingAddress\": {\n        \"city\": \"Beaverton\",\n        \"state\": \"OR\",\n        \"postalCode\": \"97006\",\n        \"country\": \"US\",\n        \"county\": \"Washington\"\n      }\n    }\n  ]\n}\n    \n\n    Response Body\n\n    Sample Cart Reviews response body:\n\n    {\n  \"resourceType\": \"buy/cart_reviews\",\n  \"country\": \"US\",\n  \"currency\": \"USD\",\n  \"brand\": \"NIKE\",\n  \"channel\": \"NIKECOM\",\n  \"shippingGroups\": [\n    {\n      \"items\": [\n        {\n          \"id\": \"9892b8cb-e4ac-42af-a8bb-3454d8509d32\",\n          \"skuId\": \"d3d15345-63e6-4cf9-9135-c2beacbbe352\",\n          \"quantity\": 1,\n          \"priceInfo\": {\n            \"price\": 200,\n            \"subtotal\": 200,\n            \"discount\": 0,\n            \"valueAddedServices\": 0,\n            \"total\": 200\n          },\n          \"valueAddedServices\": [\n            {\n              \"id\": \"88d0475d-30e5-4c2f-9a87-7a31938f8ace\",\n              \"instruction\": {\n                \"id\": \"2027261230\",\n                \"type\": \"customization/nike_id\"\n              },\n              \"priceInfo\": {\n                \"price\": 0,\n                \"subtotal\": 0,\n                \"discount\": 0,\n                \"valueAddedServices\": 0,\n                \"total\": 0\n              }\n            }\n          ],\n          \"taxes\": [\n            {\n              \"type\": \"SALESTAX\",\n              \"rate\": 10,\n              \"total\": 20\n            }\n          ]\n        },\n        {\n          \"id\": \"e945e0fd-cdcf-4005-9fe4-9302b9d6235c\",\n          \"skuId\": \"f030bb22-4859-404e-82c9-aa9a23582e4f\",\n          \"quantity\": 1,\n          \"priceInfo\": {\n            \"price\": 75,\n            \"subtotal\": 75,\n            \"discount\": 0,\n            \"valueAddedServices\": 0,\n            \"total\": 75\n          },\n          \"taxes\": [\n            {\n              \"type\": \"SALESTAX\",\n              \"rate\": 10,\n              \"total\": 7.5\n            }\n          ]\n        }\n      ],\n      \"shippingMethod\": {\n        \"id\": \"STANDARD\",\n        \"estimatedDelivery\": \"2016-02-09T00:00:00.000-08:00\"\n      },\n      \"shippingAddress\": {\n        \"city\": \"Beaverton\",\n        \"state\": \"OR\",\n        \"postalCode\": \"97006\",\n        \"country\": \"US\",\n        \"county\": \"Washington\"\n      },\n      \"shippingCosts\": {\n        \"priceInfo\": {\n          \"price\": 8,\n          \"discount\": 8,\n          \"total\": 0,\n          \"taxTotal\": 0\n        },\n        \"taxes\": [\n          {\n            \"type\": \"SHIPPINGTAX\",\n            \"rate\": 10,\n            \"total\": 0\n          }\n        ]\n      }\n    }\n  ],\n  \"totals\": {\n    \"subtotal\": 275,\n    \"valueAddedServicesTotal\": 0,\n    \"shippingTotal\": 0,\n    \"discountTotal\": 0,\n    \"total\": 275\n  }\n}\n    \n\n    Cart Reviews Error Handling\n\n    Following is a summary of the errors and warnings that can come back in responses from the Cart Reviews API:\n\n    \n      \n        \n          HTTP Response Code\n          Relevant HTTP Method(s)\n          Error Code\n          Error Description\n          Action to Take\n        \n      \n      \n        \n          400\n          POST\n          MISSING_REQUIRED\n          A required field or fields in the request was missing. Examples include not providing cart ID, country, brand etc.\n          Retry the request while supplying the missing field/value\n        \n        \n          400\n          POST\n          INVALID_FIELD\n          The value of a field or fields in the request was not valid. Examples include providing too many items, country code and/or brand not supported, etc.\n          Check the indicated field/value. Correct and retry\n        \n        \n          400\n          POST\n          INVALID_SKU\n          Item SKU not found or not valid for the country.\n          Check the skuId. Correct and retry.\n        \n        \n          401\n          POST\n          35\n          The operation was requested by an unauthorized user.\n          Check that your access token was sent in Authorization request header in format Bearer {token} or that the token has not expired.\n        \n        \n          404\n          POST\n          310\n          The resource you requested does not exist.\n          Check the URL. Adjust as necessary and retry\n        \n        \n          500\n          POST\n          n/a\n          Request was structurally invalid, such as malformed JSON.\n          Check the syntax of the request body, or item quantity for validity.\n        \n        \n          500\n          POST\n          Server error\n          Error occurred processing the request.\n          Bad shipping method? skuId isn’t in UUID format? Line item id not in UUID format?\n        \n      \n    \n\n    Example error response bodies:\n\n    \n      Response for a request that included an invalid skuId:\n        {\n \"httpStatus\": 400,\n \"timestamp\": 1500926608289,\n \"message\": \"Bad Request\",\n \"errors\": [\n     {\n         \"code\": \"INVALID_SKU\",\n         \"field\": \"sku.id\",\n         \"message\": \"Invalid skuId\"\n     }\n ]\n}\n        \n      \n      Response for a request that included a skuId which was not in UUID format:\n        {\n \"httpStatus\": 500,\n \"timestamp\": 1500926568225,\n \"service\": \"cartreviews\",\n \"message\": \"Server error\"\n}\n        \n      \n      Response for a reqeust that included an id (line item identifier) which was not in UUID format:\n        {\n \"httpStatus\": 500,\n \"timestamp\": 1500924543763,\n \"service\": \"cartreviews\",\n \"message\": \"Server error\"\n}\n        \n      \n      Response for a request sent to an incorrect URL\n        {\n \"error_id\": \"fa494ed5-7144-4771-9e11-dc7a86500ab5\",\n \"errors\": [\n     {\n         \"code\": 310,\n         \"message\": \"The resource you requested does not exist.\"\n     }\n ]\n}\n        \n      \n      Response for a request that included a line item ID which was not unique:\n        {\n \"httpStatus\": 400,\n \"timestamp\": 1500925852389,\n \"message\": \"Bad Request\",\n \"errors\": [\n     {\n         \"code\": \"INVALID_REQUEST\",\n         \"field\": \"/item/id\",\n         \"message\": \"Item ids are not unique\"\n     }\n ]\n}\n        \n      \n      Response for a request that was missing the required field ‘country’:\n        {\n \"httpStatus\": 400,\n \"timestamp\": 1500924336435,\n \"message\": \"Bad Request\",\n \"errors\": [\n     {\n         \"code\": \"MISSING_REQUIRED\",\n         \"field\": \"country\",\n         \"message\": \"Required field\"\n     }\n ]\n        \n      \n      Response for a request that included an invalid country code:\n        {\n \"httpStatus\": 400,\n \"timestamp\": 1500924180370,\n \"message\": \"Bad Request\",\n \"errors\": [\n     {\n         \"code\": \"INVALID_FIELD\",\n         \"field\": \"country\",\n         \"message\": \"Invalid field\"\n     }\n ]\n        \n      \n      Response for a request that had multiple errors:\n        {\n \"httpStatus\": 400,\n \"timestamp\": 1500928588847,\n \"message\": \"Bad Request\",\n \"errors\": [\n     {\n         \"code\": \"INVALID_REQUEST\",\n         \"field\": \"brand\",\n         \"message\": \"Invalid value for the field\"\n     },\n     {\n         \"code\": \"INVALID_REQUEST\",\n         \"field\": \"/item/id\",\n         \"message\": \"Item ids are not unique\"\n     }\n ]\n}\n        \n      \n    \n\n    \n\n    Using Shipping Options\n\n    \n      \n        Shipping Options Overview\n      \n      \n        Shipping Options\n      \n      \n        Shipping Options Error Handling\n      \n    \n\n    Shipping Options Overview\n\n    Shoppers are accustomed to selecting a shipping method (e.g. Standard, Two-Day, Next-Day) during the checkout process. But how do you know which methods to present to them, based on their shopping context?\n\n    Use the Shipping Options v2 API to retrieve the customer’s available shipping methods for a checkout, including associated costs and estimated delivery dates/ranges.\n\n    \n      TIP: It is a best practice to send all of the optional request headers and request body fields, if the data is available, to avoid unexpected responses.\n    \n\n    Shipping Options\n\n    Send a request with a country code, currency code, item information and (optionally) shipping address information to this endpoint to get the list of available shipping methods, along with associated costs/taxes and estimated delivery date(s). This endpoint calculates shipping discounts such as free shipping for members.\n\n    Endpoint Details\n\n    \n      \n        \n          HTTP Method\n          URI Path\n          JWT Restricted?\n        \n      \n      \n        \n          POST\n          /buy/shipping_options/v2\n          no\n        \n      \n    \n\n    Request Headers\n\n    Required request headers:\n\n    \n      \n        \n          Header Name\n          Description\n          Member\n          Guest\n          Employee\n        \n      \n      \n        \n          Accept\n          Content type you will accept in response, application/json is only value allowed\n          X\n          X\n          X\n        \n        \n          Content-Type\n          Content type of the request, application/json is only value allowed\n          X\n          X\n          X\n        \n        \n          Authorization\n          Your access token in the format of Bearer {token} indicating the customer is logged in\n          X\n           \n          X\n        \n        \n          x-nike-visitorid\n          Identifier for the guest (i.e. not logged-in) user, validated by the Edge router and passed through to the service\n           \n          X\n           \n        \n      \n    \n\n    Request Body\n\n    \n      \n        \n          Element Name\n          Required?\n          Description\n        \n      \n      \n        \n          country\n          Required\n          ISO 3166 country code, e.g. US\n        \n        \n          currency\n          Required\n          ISO 4217 currency code, e.g. USD\n        \n        \n          items\n          Required\n          Array containing list of item objects, with the following required fields:\n        \n        \n          items.id\n          Required\n          Unique identifier of the line item in the request. You create this value.\n        \n        \n          items.skuId\n          Required\n          Stock Keeping Unit (SKU) unique identifier of the product, as obtained from Nike Product services.\n        \n        \n          valueAddedServices\n          Optional\n          List of value-added service (VAS) line items. One or more VAS line items can be associated with a Nike product (i.e. skuId). Examples of VAS are a customization service for a shoe or a gift-wrapping service.\n        \n        \n          valueAddedServices.id\n          Optional\n          Unique identifier for the VAS. In nested Instruction object, the following are required:\n        \n        \n          valueAddedServices.Instruction.id\n          Optional\n          Instruction unique identifier for the value-added service, related to the various service domains, e.g. design id for Nike iD customization.\n        \n        \n          valueAddedServices.Instruction.type\n          Optional\n          Instruction Type, e.g. customization/nike_id (only one currently available), customization/my_print, customization/gift_card, buy/gift_wrap, buy/gift_message.\n        \n        \n          shippingAddress\n          Optional\n          The address to which items are to be shipped. Required fields are postalCode and country. Complete list of fields here:\n        \n        \n          shippingAddress.address1\n          Optional\n          Shipping address line one.\n        \n        \n          shippingAddress.address2\n          Optional\n          Shipping address line two.\n        \n        \n          shippingAddress.address3\n          Optional\n          Shipping address line three.\n        \n        \n          shippingAddress.city\n          Optional\n          Shipping address city.\n        \n        \n          shippingAddress.state\n          Optional\n          Shipping address state. This should be the ISO 3166-2 subdivision code. For the US, this is the 2-alpha state code as defined in ISO 3166-2:US.\n        \n        \n          shippingAddress.postalCode\n          Optional\n          Shipping address postal code. In the US, this is the 5-digit or the 5-plus-4-digit zip code.\n        \n        \n          shippingAddress.country\n          Optional\n          Shipping address country. 2-alpha character ISO 3166 country code.\n        \n        \n          shippingAddress.county\n          Optional\n          Shipping address county. This will typically be used for non-US addresses to hold specific regional data.\n        \n        \n          promotionCodes\n          Optional\n          Array containing promotion codes that the user has attempted to apply\n        \n      \n    \n\n    \n      TIPS:\n    \n\n    \n      \n        For the list of supported country code and currency code combinations, see here.\n      \n    \n\n    \n      \n        To retrieve VAS data to include in your checkout request, call the Merchandised Value Added Services endpoints of the Merchandised Products API. See the Merchandised Products API Developer’s Guide for more information.\n      \n    \n\n    \n      \n        Although optional, including a shippingAddress is recommended whenever possible. In China, shipping methods can vary based on the province, city, and district combination. Also, for certain countries (e.g. US), including the shipping address can get you an estimated delivery date versus an estimated delivery range.\n      \n    \n\n    Sample Shipping Options request body:\n\n    {\n  \"country\": \"US\",\n  \"currency\": \"USD\",\n  \"items\": [\n    {\n      \"id\": \"a05dcb8a-79e5-4f69-bc30-213dd93f429c\",\n      \"skuId\": \"15611769-e81b-45dd-b28c-ca0effb272de\",\n      \"valueAddedServices\": [\n        {\n          \"id\": \"88d0475d-30e5-4c2f-9a87-7a31938f8ace\",\n          \"instruction\": {\n            \"id\": \"2027261230\",\n            \"type\": \"customization/nike_id\"\n          }\n        }\n      ],\n      \"shippingAddress\": {\n        \"address1\": \"1234 NW Test\",\n        \"city\": \"Beaverton\",\n        \"state\": \"OR\",\n        \"postalCode\": \"97006\",\n        \"country\": \"US\"\n      }\n    }\n  ]\n}\n    \n\n    Response Body\n\n    The HTTP 200 success response from Shipping Options reflects back many elements from the request body and also includes the following new information to the client:\n\n    \n      \n        \n          Element Name\n          Description\n        \n      \n      \n        \n          shippingMethods\n          Array under items containing information about the shipping methods available to your shopper based on the data sent in the request\n        \n        \n          shippingMethods.id\n          Shipping method name\n        \n        \n          shippingMethods.daysToArrive\n          DEPRECATED - do not use\n        \n        \n          shippingMethods.estimatedDelivery\n          Estimated delivery date (in nested date field) or date range (in nested range.min and range.max for the shipping method. You will get either a date or a date range, not both.\n        \n        \n          shippingMethods.estimateDelivery.id\n          Identifier for the delivery estimate\n        \n        \n          shippingMethods.estimateDelivery.date\n          Estimated delivery date\n        \n        \n          shippingMethods.estimateDelivery.range\n          Estimated delivery range (see min/max nested)\n        \n        \n          shippingMethods.estimateDelivery.range.minDate\n          Earliest date within range that the delivery can be completed\n        \n        \n          shippingMethods.estimateDelivery.range.maxDate\n          Latest date within range that the delivery can be completed\n        \n        \n          shippingMethods.priceInfo\n          Price information for shipping method. Contains the following:\n        \n        \n          shippingMethods.priceInfo.cost\n          Base price of shipping method\n        \n        \n          shippingMethods.priceInfo.discount\n          Discount amount applied (if any)\n        \n        \n          shippingMethods.priceInfo.total\n          Net price of shipping method (cost - discount)\n        \n        \n          shippingMethods.promotionDiscounts\n          Array of applied promotion codes and their discount amounts\n        \n        \n          shippingMethods.promotionDiscounts.code\n          Promotion code associated with the discount (entered by user)\n        \n        \n          shippingMethods.promotionDiscounts.amount\n          Promotion discount amount\n        \n        \n          shippingMethods.promotionDiscounts.id\n          Promotion unique identifier\n        \n      \n    \n\n    \n      TIP: The date value(s) in estimatedDelivery object are in the ISO-8601 format of yyyy-mm-ddThh:mm:ss.mssZ and in UTC with zero offset, e.g. 2017-07-18T18:25:45.237Z. Convert to the local date (or date/time) of the shopper as necessary.\n    \n\n    Sample Shipping Options response body:\n\n    {\n    \"resourceType\": \"shippingOptions\",\n    \"country\": \"US\",\n    \"currency\": \"USD\",\n    \"items\": [\n        {\n            \"id\": \"7e909b64-fbb1-5dc7-bf39-a67fcfefb7b8\",\n            \"skuId\": \"d76dfbd7-13fb-5675-9365-2a8859750c15\",\n            \"shippingMethods\": [\n                {\n                    \"id\": \"STANDARD\",\n                    \"daysToArrive\": 5,\n                    \"estimatedDelivery\": {\n                        \"range\": {\n                            \"minDate\": \"2017-06-28T23:19:50.33Z\",\n                            \"maxDate\": \"2017-07-01T23:19:50.33Z\"\n                        }\n                    },\n                    \"priceInfo\": {\n                        \"cost\": 8,\n                        \"discount\": 8,\n                        \"total\": 0\n                    }\n                },\n                {\n                    \"id\": \"TWO_DAY\",\n                    \"daysToArrive\": 4,\n                    \"estimatedDelivery\": {\n                        \"range\": {\n                            \"minDate\": \"2017-06-28T23:19:50.443Z\",\n                            \"maxDate\": \"2017-06-29T23:19:50.443Z\"\n                        }\n                    },\n                    \"priceInfo\": {\n                        \"cost\": 15,\n                        \"discount\": 0,\n                        \"total\": 15\n                    }\n                },\n                {\n                    \"id\": \"NEXT_DAY\",\n                    \"daysToArrive\": 2,\n                    \"estimatedDelivery\": {\n                        \"range\": {\n                            \"minDate\": \"2017-06-27T23:19:50.544Z\",\n                            \"maxDate\": \"2017-06-29T23:19:50.544Z\"\n                        }\n                    },\n                    \"priceInfo\": {\n                        \"cost\": 25,\n                        \"discount\": 0,\n                        \"total\": 25\n                    }\n                }\n            ]\n        }\n    ]\n}\n    \n\n    Shipping Options Error Handling\n\n    Following is a summary of the errors and warnings that can come back in responses from the Shipping Options API:\n\n    \n      \n        \n          HTTP Response Code\n          Relevant HTTP Method(s)\n          Error Code\n          Error Description\n          Action to Take\n        \n      \n      \n        \n          400\n          POST\n          MISSING_REQUIRED\n          “Request body contained invalid JSON”\n          Check the syntax of the request body, or item quantity for validity.\n        \n        \n          400\n          POST\n          MISSING_REQUIRED\n          A required field or fields in the request was missing. Examples include not providing cart ID, country, brand etc.\n          Retry the request while supplying the missing field/value\n        \n        \n          400\n          POST\n          FIELD_INVALID\n          The value of a field or fields in the request was not valid. Examples include providing too many items, country code and/or brand not supported, etc.\n          Check the indicated field/value. Correct and retry\n        \n        \n          401\n          POST\n          35\n          The operation was requested by an unauthorized user.\n          Check that your access token was sent in Authorization request header in format Bearer {token} or that the token has not expired.\n        \n        \n          404\n          POST\n          310\n          The resource you requested does not exist.\n          Check the URL. Adjust as necessary and retry\n        \n        \n          500\n          POST\n          Server error\n          Error occurred processing the request.\n          skuId invalid or isn’t in UUID format? Line item id not in UUID format?\n        \n      \n    \n\n    Example error response bodies:\n\n    \n      Response for a request containing an invalid country code:\n        {\n \"code\": \"INPUT_VALIDATION_FAILED\",\n \"message\": \"Validation Failed\",\n \"errors\": [\n     {\n         \"field\": \"/country\",\n         \"code\": \"FIELD_INVALID\",\n         \"message\": \"ECMA 262 regex \\\"^[A-Z]{2}$\\\" does not match input string \\\"\\\"\"\n     }\n ]\n}\n        \n      \n      Response for a request sent to an unrecognized URL:\n        {\n \"error_id\": \"40b05032-bd51-46b3-bd05-19eb261055e9\",\n \"errors\": [\n     {\n         \"code\": 310,\n         \"message\": \"The resource you requested does not exist.\"\n     }\n ]\n}\n        \n      \n      Response for a request that was missing a required field:\n        {\n \"code\": \"INPUT_VALIDATION_FAILED\",\n \"message\": \"Validation Failed\",\n \"errors\": [\n     {\n         \"field\": \"country\",\n         \"code\": \"MISSING_REQUIRED\",\n         \"message\": \"object has missing required properties ([\\\"country\\\"])\"\n     }\n ]\n}\n        \n      \n      Response for a request with malformed JSON:\n        {\n \"code\": \"MISSING_REQUIRED\",\n \"message\": \"Request body contained invalid JSON\",\n \"errors\": []\n}\n        \n      \n    \n\n    \n\n    Using Checkouts\n\n    \n      \n        Checkouts Overview\n      \n      \n        Request Checkout Preview\n      \n      \n        Retrieve Checkout Preview Job\n      \n      \n        Retrieve Checkout Preview Results\n      \n      \n        Request Checkout Submit\n      \n      \n        Retrieve Checkout Submit Job\n      \n      \n        Retrieve Checkout Results\n      \n      \n        Request Checkout Submit (Launch)\n      \n      \n        Checkouts Error Handling\n      \n    \n\n    Checkouts Overview\n\n    The Checkouts v2 API allows you to create, validate, and submit a checkout to Nike for fulfillment. What exactly is a checkout? (Hint: it’s like an order).\n\n    A checkout consists of all data necessary for defining the following:\n\n    \n      \n        Consumer’s product choices (items, quantities, value-added services)\n      \n      \n        Consumer’s payment method(s) and billing address(es)\n      \n      \n        Consumer’s shipping method(s) and shipping address(es)\n      \n      \n        Pricing\n      \n      \n        Taxes\n      \n      \n        Discounts\n      \n    \n\n    Through calls to Checkout and other Nike APIs, you can maintain the state of the shopper’s checkout in your client application and then submit the checkout to Nike for approval and fulfillment.\n\n    \n      TIP: It is a best practice to send all of the optional request headers and request body fields, if the data is available, to avoid unexpected responses.\n    \n\n    Request Checkout Preview\n\n    The Request a Checkout Preview endpoint allows you to check that the items, shipping method(s), and shipping address(es) included in a checkout are valid based on Nike pricing and address rules. Additionally, you’ll get item pricing and tax, shipping fee and tax, and checkout subtotals in the response.\n\n    Checkout Preview Is Optional, But Recommended\n\n    Is it not required to call Request Checkout Preview in order for your shopper to complete their purchase. However, it is recommended.\n\n    In a typical Nike digital experience, a successful checkout preview means that the checkout details are accurate, including shipping fees and taxes, and that the checkout process can proceed to the payment steps.\n\n    Use the response to display the final payment amount to the customer. Once the customer confirms the payment method details and clicks or taps ‘Place Order’, there will be a greater chance of success.\n\n    \n      TIP: For more context, see a step-by-step example of all the calls in a checkout in the diagram in the Use Cases section of this document. For more info about Payment, see the Payment Domain Developer’s Guide.\n    \n\n    Checkout Preview Operates Asynchronously\n\n    This endpoint operates asynchronously which means that there are extra steps to retrieve the results of your request. Read the Asynchronous Operation section of the Using NDe APIs guide to learn more.\n\n    Endpoint Details\n\n    \n      \n        \n          HTTP Method\n          URI Path\n          JWT Restricted?\n        \n      \n      \n        \n          PUT\n          /buy/checkout_previews/v2/{id}\n          no\n        \n      \n    \n\n    Path &amp; Query Parameters\n    |Parameter|Type|Description|Data Type|Required?|\n|—|—|—|—|—|\n|id|Path|Unique client-generated identifier (UUID) for the checkout|string|Required|\n\n    Request Headers\n\n    Required request headers:\n\n    \n      \n        \n          Header Name\n          Description\n          Member\n          Guest\n          Employee\n        \n      \n      \n        \n          Accept\n          Content type you will accept in response, application/json is only value allowed\n          X\n          X\n          X\n        \n        \n          Content-Type\n          Content type of the request, application/json is only value allowed\n          X\n          X\n          X\n        \n        \n          Authorization\n          Your access token in the format of Bearer {token} indicating the customer is logged in\n          X\n           \n          X\n        \n        \n          x-nike-visitorid\n          Identifier for the guest (i.e. not logged-in) user, validated by the Edge router and passed through to the service\n           \n          X\n           \n        \n        \n          appId\n          Your application identifier\n           \n          X\n           \n        \n      \n    \n\n    Request Body\n\n    \n      \n        \n          Element Name\n          Required?\n          Description\n        \n      \n      \n        \n          request\n          Required\n          Top-level object in request schema\n        \n        \n          email\n          Required\n          Email address for the shopper\n        \n        \n          country\n          Required\n          2-alpha character ISO 3166 country code, e.g US\n        \n        \n          currency\n          Required\n          ISO 4217 currency code for the shopper, e.g. USD\n        \n        \n          locale\n          Required\n          Posix-formatted locale code, e.g. en_US\n        \n        \n          channel\n          Required\n          Selling channel name associated with the checkout, e.g. ‘SNKRS’\n        \n        \n          items\n          Required\n          Array containing list of products and value-added services to be previewed. The minimum values that need to be sent in this section are:\n        \n        \n          items.id\n          Required\n          Unique identifier of the line item in the array. You create this value\n        \n        \n          items.skuId\n          Required\n          Stock Keeping Unit (SKU) unique identifier of the product, as obtained from Nike Product services\n        \n        \n          items.quantity\n          Required\n          Unit quantity (integer) of the line item, as chosen by the shopper\n        \n        \n          items.recipient\n          Required\n          Person to which the items are to be shipped, as entered by the shopper:\n        \n        \n          items.recipient.firstName\n          Required\n          First name of the person receiving the items\n        \n        \n          items.recipient.lastName\n          Required\n          Last name of the person receiving the items\n        \n        \n          items.shippingAddress\n          Required\n          Address to which items are to be shipped, as entered by the shopper:\n        \n        \n          items.shippingAddress.address1\n          Required\n          Shipping address line one\n        \n        \n          items.shippingAddress.city\n          Required\n          Shipping address city\n        \n        \n          items.shippingAddress.country\n          Required\n          Shipping address country\n        \n        \n          items.shippingMethod\n          Required\n          Identifier for the shipping method, as obtained from the Nike Shipping Options API and selected by the shopper, e.g. ‘STANDARD’ for standard ground shipping in the US\n        \n        \n          clientInfo\n          Optional\n          Information about the client system making the request to the API\n        \n        \n          clientInfo.deviceId\n          Optional\n          ‘Fingerprint’ of the device making the request\n        \n        \n          clientInfo.client\n          Optional\n          Name of client making the request, e.g. ‘com.nike.commerce.snkrs.web’\n        \n        \n          valueAddedServices\n          Optional\n          List of value-added service (VAS) line items. One or more VAS line items can be associated with a Nike product (i.e. skuId). Examples of VAS: a customization service for a shoe or a gift-wrapping service\n        \n        \n          valueAddedServices.id\n          Optional\n          Unique identifier for the VAS. In nested Instruction object, the following are required:\n        \n        \n          valueAddedServices.Instruction.id\n          Optional\n          Instruction unique identifier for the value-added service, related to the various service domains, e.g. design id for Nike iD customization\n        \n        \n          valueAddedServices.Instruction.type\n          Optional\n          Instruction Type, e.g. customization/nike_id (only one currently available), customization/my_print, customization/gift_card, buy/gift_wrap, buy/gift_message\n        \n        \n          promotionCodes\n          Optional\n          Array containing list of promotion codes being applied to the checkout\n        \n      \n    \n\n    \n      TIPS:\n    \n\n    \n      \n        For the list of supported country code and currency code combinations, see here.\n      \n    \n\n    \n      \n        To retrieve VAS data to include in your checkout request, call the Merchandised Value Added Services endpoints of the Merchandised Products API. See the Merchandised Products API Developer’s Guide for more information.\n      \n    \n\n    Sample Request a Checkout Preview request body:\n    {\n     \"request\": {\n       \"email\": \"null@null.com\",\n       \"country\": \"US\",\n       \"currency\": \"USD\",\n       \"locale\": \"en_US\",\n       \"channel\": \"SNKRS\",\n       \"clientInfo\": {\n         \"deviceId\": \"iPhone\"\n       },\n       \"items\": [\n         {\n           \"id\": \"a05dcb8a-79e5-4f69-bc30-213dd93f429c\",\n           \"skuId\": \"15611769-e81b-45dd-b28c-ca0effb272de\",\n           \"quantity\": 1,\n           \"valueAddedServices\": [\n             {\n               \"id\": \"88d0475d-30e5-4c2f-9a87-7a31938f8ace\",\n               \"instruction\": {\n                 \"id\": \"2027261230\",\n                 \"type\": \"customization/nike_id\"\n               }\n             },\n             {\n               \"id\": \"ac9fd9d3-3815-44ce-8b1f-18cce7abd488\",\n               \"instruction\": {\n                 \"id\": \"1027551960\",\n                 \"type\": \"customization/nike_id\"\n               },\n               \"priceInfo\": {\n                 \"price\": 12,\n                 \"discount\": 0,\n                 \"total\": 12,\n                 \"priceSnapshotId\": \"12319076-f81c-4fdb-8beb-2510ba74e9ff\"\n               }\n             }\n           ],\n           \"recipient\": {\n             \"firstName\": \"John\",\n             \"altFirstName\": \"J\",\n             \"lastName\": \"Doe\",\n             \"altLastName\": \"Deer\",\n             \"middleName\": \"Henry\",\n             \"middleInitial\": \"H\",\n             \"givenName\": \"John H. Deer\"\n           },\n           \"shippingAddress\": {\n             \"address1\": \"1234 NW Test\",\n             \"address2\": \"Suite 22\",\n             \"address3\": \"Door 1\",\n             \"city\": \"Beaverton\",\n             \"state\": \"OR\",\n             \"postalCode\": \"97006\",\n             \"country\": \"US\",\n             \"county\": \"Washington\"\n           },\n           \"contactInfo\": {\n             \"phoneNumber\": \"555-555-5555\",\n             \"email\": \"null@null.com\"\n           },\n           \"shippingMethod\": \"STANDARD\"\n         }\n       ]\n     }\n   }\n    \n\n    Response Body\n\n    The HTTP 202 response from Request Checkout Preview contains information about how to retrieve the results of your job via the ‘Retrieve Checkout Preview Job’ endpoint. Following are the descriptions of the important fields in the response body:\n\n    \n      \n        \n          Element Name\n          Description\n        \n      \n      \n        \n          id\n          Checkout id you sent in the request, also your job ID\n        \n        \n          status\n          Status of the job\n        \n        \n          eta\n          Estimated wait time before polling the jobs endpoint to get your results\n        \n        \n          links\n          Relative URL path you can use to poll the jobs endpoint (see nested “ref” field)\n        \n      \n    \n\n    {\n    \"id\": \"a05dcb8a-79e5-4f69-bc30-213dd93f429c\",\n    \"status\": \"PENDING\",\n    \"eta\": 200,\n    \"resourceType\": \"job\",\n    \"links\": {\n        \"self\": {\n            \"ref\": \"/buy/checkout_previews/v2/jobs/a05dcb8a-79e5-4f69-bc30-213dd93f429c\"\n        }\n    }\n}\n    \n\n    Retrieve Checkout Preview Job\n\n    After calling Request Checkout Preview and receiving a HTTP 202 response, call Retrieve Checkout Preview Job using the same checkout ID to check the status of your job.\n\n    To know if the job is done, check the value of the status field in the response body as follows:\n\n    \n      \n        \"status\": \"PENDING\": job processing has not started\n      \n      \n        \"status\": \"IN_PROGRESS\": job processing in progress\n      \n      \n        \"status\": \"COMPLETED\": job has completed\n      \n    \n\n    Once you receive a job status of COMPLETED, get the results of your job by parsing the data in the response object from this endpoint. Alternatively, follow the link to the Retrieve Checkout Preview Results endpoint which is provided in the response body (see links object).\n\n    \n      TIP: Parsing the ‘Completed’ job result directly is a best practice because it eliminates doing another service call.\n    \n\n    Endpoint Details\n\n    \n      \n        \n          HTTP Method\n          URI Path\n          JWT Restricted?\n        \n      \n      \n        \n          GET\n          /buy/checkout_previews/v2/jobs/{id}\n          no\n        \n      \n    \n\n    Path &amp; Query Parameters\n\n    \n      \n        \n          Parameter\n          Type\n          Description\n          Data Type\n          Required?\n        \n      \n      \n        \n          id\n          Path\n          Unique client-generated identifier (UUID) for the checkout\n          string\n          Required\n        \n      \n    \n\n    Request Headers\n\n    Required request headers:\n\n    \n      \n        \n          Header Name\n          Description\n          Member\n          Guest\n          Employee\n        \n      \n      \n        \n          Accept\n          Content type you will accept in response, application/json is only value allowed\n          X\n          X\n          X\n        \n        \n          Content-Type\n          Content type of the request, application/json is only value allowed\n          X\n          X\n          X\n        \n        \n          Authorization\n          Your access token in the format of Bearer {token} indicating the customer is logged in\n          X\n           \n          X\n        \n        \n          x-nike-visitorid\n          Identifier for the guest (i.e. not logged-in) user, validated by the Edge router and passed through to the service\n           \n          X\n           \n        \n        \n          appId\n          Your application identifier\n           \n          X\n           \n        \n      \n    \n\n    Request Body\n\n    There is no body for a GET request.\n\n    Response Body\n\n    For a job that is in either “PENDING” or “IN_PROGRESS” status, the response is abbreviated and only contains the following:\n\n    \n      \n        \n          Element Name\n          Description\n        \n      \n      \n        \n          id\n          Checkout id you sent in the request, also your job ID\n        \n        \n          status\n          Status of the job\n        \n        \n          eta\n          Estimated wait time before polling the jobs endpoint to get your results\n        \n        \n          links\n          Relative URL path you can use to poll the jobs endpoint (see nested ref field)\n        \n      \n    \n\n    Sample Retrieve Checkout Preview Job response body with “IN_PROGRESS” status:\n\n    {\n  \"id\": \"7a37290b-c724-4f87-aeef-821265853546\",\n  \"status\": \"IN_PROGRESS\",\n  \"eta\": 250,\n  \"resourceType\": \"job\",\n  \"links\": {\n    \"self\": {\n      \"ref\": \"/buy/checkout_previews/v2/jobs/7a37290b-c724-4f87-aeef-821265853546\"\n    }\n  }\n}\n    \n    For a job that is in “COMPLETED” status and had no errors, the response also contains a response object that has the details of your checkout preview result.\n\n    The structure of the response object is similar in structure to the request body, with the following notable additions:\n\n    \n      \n        \n          Element Name\n          Description\n        \n      \n      \n        \n          shippingGroups\n          Array found under response object containing items and corresponding VAS, taxes, shipping address/method/cost. Grouped based on Nike business rules\n        \n        \n          priceInfo\n          Object containing price details. Found under the items, valueAddedServices, and shippingCosts objects\n        \n        \n          priceInfo.employeePrice\n          Employee price of the cart item. Only present if an employee price is used when pricing the checkout\n        \n        \n          taxes\n          Array of tax details. Found under items and shippingCosts objects\n        \n        \n          taxes.type\n          Type of tax (e.g. SALESTAX, SHIPPINGTAX, VALUEADDEDTAX)\n        \n        \n          taxes.rate\n          Tax rate\n        \n        \n          taxes.total\n          Total tax amount\n        \n        \n          promotionDiscounts\n          Array found under items and shippingGroups containing a list of promotions and their discount amounts\n        \n        \n          promotionDiscounts.code\n          Promotion code entered by the user\n        \n        \n          promotionDiscounts.amount\n          Promotion discount amount\n        \n        \n          promotionDiscounts.id\n          Promotion identifier\n        \n        \n          shippingMethod\n          Object found under shippingGroups containing cost of shipping method and estimated delivery date(s)\n        \n        \n          shippingMethod.id\n          Identifier for the shipping method, e.g. STANDARD for standard ground shipping in the US\n        \n        \n          shippingMethod.cost\n          Retail cost of shipping via the shipping method\n        \n        \n          shippingMethod.daysToArrive\n          DEPRECATED - do not use\n        \n        \n          shippingMethod.estimatedDelivery\n          Estimated delivery date for the items\n        \n        \n          shippingMethod.estimatedDelivery.**estimatedDeliveryDetails\n          Object containing unique identifier of the delivery estimate\n        \n        \n          shippingMethod.estimatedDelivery.estimatedDeliveryDetails.id\n          Unique identifier (UUID) of the delivery estimate\n        \n        \n          shippingMethod.estimatedDelivery.estimatedDeliveryDetails.date\n          Estimated delivery date for the items\n        \n        \n          shippingMethod.estimatedDelivery.estimatedDeliveryDetails.message\n          Message describing the delivery estimate\n        \n        \n          shippingCosts\n          Object found under shippingGroups containing total shipping costs, discounts, taxes, totals\n        \n        \n          shippingCosts.price\n          Price of the shipping costs\n        \n        \n          shippingCosts.discount\n          Shipping costs discount\n        \n        \n          shippingCosts.total\n          Total price of the shipping costs, not including tax, less any discounts\n        \n        \n          shippingCosts.taxTotal\n          Total tax amount based on the total\n        \n        \n          promotionCodes\n          Array found under response containing distinct summary of status for the provided promotion codes\n        \n        \n          promotionCodes.code\n          Provided promotion code\n        \n        \n          promotionCodes.status\n          Status of whether the promotion code was applied, e.g. PROMOTION_APPLIED, PROMOTION_NOT_APPLIED, PROMOTION_INVALID\n        \n        \n          totals\n          Object under response containing price subtotals for the entire checkout by items, VAS, taxes, discounts, shipping. Total checkout price also included\n        \n        \n          totals.subtotal\n          Subtotal of the item costs for all items\n        \n        \n          totals.valueAddedServicesTotal\n          Total of value-added services on the items\n        \n        \n          totals.taxTotal\n          Total of all taxes applied to the checkout, including VALUEADDEDTAX\n        \n        \n          totals.discountTotal\n          Total of all discoutns (excluding shipping discounts) applied to the checkout\n        \n        \n          totals.shippingTotal\n          Total of all shipping costs, less any shipping discounts, on the checkout\n        \n        \n          totals.total\n          Total prices of the entire checkout (item costs + shipping costs + taxes (including VALUEADDEDTAX) less any discounts\n        \n        \n          priceChecksum\n          Found under response, provides checksum for price details. Optionally, you can send it in the request body to Request Checkout Submit (see related section in this guide)\n        \n      \n    \n\n    Sample Retrieve Checkout Preview Job response body with “COMPLETED” status:\n\n    {\n    \"id\": \"87b5430e-48ed-4507-a38f-7faa7f63ecb2\",\n    \"status\": \"COMPLETED\",\n    \"links\": {\n        \"self\": {\n            \"ref\": \"/buy/checkout_previews/v2/jobs/87b5430e-48ed-4507-a38f-7faa7f63ecb2\"\n        },\n        \"result\": {\n            \"ref\": \"/buy/checkout_preview_results/v2/87b5430e-48ed-4507-a38f-7faa7f63ecb2\"\n        }\n    },\n    \"response\": {\n        \"id\": \"87b5430e-48ed-4507-a38f-7faa7f63ecb2\",\n        \"country\": \"US\",\n        \"currency\": \"USD\",\n        \"locale\": \"en_US\",\n        \"shippingGroups\": [\n            {\n                \"items\": [\n                    {\n                        \"id\": \"87b5430e-48ed-4507-a38f-7faa7f63ecb2\",\n                        \"skuId\": \"2f127fe4-78d4-5042-a944-b8a4938aff10\",\n                        \"quantity\": 1,\n                        \"valueAddedServices\": [],\n                        \"priceInfo\": {\n                            \"price\": 190,\n                            \"valueAddedServices\": 0,\n                            \"taxTotal\": 0,\n                            \"discount\": 0,\n                            \"total\": 190\n                        },\n                        \"taxes\": [\n                            {\n                                \"type\": \"SALESTAX\",\n                                \"rate\": 0,\n                                \"total\": 0\n                            }\n                        ]\n                    }\n                ],\n                \"recipient\": {\n                    \"firstName\": \"John\",\n                    \"lastName\": \"Doe\",\n                    \"altFirstName\": \"J\",\n                    \"altLastName\": \"\",\n                    \"middleName\": \"\"\n                },\n                \"shippingAddress\": {\n                    \"address1\": \"1234 NW Test\",\n                    \"address2\": \"Suite 22\",\n                    \"address3\": \"Door 1\",\n                    \"city\": \"Beaverton\",\n                    \"state\": \"OR\",\n                    \"postalCode\": \"97006\",\n                    \"country\": \"US\",\n                    \"county\": \"Washington\"\n                },\n                \"shippingMethod\": {\n                    \"id\": \"STANDARD\",\n                    \"cost\": 8,\n                    \"daysToArrive\": 5,\n                    \"estimatedDelivery\": \"2017-07-12T16:42:26.821Z\"\n                },\n                \"shippingCosts\": {\n                    \"priceInfo\": {\n                        \"price\": 8,\n                        \"valueAddedServices\": 0,\n                        \"taxTotal\": 0,\n                        \"discount\": 8,\n                        \"total\": 0\n                    },\n                    \"taxes\": [\n                        {\n                            \"type\": \"SHIPPINGTAX\",\n                            \"rate\": 0,\n                            \"total\": 0\n                        }\n                    ]\n                },\n                \"contactInfo\": {\n                    \"phoneNumber\": \"5555555555\",\n                    \"email\": \"null@null.com\"\n                }\n            }\n        ],\n        \"totals\": {\n            \"shippingTotal\": 0,\n            \"subtotal\": 190,\n            \"valueAddedServicesTotal\": 0,\n            \"taxTotal\": 0,\n            \"discountTotal\": 8,\n            \"total\": 190\n        },\n        \"priceChecksum\": \"f9b70f748aeb23af6255b3767f0c5595\",\n        \"email\": \"null@null.com\",\n        \"resourceType\": \"checkoutPreviewResult\",\n        \"links\": {\n            \"self\": {\n                \"ref\": \"/buy/checkout_preview_results/v2/87b5430e-48ed-4507-a38f-7faa7f63ecb2\"\n            }\n        }\n    },\n    \"resourceType\": \"job\"\n}\n    \n\n    Retrieve Checkout Preview Results\n\n    After calling both the Request Checkout Preview and Retrieve Checkout Preview Job endpoints, you can call this endpoint to retrieve the result of your Checkout Preview request. This step is optional, as the same result is already available in the response from the Retrieve Checkout Submit Job endpoint.\n\n    Endpoint Details\n\n    \n      \n        \n          HTTP Method\n          URI Path\n          JWT Restricted?\n        \n      \n      \n        \n          PUT\n          /buy/checkout_preview_results/v2/{id}\n          no\n        \n      \n    \n\n    \n      \n        \n          Parameter\n          Type\n          Description\n          Data Type\n          Required?\n        \n      \n      \n        \n          id\n          Path\n          Unique client-generated identifier (UUID) for the checkout\n          string\n          Required\n        \n      \n    \n\n    Request Checkout Submit\n\n    Call the Request Checkout Submit endpoint when your user is ready to complete their purchase.\n\n    Request Checkout Submit performs the final validations of the user’s information, requests payment authorization, and if everything succeeds, submits a checkout to Nike for fulfillment.\n\n    Considerations\n\n    \n      \n        Before calling Request Checkout Submit, you must have previously called the Payment Preview API to collect the required payment information, most notably the mandatory Payment Preview id. See the Payment Domain Developer’s Guide for more info.\n      \n      \n        Calling Request Checkout Preview is not required before calling Request Checkout Submit, but it is recommended in most cases.\n      \n      \n        When calling both the Preview and Submit endpoints in succession for a particular checkout, it is not required for you to use the same ID in the URL path (i.e. the checkout identifier) for both calls. However, any ID that you use must not have been used previously, else you will receive an idempotent response for the previously-used ID.\n      \n    \n\n    Checkout Submit Operates Asynchronously\n\n    This endpoint operates asynchronously which means that there are extra steps to retrieve the results of your request. Read the Asynchronous Operation section of the Using NDe APIs\nguide to learn more.\n\n    Endpoint Details\n\n    \n      \n        \n          HTTP Method\n          URI Path\n          JWT Restricted?\n        \n      \n      \n        \n          PUT\n          /buy/checkouts/v2/{id}\n          no\n        \n      \n    \n\n    \n      \n        \n          Parameter\n          Type\n          Description\n          Data Type\n          Required?\n        \n      \n      \n        \n          id\n          Path\n          Unique client-generated identifier (UUID) for the checkout\n          string\n          Required\n        \n      \n    \n\n    Request Headers\n\n    Required request headers:\n\n    \n      \n        \n          Header Name\n          Description\n          Member\n          Guest\n          Employee\n        \n      \n      \n        \n          Accept\n          Content type you will accept in response, application/json is only value allowed\n          X\n          X\n          X\n        \n        \n          Content-Type\n          Content type of the request, application/json is only value allowed\n          X\n          X\n          X\n        \n        \n          Authorization\n          Your access token in the format of Bearer {token} indicating the customer is logged in\n          X\n           \n          X\n        \n        \n          x-nike-visitorid\n          Identifier for the guest (i.e. not logged-in) user, validated by the Edge router and passed through to the service\n           \n          X\n           \n        \n        \n          appId\n          Your application identifier\n           \n          X\n           \n        \n        \n          True-Client-IP\n          IP address of the client, required if X-Forwarded-For is null\n          X\n          X\n          X\n        \n        \n          X-Forwarded-For\n          Used to derive the IP address of the client, required if True-Client-IP is null\n          X\n          X\n          X\n        \n        \n          User-Agent\n          Browser and operating system of the client calling this endpoint\n          X\n          X\n          X\n        \n      \n    \n\n    Optional request headers:\n\n    \n      \n        \n          Header Name\n          Description\n          Member\n          Guest\n          Employee\n        \n      \n      \n        \n          usertype\n          nike:swoosh for Nike Employees, nike:plus for Nike+ Customers, otherwise do not send\n          X\n           \n          X\n        \n        \n          Origin-Order-ID\n          During v1 to v2 cutover, represents the legacy order id associated to the checkout and is used by downstream systems\n          X\n          X\n          X\n        \n      \n    \n\n    Request Body\n\n    Required parts of the request body:\n\n    \n      \n        \n          Element Name\n          Required?\n          Description\n        \n      \n      \n        \n          request\n          Required\n          Top-level object in request schema\n        \n        \n          email\n          Required\n          Email address\n        \n        \n          country\n          Required\n          2-alpha character ISO 3166 country code, e.g US\n        \n        \n          currency\n          Required\n          ISO 4217 currency code, e.g. USD\n        \n        \n          locale\n          Required\n          BCP 47 locale code, e.g. en_US\n        \n        \n          channel\n          Required\n          Selling channel name associated with the checkout, e.g. ‘SNKRS’\n        \n        \n          items\n          Required\n          Array containing list of item objects\n        \n        \n          paymentToken\n          Required\n          Unique identifier of the payment details, as obtained from the Payment Preview API in the id field at the top level\n        \n        \n          valueAddedServices\n          Optional\n          List of value-added service (VAS) line items. One or more VAS line items can be associated with a Nike product (i.e. skuId). Examples of VAS are a customization service for a shoe or a gift-wrapping service\n        \n        \n          valueAddedServices.id\n          Optional\n          Unique identifier for the VAS. In nested Instruction object, the following are required:\n        \n        \n          valueAddedServices.Instruction.id\n          Optional\n          Instruction unique identifier for the value-added service, related to the various service domains, e.g. design id for Nike iD customization\n        \n        \n          valueAddedServices.Instruction.type\n          Optional\n          Instruction Type, e.g. customization/nike_id (only one currently available), customization/my_print, customization/gift_card, buy/gift_wrap, buy/gift_message\n        \n        \n          promotionCodes\n          Optional\n          Array containing list of promotion codes being applied to the checkout\n        \n      \n    \n\n    \n      TIPS:\n    \n\n    \n      \n        For the list of supported country code and currency code combinations, see here.\n      \n    \n\n    \n      \n        To retrieve VAS data to include in your checkout request, call the Merchandised Value Added Services endpoints of the Merchandised Products API. See the Merchandised Products API Developer’s Guide for more information.\n      \n    \n\n    \n      \n        Optionally you can send the priceChecksum value you got from the Request Checkout Preview endpoint in the priceChecksum field in the request body. It is used to compare and validate the pricing calculated on a previous request against the pricing at the time of Checkout Submit.\n      \n    \n\n    \n      \n        For China only, you can offer shoppers the option to generate a Fapiao, which is a special tax invoice. If the shopper indicates a preference for Fapiao, they can enter a personal message to be used as a title for the invoice. Just send an invoiceInfo array in the request body, similar to the below example (see the request schema for this endpoint for more details):\n          \"invoiceInfo\": {\n  \"type\": \"ELECTRONIC_FAPIAO\",\n  \"detail\": \"The shopper's personal title for the invoice\"\n}\n          \n        \n      \n    \n\n    Sample Request Checkout Submit request body:\n    {\n     \"request\": {\n       \"email\": \"null@null.com\",\n       \"country\": \"US\",\n       \"currency\": \"USD\",\n       \"locale\": \"en_US\",\n       \"channel\": \"SNKRS\",\n       \"clientInfo\": {\n         \"deviceId\": \"iPhone\"\n       },\n       \"items\": [\n         {\n           \"id\": \"a05dcb8a-79e5-4f69-bc30-213dd93f429c\",\n           \"skuId\": \"15611769-e81b-45dd-b28c-ca0effb272de\",\n           \"quantity\": 1,\n           \"recipient\": {\n             \"firstName\": \"John\",\n             \"altFirstName\": \"J\",\n             \"lastName\": \"Doe\",\n             \"altLastName\": \"Deer\",\n             \"middleName\": \"Henry\",\n             \"middleInitial\": \"H\",\n             \"givenName\": \"John H. Deer\"\n           },\n           \"shippingAddress\": {\n             \"address1\": \"1234 NW Test\",\n             \"address2\": \"Suite 22\",\n             \"address3\": \"Door 1\",\n             \"city\": \"Beaverton\",\n             \"state\": \"OR\",\n             \"postalCode\": \"97006\",\n             \"country\": \"US\",\n             \"county\": \"Washington\"\n           },\n           \"contactInfo\": {\n             \"phoneNumber\": \"555-555-5555\",\n             \"email\": \"null@null.com\"\n           },\n           \"shippingMethod\": \"STANDARD\"\n         }\n       ],\n       \"paymentToken\": \"fe2cc7d6-9b40-4b64-81bf-afa11c8b43e4\",\n       \"priceChecksum\": \"987490576237\"\n     }\n   }\n    \n\n    Response Body\n\n    The HTTP 202 response from Request Checkout Submit contains information about how to retrieve the results of your job from the Retrieve Checkout Submit Job endpoint. Following are descriptions of the important fields in the response body:\n\n    \n      \n        \n          Element Name\n          Description\n        \n      \n      \n        \n          id\n          Checkout id you sent in the request, also your job ID\n        \n        \n          status\n          Status of the job\n        \n        \n          eta\n          Estimated wait time before polling the jobs endpoint to get your results\n        \n        \n          links\n          Relative URL path you can use to poll the jobs endpoint (see nested “ref” field)\n        \n      \n    \n\n    {\n  \"id\": \"7a37290b-c724-4f87-aeef-821265853546\",\n  \"status\": \"IN_PROGRESS\",\n  \"eta\": 250,\n  \"resourceType\": \"job\",\n  \"links\": {\n    \"self\": {\n      \"ref\": \"/buy/checkouts/v2/jobs/7a37290b-c724-4f87-aeef-821265853546\"\n    }\n  }\n}\n    \n\n    Retrieve Checkout Submit Job\n\n    After calling the Request Checkout Submit endpoint and receiving a HTTP 202 response, you can call this endpoint using the same checkout I
