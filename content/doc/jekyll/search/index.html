: \"de908099-8245-5127-9741-7a28c4c3b8b4\"\n                        },\n                        {\n                            \"id\": \"635637c8-b2b2-52f4-a65f-92a83cbf5f14\",\n                            \"productId\": \"0bd73bdf-d08d-5e32-b419-84a8f697401e\",\n                            \"resourceType\": \"availableSkus\",\n                            \"links\": {\n                                \"self\": {\n                                    \"ref\": \"/deliver/available_skus/v1/635637c8-b2b2-52f4-a65f-92a83cbf5f14\"\n                                }\n                            },\n                            \"available\": false,\n                            \"skuId\": \"635637c8-b2b2-52f4-a65f-92a83cbf5f14\"\n                        },\n                        {\n                            \"id\": \"7944ac2c-3013-511f-999a-ee5ef2b57b90\",\n                            \"productId\": \"0bd73bdf-d08d-5e32-b419-84a8f697401e\",\n                            \"resourceType\": \"availableSkus\",\n                            \"links\": {\n                                \"self\": {\n                                    \"ref\": \"/deliver/available_skus/v1/7944ac2c-3013-511f-999a-ee5ef2b57b90\"\n                                }\n                            },\n                            \"available\": true,\n                            \"skuId\": \"7944ac2c-3013-511f-999a-ee5ef2b57b90\"\n                        },\n                        {\n                            \"id\": \"a0d1fcc5-8b27-5a60-abb5-380c069fa536\",\n                            \"productId\": \"0bd73bdf-d08d-5e32-b419-84a8f697401e\",\n                            \"resourceType\": \"availableSkus\",\n                            \"links\": {\n                                \"self\": {\n                                    \"ref\": \"/deliver/available_skus/v1/a0d1fcc5-8b27-5a60-abb5-380c069fa536\"\n                                }\n                            },\n                            \"available\": false,\n                            \"skuId\": \"a0d1fcc5-8b27-5a60-abb5-380c069fa536\"\n                        },\n                        {\n                            \"id\": \"36608043-cd75-5149-80e3-164a1d24dcb9\",\n                            \"productId\": \"0bd73bdf-d08d-5e32-b419-84a8f697401e\",\n                            \"resourceType\": \"availableSkus\",\n                            \"links\": {\n                                \"self\": {\n                                    \"ref\": \"/deliver/available_skus/v1/36608043-cd75-5149-80e3-164a1d24dcb9\"\n                                }\n                            },\n                            \"available\": false,\n                            \"skuId\": \"36608043-cd75-5149-80e3-164a1d24dcb9\"\n                        },\n                        {\n                            \"id\": \"8f25ea97-b810-56b5-9fd8-a8130ef5478c\",\n                            \"productId\": \"0bd73bdf-d08d-5e32-b419-84a8f697401e\",\n                            \"resourceType\": \"availableSkus\",\n                            \"links\": {\n                                \"self\": {\n                                    \"ref\": \"/deliver/available_skus/v1/8f25ea97-b810-56b5-9fd8-a8130ef5478c\"\n                                }\n                            },\n                            \"available\": false,\n                            \"skuId\": \"8f25ea97-b810-56b5-9fd8-a8130ef5478c\"\n                        }\n                    ]\n                }\n            ],\n            \"resourceType\": \"thread\",\n            \"links\": {\n                \"self\": {\n                    \"ref\": \"/product_feed/threads/v2/2383e522-7d71-4ad7-8d9f-506aad2d8923?channelId=dc8a8c4b-4924-4e13-a04b-ba96b6b72766&amp;marketplace=US&amp;language=en\"\n                }\n            }\n        }\n    ]\n}\n\n\n\n\n\n\nProduct Thread by ID\n\nGet a Thread by its unique identifier.\n\nEndpoint Details\n\n\n  \n    \n      HTTP Method\n      URI Path\n      Restricted?\n    \n  \n  \n    \n      GET\n      /product_feed/threads/v2/{id}{?channel,marketplace,language,fields,preview,includeExclusiveAccess}\n      No\n    \n  \n\n\nPath &amp; Query Parameters\n\n\n  \n    \n      Parameter\n      Type\n      Description\n      Data Type\n      Required?\n    \n  \n  \n    \n      id\n      Path\n      Unique identifier of the thread in UUID format\n      String\n      Required\n    \n    \n      channel\n      Query\n      Sales channel, defaults to ‘snkrs’\n      String\n      Optional\n    \n    \n      marketplace\n      Query\n      ISO 3166 two-letter country code, defaults to ‘US’\n      String\n      Optional\n    \n    \n      language\n      Query\n      BCP-47 language code, defaults to ‘en’\n      String\n      Optional\n    \n    \n      fields\n      Query\n      Select the fields to be included in the response\n      String\n      Optional\n    \n    \n      preview\n      Query\n      Preview a thread that is not yet enabled. Requires Authorization header to be sent\n      String\n      Optional\n    \n    \n      includeExclusiveAccess\n      Query\n      Include exclusive and non-exclusive access threads in the results\n      Boolean\n      Optional\n    \n  \n\n\n\n  TIP: For a list of supported marketplaces (country codes) and languages, see here.\n\n\nExample Scenarios\n\n\n  \n    \n      I Want to List\n      Sample Query\n    \n  \n  \n    \n      Single thread by ID\n      https://api.nike.com/product_feed/threads/v2/bcbeae50-28a5-404d-9941-fbbdff0c7860\n    \n    \n      Single thread by ID (only selected fields returned)\n      https://api.nike.com/product_feed/threads/v2/bcbeae50-28a5-404d-9941-fbbdff0c7860?fields=publishedContent.properties.coverCard.properties.title,publishedContent.properties.coverCard.properties.landscapeURL\n    \n  \n\n\nRequest Headers\n\nThere are no required request headers.\n\nRequest Body\n\nThere is no body for a GET request.\n\nResponse Body\n\nThe structure of the response from Thread by ID is the same as Threads List with the following exceptions:\n\n\n  \n    No pages section at top\n  \n  \n    No objects wrapper around the thread data\n  \n\n\nSee Threads List for response body details.\n\n\n\n\n\nProduct Feeds Error Handling\n\nFollowing is a summary of the errors that can come back in responses from the Product Feeds v2 APIs:\n\n\n  \n    \n      HTTP Response Code\n      Relevant HTTP Method(s)\n      Error Message\n      Action to Take\n    \n  \n  \n    \n      400\n      GET\n      MISSING_REQUIRED\n      Check the URL for missing path parameter or incorrectly-formatted query parameter. Correct and retry\n    \n    \n      401\n      GET\n      Unauthorized\n      Applies only to thread preview by ID. Check your Authorization header. Correct and retry\n    \n    \n      404\n      GET\n      Feed or thread not found\n      Check the feed ID, thread ID or query parameter value for validity. Correct and retry\n    \n    \n      404\n      GET\n      Resource does not exist\n      Check for malformed URL. Correct and retry\n    \n    \n      500\n      GET\n      Internal Server Error\n      Downstream service does not recognize query parameter, e.g. ?language=foo\n    \n  \n\n\nUpgrading to the Latest Version\n\nReady to upgrade to the latest version of the Product Feeds API? All clients of Product Feeds v1 are expected to migrate to v2 by March 31st, 2018.\n\nFirst, some considerations:\n\n\n  \n    By design, not all v1.x endpoints have a direct v2 equivalent. For example, there are no v2 endpoints which return product channels.\n  \n  \n    All endpoints of Product Feeds exclusively feature the GET method, which has no request body, so the focus of each section will be on the differences in the response body only.\n  \n  \n    For the 4 endpoints that have both a v1 and a v1.5 (see Product Feeds v1 API.md for details), the response schemas are the same between v1 and v1.5 so the upgrade process to v2 is the same for both.\n  \n\n\n\n  TIP: Upgrading from CAPI (Commerce API)? See the CAPI Migration Guide for detailed instructions.\n\n\nV1.x to V2 Endpoint Mapping\n\nThe following table lists the v1 endpoints along with the equivalent v2 endpoint for each:\n\n\n  \n    \n      V1 Endpoint Name\n      Equivalent V2 Endpoint Name\n    \n  \n  \n    \n      All Product Channels\n      None\n    \n    \n      Product Channel by Name\n      None\n    \n    \n      All Product Feeds\n      All Product Feeds\n    \n    \n      Product Feed by ID\n      Product Feed by ID\n    \n    \n      Product Feed by Feed ID\n      None\n    \n    \n      All Product Threads\n      Product Threads List\n    \n    \n      Product Thread by ID\n      Product Thread by ID\n    \n    \n      Product Thread by Thread ID\n      None\n    \n    \n      Product Thread by Style-Color\n      Product Threads List\n    \n    \n      Product Thread by SEO Slug\n      Product Threads List\n    \n    \n      All Admin Threads\n      None\n    \n    \n      Product Card by ID\n      None\n    \n  \n\n\nAll Product Feeds &amp; Product Feed by ID v1 to v2 Field Mapping\n\nThe response structure of the v1 All Product Feeds and Product Feed by ID endpoints is the same, with a few minor exceptions, so for the purposes of upgrading to v2 they can be discussed together.\n\nThe below table describes how the response body fields map from the v1 to the v2 endpoints with same name.\n\n\n  \n    \n      V1 Field Name\n      Description\n      V2 Field Name\n      Description\n      Notes\n    \n  \n  \n    \n      country\n      Country in which the feed exists\n      N/A\n      No equivalent\n       \n    \n    \n      locale\n      Locale of the feed content\n      N/A\n      No equivalent\n       \n    \n    \n      channel\n      Channel in which the feed exists\n      N/A\n      No equivalent\n       \n    \n    \n      totalRecords\n      Total number of feeds that match the criteria\n      N/A\n      No equivalent\n       \n    \n    \n      feeds\n      Array containing one or more feeds that match the criteria\n      N/A\n      No equivalent\n       \n    \n    \n      id\n      UniqueID hash of the feed.feedId\n      id\n       \n      v1 and v2 IDs are not the same, also v2 is in UUID format\n    \n    \n      feedId\n      An unique ID string relative path of a given feed in AEM/AuthoringTool\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      interestId\n      This is used to add the InterestId from Social. Currently SNKRS uses it for the mapping the FOLLOWS verb\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      createdDate\n      Time when the object was created in AEM/AuthoringTool\n      N/A\n      No equivalent\n       \n    \n    \n      lastUpdatedDate\n      Last time this object was updated\n      N/A\n      No equivalent\n       \n    \n    \n      name\n      Name of the feed\n      name\n      Human-readable nickname\n       \n    \n    \n      thumbnailURL\n      URL for the thumbnail image\n      N/A\n      No equivalent\n       \n    \n    \n      imageURL\n      URL for feed image\n      imageURL\n      URL of a full-sized image\n      In v2, this is often null\n    \n    \n      categories\n      categories the feed is associated with\n      N/A\n      No equivalent\n       \n    \n    \n      status\n      Indicates the status of the feed\n      status\n      For showing whether this collection is active or inactive\n       \n    \n    \n      listingEnabled\n      This attribute is true by default.It prevents feeds from being listed when set to false\n      listingEnabled\n      Shows whether this collection should be listed on a target app\n       \n    \n    \n      N/A\n      No equivalent\n      parentGroupIds\n      Lists all the collection groups (i.e. channels) that this feed belongs to\n       \n    \n  \n\n\n\n  TIP: For v2 URI format and available parameters, see All Product Feeds and Product Feed by ID sections of this document.\n\n\nAll Product Threads &amp; Product Thread by ID v1 to v2 Field Mapping\n\nThe response structure of the v1 All Product Threads and Product Thread by ID endpoints is the same, with a few minor exceptions, so for the purposes of upgrading to v2 they can be discussed together.\n\nThe following table describes how the response body fields map from the v1 to the v2 endpoints.\n\n\n  \n    \n      V1 Field Name\n      Description\n      V2 Field Name\n      Description\n      Notes\n    \n  \n  \n    \n      country\n      Country in which the thread exists\n      marketplace\n      ISO 3166 two-letter country code for the user’s current location\n       \n    \n    \n      locale\n      Locale of the thread content\n      language\n      BCP-47 language code\n       \n    \n    \n      channel\n      Channel in which the thread exists\n      channelId\n      UUID for the channel (collectionGroupId)\n       \n    \n    \n      totalRecords\n      Total number of threads that match the criteria\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      threads\n      Array containing one or more threads that match the critera\n      objects\n      Array containing one or more threads\n       \n    \n    \n      id\n      Unique identifier for a particular thread\n      id\n      Unique identifier for the thread\n      v1 and v2 IDs are not the same, also v2 is in UUID format\n    \n    \n      threadId\n      Unique ID coming from the relative path of the object in AEM/Authoring tool\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      interestId\n      Unique ID coming from the Social interests\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      name\n      Name of the thread describing the campaign\n      publishedContent.properties.title\n      Thread title\n       \n    \n    \n      createdDate\n      Time when the object was created in AEM/Authoring tool\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      lastUpdatedDate\n      Last time this object was updated\n      lastFetchTime\n      date-time the data was aggregated, in this ISO-8601 compliant format: yyyy-MM-ddTHH:mm:ss.SSSZZ\n       \n    \n    \n      publishedDate\n      The first time any card in this thread should be visible\n      publishedContent.publishStartDate\n      Date time string of when the publishing schedule is set to start\n       \n    \n    \n      product\n      Object containing product info\n      productInfo\n      Array of product info\n       \n    \n    \n      product.id\n      Unique ID coming from Merchandised Products API\n      productInfo.merchProduct.id\n      Unique identifier for the product object\n       \n    \n    \n      product.interestId\n      Unique ID coming from the Social interests\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      product.style\n      Style identifier for the style of the product\n      productInfo.merchProduct.styleCode\n      Style code of the product\n       \n    \n    \n      product.colorCode\n      Three-digit color code identifier\n      productInfo.merchProduct.colorCode\n      Color code of the product\n       \n    \n    \n      product.globalPid\n      Global identifier of the product\n      productInfo.merchProduct.pid\n      Product identifier for the product\n       \n    \n    \n      product.fullTitle\n      Full title of the product\n      productInfo.productContent.fullTitle\n      Full title of the product\n       \n    \n    \n      product.title\n      Title of the product\n      productInfo.productContent.title\n      Title of the product\n       \n    \n    \n      product.subtitle\n      Subtitle of the product\n      productInfo.productContent.subtitle\n      Subtitle of the product\n       \n    \n    \n      product.description\n      Description of the product\n      productInfo.productContent.description\n      Description of the product\n       \n    \n    \n      product.imageUrl\n      URL for product images\n      productInfo.imageURLs.productImageUrl\n      URL for product images\n       \n    \n    \n      product.genders\n      Array of relevant genders for the product\n      productInfo.merchProduct.genders\n      Genders that the product is for\n       \n    \n    \n      product.price\n      Object containing product price info\n      productInfo.merchPrice\n      Object containing product price info\n       \n    \n    \n      product.price.onSale\n      Indicates if the product is on clearance or not\n      productInfo.merchPrice.discounted\n      Indication if the product is on sale\n       \n    \n    \n      product.price.msrp\n      Maximum stated retail price of the product\n      productInfo.merchPrice.msrp\n      Maximum stated retail price of the product\n       \n    \n    \n      product.price.fullRetailPrice\n      Full retail price of the product\n      productInfo.merchPrice.fullPrice\n      Full price of the product\n       \n    \n    \n      product.price.currentRetailPrice\n      Current retail price of the product. For discounted products it will be different from fullRetailPrice\n      productInfo.merchPrice.currentPrice\n      Current price of the product\n       \n    \n    \n      product.price.formattedFullRetailPrice\n      Formatted full retail price\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      product.price.formattedCurrentRetailPrice\n      Formatted current retail price\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      product.estimatedLaunchDate\n      Deprecated, do not use\n      N/A\n       \n       \n    \n    \n      product.publishedDate\n      Date when a product was published in launch admin tool\n       \n       \n       \n    \n    \n      product.quantityLimit\n      Quantity limit of the product\n      productInfo.merchProduct.quantityLimit\n      Quantity limit of the product\n       \n    \n    \n      product.status\n      Status of the product\n      productInfo.merchProduct.status\n      Status of the product\n       \n    \n    \n      product.selectionEngine\n      Selection engine of the product\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      product.colorDescription\n      Description of the color of the product\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      product.productType\n      Type of product\n      productInfo.merchProduct.productType\n      Type of product\n       \n    \n    \n      product.salesChannel\n      Sales channel of product\n      productInfo.merchProduct.channels\n      Sales channel of product\n       \n    \n    \n      product.accessCode\n      Boolean indicator for whether access code is required or not\n      productInfo.merchProduct.exclusiveAccess\n      Boolean indicator for whether access code is required or not\n       \n    \n    \n      product.startSellDate\n      Date when a product is estimated to launch\n      productInfo.launchView.startEntryDate OR product.Info.merchProduct.commerceStartDate\n      Date when launch entries will start being accepted\n       \n    \n    \n      product.timeToStartSelectionSeconds\n      Number of seconds until the product drawing is started\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      product.timeToStartSellSeconds\n      Number of seconds until the product drawing ends and the product is available to sell\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      product.endDrawDate\n      Date that the drawing ends\n      productInfo.launchView.endEntryDate\n      Date when launch entries will stop being accepted\n       \n    \n    \n      product.waitlineEnabled\n      Boolean for whether wait line for the product was enabled or not\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      product.available\n      Boolean for whether any size of the product is available or not\n      productInfo.availability.available\n      Boolean for whether any size of the product is available or not\n       \n    \n    \n      product.sportTags\n      Array of sport tags\n      productInfo.merchProduct.sportTags\n      Array of sport tags\n       \n    \n    \n      product.skus\n      Array of SKU info\n      productInfo.skus\n      Array of SKU info\n       \n    \n    \n      product.skus.id\n      UUID for the SKU\n      productInfo.skus.id\n      UUID for the SKU\n       \n    \n    \n      product.skus.localizedSize\n      Localized size for this SKU\n      productInfo.skus.countrySpecifications.localizedSize\n      Localized size for the SKU\n       \n    \n    \n      product.skus.nikeSize\n      Nike size for this SKU\n      productInfo.skus.nikeSize\n      Nike size for the SKU\n       \n    \n    \n      product.skus.available\n      Boolean for whether SKU is available for purchase or not\n      productInfo.availableSkus.available\n      Boolean for whether SKU is available for purchase or not\n       \n    \n    \n      restricted\n      Boolean for whether an access code is tied the thread or not\n      N/A\n      No equivalent\n       \n    \n    \n      feed\n      Feeds this thread belongs to\n      publishedContent.properties.publish.collections\n       \n      Not a true equivalent, but has similar info\n    \n    \n      title\n      Title of the thread\n      publishedContent.title\n      Title of the thread\n       \n    \n    \n      subtitle\n      Subtitle of the thread\n      publishedContent.subtitle\n      Subtitle of the thread\n       \n    \n    \n      imageUrl\n      URL where the image exists\n      publishedContent.properties.coverCard.properties.landscapeURL\n      URL where cover card image exists\n       \n    \n    \n      altText\n      Alt text for the image\n      publishedContent.properties.coverCard.properties.altText\n      Alt text for the cover card\n       \n    \n    \n      tabletImageUrl\n      URL where the image for the tablet exists\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      tabletAltText\n      Alt text for the tablet image\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      desktopImageUrl\n      URL where the image for desktop exists\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      desktopAltText\n      Alt text for desktop image\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      tags\n      Array of tags that can be applied to content to relate them\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards\n      Array of card info\n      publishedContent.nodes\n      Array of card info\n       \n    \n    \n      cards.country\n      Country of the card\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.locale\n      Locale of the card\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.channel\n      Channel of the card\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.id\n      Unique identifier for a particular card\n      publishedContent.nodes.id\n      Unique identifier for the card\n       \n    \n    \n      cards.cardId\n      Unique ID coming from the relative path of the object in AEM/Authoring tool\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.sortOrder\n      Order in which the card should appear in the thread\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.interestId\n      Unique ID coming from the social interests\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.type\n      Type of card (photo, photo-carousel, video or text)\n      publishedContent.nodes.subType\n      Type of card\n       \n    \n    \n      cards.title\n      Title of the card\n      publishedContent.nodes.properties.title\n      Title of the card\n       \n    \n    \n      cards.subtitle\n      Subtitle of the card\n      publishedContent.nodes.properties.subtitle\n      Subtitle of the card\n       \n    \n    \n      cards.description\n      Description of the card\n      publishedContent.nodes.properties.body\n      Description of the card\n       \n    \n    \n      cards.images\n      Array of image info related to the card\n      publishedContent.nodes.properties\n       \n      No distinct section for images, instead evaluate subType field\n    \n    \n      cards.images.type\n      Type of image (card, thread or alternate)\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.images.imageUrl\n      URL where the image exists\n      publishedContent.nodes.properties.portraitURL\n       \n      Also available are landscapeURL, squarishURL fields\n    \n    \n      cards.images.alt\n      Alt text for the image\n      publishedContent.nodes.properties.altText\n      Alt text for the card\n       \n    \n    \n      cards.images.sortOrder\n      Sort order in which images should be displayed\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.images.desktopImageUrl\n      URL where the image for desktop exists\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.images.desktopAltText\n      Alt text for desktop image\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.images.tabletImageUrl\n      URL where the image for the tablet exists\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.images.tabletAltText\n      Alt text for the tablet image\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.videos\n      Array of video info for the card\n      publishedContent.nodes.properties\n       \n      No distinct section for videos, instead evaluate subType field\n    \n    \n      cards.videos.type\n      Type of video object (nikeserver, brightcove or youtube)\n      publishedContent.nodes.properties.providerId\n      Name of video provider\n       \n    \n    \n      cards.videos.stillImageUrl\n      URL of still image to be shown as placeholder for the video\n      publishedContent.nodes.properties.startImageURL\n      Still image to be shown as placeholder for the video\n       \n    \n    \n      cards.videos.videoUrl\n      Video URL that can be retrieved to display on the card\n      publishedContent.nodes.properties.videoId\n      Identifier for the video\n       \n    \n    \n      cards.videos.alt\n      Text string that verbally describes the video for accessibility\n      publishedContent.nodes.properties.altText\n      Alt text for the card\n       \n    \n    \n      cards.videos.sortOrder\n      Order in which the multiple videos on the card need to be presented\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.videos.desktopImageUrl\n      URL of still image to be shown as placeholder for the video on a desktop\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.videos.desktopAltText\n      Text string that verbally describes the video on a desktop\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.videos.tabletImageUrl\n      URL of still image to be shown as placeholder for the video on a tablet\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.videos.tabletAltText\n      Text string that verbally describes the video on a tablet\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.createdDate\n      Time when the object was created in AEM/Authoring tool\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.lastUpdatedDate\n      Last time this object was updated\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.colorHint\n      Object containing color hint info\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.colorHint.text\n      RGB hex color code ranging from 000000 for black to FFFFFF for white\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.colorHint.active\n      RGB hex color code ranging from 000000 for black to FFFFFF for white\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.colorHint.inactive\n      RGB hex color code ranging from 000000 for black to FFFFFF for white\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.colorHint.pressed\n      RGB hex color code ranging from 000000 for black to FFFFFF for white\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.cta\n      Object containing call-to-action info\n      publishedContent.nodes.properties.title.actions.actionType\n      Type of call-to-action info\n       \n    \n    \n      cards.cta.text\n      Custom call to action text that can be presented on a content card, when there is no product object associated with it\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.cta.buyingTools\n      Boolean indicating the need to present buying tools on the card\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      cards.iOSOnly\n      Flag to indicate if the card is only for IOS\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      relations\n      Array of related threads data\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      relations.name\n      Name (RELATED)\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      relations.threads\n      Identifier (threadId) of related threads\n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      locations\n       \n      N/A\n      No equivalent\n      Deprecated\n    \n    \n      active\n      Boolean for whether the thread is active or not\n      active\n      Boolean for whether the thread is active or not\n       \n    \n    \n      seoSlug\n      The SEO slug of the thread\n      publishedContent.seo.slug\n      The SEO slug of the thread\n       \n    \n    \n      seoTitle\n      Title tag for SEO\n      publishedContent.seo.title\n      Title tag for SEO\n       \n    \n    \n      seoDescription\n      Meta description for SEO\n      publishedContent.seo.description\n      Meta description for SEO\n       \n    \n    \n      relationalId\n       \n      publishedContent.relationalId\n      The ID of the parent thread. Ties various language threads to the source version\n       \n    \n    \n      socialPattern\n       \n      N/A\n      No equivalent\n      Deprecated\n    \n  \n\n\n\n  TIP: For the v2 URI format and available parameters, see the Product Thread by ID and Product Threads List sections of this document.\n\n\nURL Patterns By Version\n\nThe URL pattern used by the Product Feeds API’s varies depending on the version, as described here:\n\nv1\n\nhttps://api.nike.com/commerce/productfeed/products (Note: no version number indicated in path)\n\nv1.5\n\nhttps://api.nike.com/commerce/productfeed/products/v1.5\n\nv2\n\nhttps://api.nike.com/product_feed/feeds/v2\n\n\n  TIP: Always check the specific API you are integrating with to confirm the correct URL format. Also, see the URL Patterns section of the Using NDe APIs guide for info on Nike standards.\n\n\nBest Practices\n\nListed below are some best practices for working with Product Feeds.\n\nTest Environment\n\nProduct Feeds v2 has a test environment available at host https://experience.test.commerce.nikecloud.com.\n\nApart from the host, you can use the same URL, for example: https://experience.test.commerce.nikecloud.com/product_feed/threads/v2?filter=marketplace(US)&amp;filter=language(en)&amp;filter=channelId(b300bc43-bf2f-4b34-8942-fdc6f95653f9).\n\nSome considerations about using the test environment:\n\n\n  \n    The functionality of the API is the same in test vs. production, with the exception of new features that are not yet deployed to production.\n  \n  \n    Test has a different set of product data than production, but the test data set is similar. For example, many of the constants are the same in test, i.e. the marketplace, language, and channelId, as they are in production.\n  \n  \n    Inventory availability data is scarce in the test environment. At the product level, i.e. the values in productInfo.availability.available, might show as ‘false’ in test most of the time. Availability data at the SKU/size level, i.e. in productInfo.availableSkus, is not present in test.\n  \n  \n    All performance testing activities should be done in test and not in production.\n  \n\n\nTroubleshooting\n\nListed below are ways to troubleshoot unexpected responses using this API.\n\nUse Troubleshooting Tools\n\n\n  \n    Use the general troubleshooting tips in the Using NDe APIs guide.\n  \n  \n    Use a Splunk query (requires access) such as this to check for issues with your request.\n  \n  \n    Use the Product Feeds v2 Overview dashboard in Insights (requires access) to see if the service is up and healthy.\n  \n  \n    Contact the Product Feeds Team on the #cic-merch Slack channel for assistance.\n  \n\n\nCommon Questions\n\nHow do I know what product attributes are available for me to use to request Threads?\n\n\n  Unless you are doing a keyword search using the searchTerms query parameter, you need to know in advance which product attributes to include in your requests. The source of product attributes (e.g. slugs, ‘best for’, and other attributes) is Nike’s Prodigy system.\n\n\nWhy isn’t my feed showing up?\n\n\n  \n    The feed may have failed validation and was marked inactive. Only active threads with a valid publish date will be returned by this API. Contact the Product Feeds Team on the #cic-merch Slack channel to check if the feed failed validation and why.\n  \n  \n    The feed might not yet be published. It can take up to 15 minutes to publish a change from AEM and have it be reflected in the Feeds API.\n  \n\n\nWhy am I getting an empty 200 response from Threads List?\n\n\n  \n    There might not be any threads that meet the criteria that you specified, particularly when using optional filters. For example, if you send a request with filter=productInfo.merchProduct.styleCode(999999) and there are no threads for style code 999999, you will get an empty 200 response.\n  \n  \n    The publishStartDate for the requested threads might be in the future, or conversely the publishEndDate might be in the past. In other words, if today’s date is not within the publish start/end range for the thread, the thread will not be returned in the response.\n  \n  \n    The softLaunchDate on the product is in the future. The softLaunchDate, when present, overrides the publishStartDate, and thus can affect whether the thread is returned or not.\n  \n\n\nWhy am I getting a 404 error from Thread by ID when I know that the thread ID is valid?\n\n\n  \n    Today’s date might be outside the publish start/end range for the thread.\n  \n  \n    The catalogId on the product might be blank. To troubleshoot, send a request to the Merchandised Products API with the affected product ID (e.g. https://api.nike.com/merch/products/v2/c98f12d7-7dee-5775-b4a6-c83d0d2dcb9a) to see if a catalog ID is present or not. If not, that is the reason that the thread is not being returned.\n  \n\n\n\n  TIP: Be careful not to confuse legacyCatalogId, which like catalogId is also present in the threads response under productInfo.merchProduct, but does not affect thread visibility.\n\n\nGlossary\n\nSee the Glossary\n\nRelease Notes\n\nNo release notes available\n\nDocument Change Log\n\n\n  \n    \n      Summary\n      Date\n      Description\n    \n  \n  \n    \n      Initial draft\n      01/23/2018\n      Initial Draft\n    \n    \n      Updates per Jan API.md changes\n      02/9/2018\n      Added new allowed values for sort and filter query params, added new includeExclusiveAccess query param\n    \n    \n      Layout updates\n      02/12/2018\n      Changed layout to meet new API Doc standards, added Troubleshooting content\n    \n 						"api-capi-migration": {
							"id": "api-capi-migration",
							"title": "CAPI Migration",
							"category": "api",
							"description": "",
		  				"type": "",
							"url": "/#apicapi_migration",
							"content": "Commerce API (CAPI) Migration Guide (DRAFT)\n\nLast Updated: 04/03/2018Submit Feedback: API Doc Slack channel #nde-doc\n\nIf you are a current Commerce API (CAPI) client, use this guide to help with migration to the Nike Cloud APIs.\n\n\n\nIn This Guide\n\nOverview\n\nCAPI vs Cloud Comparison\n\nEndpoint Mapping\n\nMigration Scenarios\n\nMigration Contacts\n\nField Mapping\n\n\n\nRelated Links\n\nOverview\n\nCAPI is a legacy API that provides access to Nike product information, including inventory availability. CAPI has been replaced by Nike’s Cloud-based APIs and will be deprecated after all clients have migrated to the newer APIs.\n\n\n\nCAPI vs. Cloud: Comparison\n\nRead on to learn more about the similarities and differences between CAPI and Cloud.\n\nOverall Considerations\n\n\n  \n    CAPI is largely replaced by the Product Feeds v2 API. The two APIs are similar in that they aggregate multiple sources of data, thus reducing the number of calls required to gather product data and content. Product Feeds has the additional benefit of having fewer endpoints than CAPI, for example some implementations rely on calls to only two distinct endpoints.\n  \n  \n    Some of the search functionality of CAPI has not yet been replaced in the Cloud. If you rely on CAPI for faceted search, you may need to continue to use CAPI for now. Contact the Search Product Owner for more info about when this feature of Cloud Search will be available.\n  \n  \n    CAPIs inventory capabilities are replaced by Cloud Inventory APIs, and in the case of Digital inventory availability, also by Product Feeds.\n  \n\n\n\n  TIP: See the Endpoint Mapping section for the details of how each CAPI endpoint maps to Cloud.\n\n\nREST and JSON\n\nBoth CAPI and Cloud use the REST architectural style and feature JSON-formatted requests and responses.\n\n\n  TIP: If you are using the XML version of CAPI, you will need to be able to send and receive JSON when you migrate to the Cloud.\n\n\nCountry &amp; Language Support\n\nAll of the countries and languages supported by CAPI are also supported by Cloud, and more. For the complete list of supported languages for Product Feeds v2 (Cloud), see here.\n\nProduct Identifiers\n\nProduct information is available in the Cloud in the Product Feeds v2 API. This section includes some specific callouts in regards to product identifiers.\n\nProduct ID\n\nCAPI can be called by productId (PID), e.g. ‘1074990’ (which also can be sent in id field for certain CAPI endpoints), the legacy identifier that is unique to a style-color. In general, you cannot call Cloud APIs with this same productId, although you might see it in certain Cloud responses, for example with Product Feeds in the pid field.\n\nThe equivalent of productId in the Cloud is the id, e.g. ‘8e94a648-a232-5739-b4a6-c7d844a8bda0’, a UUID generated from the Merchandised Products API. You will use this id when making calls directly to Merchandised Products and also in the responses from the Product Feeds API, which aggregates data from Merchandised Products and several other APIs.\n\nSKU ID\n\nResponses from several CAPI endpoints feature skuID, e.g. ‘1107974’, the legacy identifier that is unique to a SKU or style-color-size. This value is still available in the cloud because several downstream systems rely on it, but it is renamed to stockKeepingUnitId. In addition, an id in the form of a UUID is generated per SKU by the Merchandised Product SKU API when it flows into the system.\n\n\n  TIP: For cloud, you can call the Merchandised Product SKU List endpoint with the filter query parameter, include the UUID of the parent product, and be returned a list of all the SKUs for that product. Example: https://api,nike.com/merch/skus/v2?filter=parentId(cf441ec7-53fd-5828-8f6d-d28a9cdcf1b1).\n\n\nStyle-Color Code\n\nStyle-color codes, e.g. ‘870790-420’, are the same values and in the same format in both CAPI and Cloud.\n\nGTIN\n\nGTIN (Global Trade Identification Number), e.g. ‘00675911130902’ values and format are the same in both CAPI and Cloud.\n\n\n  TIP: For Cloud, be sure to always send a 14-digit GTIN value, including any leading zeroes as necessary.\n\n\nGender Codes\n\nCAPI uses gender codes like ‘1’ for Mens, ‘2’ for Womens, etc. while cloud uses the gender name as the identifier (i.e. ‘Mens’). Eventually these values will be replaced by UUIDs originating in the Taxonomy service.\n\nPrices\n\nProduct price information is available in Cloud in the Product Feeds v2 API. Like CAPI, prices are available in Cloud at the style-color level.\n\nCAPI features list (suggested price), currentRetail (current price), sale (sale price), and the currency (currency code). CAPI also includes ‘formatted’ versions of each price in separate fields, i.e. the same price value but with the relevant currency symbol.\n\nCloud offers msrp (suggested price), fullPrice (full/regular price), currentPrice (current price), employeePrice (employee price), discounted (a Boolean indicating the product is on sale), and currency (currency code). Cloud does not offer ‘formatted’ prices.\n\n\n  TIP: See the Field Mapping section for detailed field-by-field mapping between CAPI and Cloud.\n\n\nInventory\n\nCAPI provides access to both Retail store on-hand inventory quantity and Digital inventory availability (true/false) by calling with a product ID, style-color code, or GTIN. Cloud offers Retail store on-hand inventory quantity by a combination of Store UUID and one or more GTINs in the Inventory API. Cloud offers Digital inventory availability (true/false) by either Product ID or SKU ID in the Availability API and also in the Product Feeds API.\n\n\n  TIP: Both the Inventory API and the Product Feeds API offer Digital inventory availability as a boolean (TRUE or FALSE), but the Inventory API has one additional field for inventory level (HIGH, MEDIUM, or LOW).\n\n\nDates\n\nAll dates returned by CAPI are in GMT in the format yyyy-MM-dd'T'HH:mm:ss, e.g. ‘2017-06-07T19:50:00.000’. For Cloud, dates are also in GMT in the format yyyy-MM-dd'T'HH:mm:ss'Z', e.g. 2017-06-07T19:50:00.000Z.\n\nImages\n\nCAPI clients may be accustomed to adjusting the image URL’s returned by CAPI to suit their needs, e.g. by adding query parameters for format, width, height, or quality before calling to retrieve the image. With Product Feeds, you can still do the same.\n\nOne notable difference with Product Feeds is that it can return multiple image URL’s by aspect ratio, namely the fields squarishURL, portraitURL, and landscapeURL.\n\nCaching/ETag/CORS Support\n\nCAPI supports both ETag and CORS. Product Feeds supports CORS only.\n\nProduct Feeds caching is fixed at cache-control:private, no-transform, max-age=30.\n\nMigration Scenarios\n\nProduct Search Migration\n\nCAPI\n\nIf your experience uses CAPI to drive free text search, it may call the CAPI Facets endpoint. For example, this CAPI URL finds all products including NIKEiD products with vapor in the name, sorted in ascending order.\n\nhttps://commerce-api.nike.com/commerce/v1/US/en_US/facets/1j7.json?client=test-client&amp;includeCustomizable=true&amp;merchandisedResults=true&amp;page=1&amp;pageSize=10&amp;query=vapor&amp;rollup=product_group&amp;sortDirection=asc\n\nCloud\n\nOne option is to use the Cloud Type Ahead Service and the Visual Search Service. This is a two-step process. The first step generates a list of suggested search terms based on customer input and the second step generates a list of suggested products with that search term in the name.\n\nFor example, when a customer types vap (enough to form a search term suggestion), call the search suggestion endpoint. The URL below requests search term suggestions with vap in the English name in the US. It returns vaporfly and vapormax searchTerms.\n\nhttps://api.nike.com/search/suggestions/v1?language=en&amp;country=us&amp;count=4&amp;text=vap&amp;origin=3957856850\n\nThen call the visual search endpoint passing one of the the search terms in the POST body to generate a list of suggested products. The URL below requests a list of suggested products and price data with vapormax in the name sold in the US marketplace in the English language.\n\nhttps://api.nike.com/search/visual_searches/v1\n\nPOST Body:\n\n{\n\t\"marketplace\": \"us\",\n\t\"language\": \"en\",\n\t\"searchTerms\": \"vapormax\"\n}\n\n\nFaceted Navigation Migration\n\nCAPI\n\nIf your experience uses CAPI to drive faceted navigation, it may call the CAPI Facet Discovery endpoint to derive a set of related facets. For example, this CAPI URL finds all the facets related to the Women, Shoes and Running facets using the hashed facet 7ptZ8yzZoi3.\n\nhttps://commerce-api.nike.com/commerce/v1/US/en_US/facets/7ptZ8yzZoi3.json?client=test-client&amp;fields=facets&amp;merchandisedResults=false\n\nCloud\n\nThe equivalent Cloud API is TBD.\n\nProduct Recommendations\n\nCAPI\n\nIf your experience uses CAPI to drive the Product Display Page (PDP), it may call CAPI’s Recommendations endpoint to list recommended products for a style-color. For example, this CAPI URL lists product recommendations for style-color 849557-202.\n\nhttps://commerce-api.nike.com/commerce/v1/US/en_US/product/849557-202/recommendations.json?client=test-client\n\nCloud\n\nThe equivalent Cloud API is TBD.\n\nProduct Gridwall Migration\n\nCAPI\n\nIf your experience uses CAPI to drive the product gridwall, it may call CAPI’s Faceted Hash search endpoint to list the products assigned to one or more facets. For example, this CAPI URL finds all products in the Women, Shoes and Running facets (including NIKEiD products) using merchandising rules and rolls them up by product group in ascending order.\n\nhttps://commerce-api.nike.com/commerce/v1/US/en_US/facets/7ptZ8yzZoi3.json?client=test-client&amp;includeCustomizable=true&amp;merchandisedResults=true&amp;page=1&amp;pageSize=10&amp;rollup=product_group&amp;sortDirection=asc\n\nCloud\n\nThe equivalent Cloud API is TBD.\n\nProduct Details Migration\n\nCAPI\n\nIf your experience uses CAPI to get product details for the PDP, it probably calls CAPI’s group details endpoint for a style-color. For example, this CAPI URL lists product details for style-color 849557-202. Because the includePreLaunch flag is set to false, the service applies visibility rules to determine if the product should be returned in the results.\n\nhttps://commerce-api.nike.com/commerce/v1/US/en_US/products/details.json?client=test-client&amp;ids=849557-202&amp;includePreLaunch=false\n\nCloud\n\nThe comparable Cloud endpoint is the Product Threads List endpoint in the Product Feeds API. For example, this URL calls the Product Threads List endpoint for the US marketplace and English language, filtering by style-color 8AH7282-081. It lists threads for style-color 8AH7282-081, applying Cloud visibility rules to determine which product data to return.\n\nhttps://api.nike.com/product_feed/threads/v2/?filter=marketplace%28US%29&amp;filter=language%28en%29&amp;filter=channelId%28933182b3-5f66-4b70-b0b1-0513e235742c%29&amp;filter=publishedContent.properties.products.styleColor%28AH7282-081%29\n\nRelated Products Migration\n\nCAPI\n\nIf your experience uses CAPI to display related colorways on the PDP, it may call CAPI’s Family Product endpoint. For example, this CAPI URL lists all colorways with style code 849557.\n\nhttps://commerce-api.nike.com/commerce/v1/US/en_US/product/849557-202/family.json?client=test-client\n\nCloud\n\nThe comparable Cloud endpoint is the Product Threads List endpoint in the Product Feeds API. For example, this URL calls the Product Threads List endpoint for the US marketplace and the English language, filtering by style code AH7246. It returns thread data for any product with style code AH7246.\n\nhttps://api.nike.com/product_feed/threads/v2/?filter=marketplace%28US%29&amp;filter=language%28en%29&amp;filter=channelId%28933182b3-5f66-4b70-b0b1-0513e235742c%29&amp;filter=productInfo.merchProduct.styleCode%28AH7246%29\n\nProduct Inventory Migration\n\nCAPI\n\nIf your experience uses CAPI to determine which sizes of a product are in and out of stock, it may call CAPI’s Inventory endpoint. For example, this CAPI URL lists whether or not each size is in stock for a list of style-colors.\n\nhttps://commerce-api.nike.com/commerce/v1/US/en_US/products/inventory.json?client=test-client&amp;ids=849557-202%2C849557-006%2C849557-041%2C849557-104%2C849557-004%2C849557-026%2C849557-100%2C849557-605%2C849557-007\n\nCloud\n\nThe comparable Cloud endpoint is the Product Threads List endpoint in the Product Feeds API.  For example, this URL lists thread data for the list of style-colors including the SKU availablity of each size. The sample URL below calls the Product Threads List endpoint for the US marketplace and the English language, filtering by style-codes 847269-430 and AH7238-080.\n\nhttps://api.nike.com/product_feed/threads/v2/?filter=marketplace%28US%29&amp;filter=language%28en%29&amp;filter=channelId%28933182b3-5f66-4b70-b0b1-0513e235742c%29&amp;filter=publishedContent.properties.products.styleColor(847269-430,AH7238-080)\n\nThe response lists SKU data in the availableSkus array. The SKU is in stock if available is true, out of stock if false.\n\nLooking up style-color from GTIN\n\nIf you have a GTIN (UPC) and need to get the style-color, here are the steps you would follow in the Cloud.\n\n\n  Call the Merchandised Product SKUs service filtering by GTIN.\n\n\nhttps://api.nike.com/merch/skus/v2/?filter=gtin(00887225865153)\n\n\n  TIP: It is recommended that you call the Merchandised Sku service rather than the Product Feed service if you only need SKU information, not product, inventory, product content or price information.\n\n\n\n  If you receive a 200 response from the Merchandised Sku service, get the parentId UUID from the response, pass it as the id parameter and call the Merchandised Product service. A 200 response lists the styleCode, colorCode and styleColor.\n\n\nhttps://api.nike.com/merch/products/v2?filter=merchgroup(US)&amp;filter=id(2c4282cc-9fd1-5250-94a5-0c74735443dc)\n\n\n  TIP: It is recommended that you call the Merchandised Product service rather than the Product Feeds service if you only need product information, not inventory, product content, price or SKU information.\n\n\n\n  If you do not receive a 200 response from the Merchandised Product Sku service, it could be because your GTIN is retail-only. Only digital SKUs are currently available in the Cloud. In this case, you will need to continue to call the CAPI Product Widths endpoint to get the style-color using the GTIN as a path parameter.\n\n\nhttps://commerce-api.nike.com/commerce/v1/US/en_US/product/00887225865153/widths?client=test-client\n\nMigration Contacts\n\nHave a question about migrating from CAPI services to Cloud services? See team contact information below.\n\n\n  \n    \n      Service\n      Product Owner\n      Contact Information\n      Slack Channel\n    \n  \n  \n    \n      CAPI\n      Jeremy Geiger\n      jeremy.geiger@nike.com\n      #nde-capi\n    \n    \n      Cloud Catalog Service\n      Debbie Meier\n      debbie.meier@nike.com\n      #caps-info\n    \n    \n      Cloud Inventory Service\n      Lori Brown\n      lori.brown@nike.com\n      #cic-inventory\n    \n    \n      Cloud Merchandised Product Serviceincludes product, price, SKU, content, value-added service APIs\n      Scott Alvey\n      scott.alvey@nike.com\n      #cic-merch\n    \n    \n      Cloud Product Feed Servicecatalog, inventory, product, taxonomy service aggregator\n      Andy Sun\n      andy.sun@nike.com\n      #cic-merch\n    \n    \n      Cloud Search Service\n      David Wagner\n      david.wagner@nike.com\n      #search-integration\n    \n    \n      Cloud Taxonomy Service\n      Don Lawson\n      don.lawson@nike.com\n      #cic-taxonomy\n    \n    \n      Prodigy Tool\n      Matt Salgado\n      matt.salgado@nike.com\n       \n    \n  \n\n\nEndpoint Mapping\n\nTh 						"documentation-biz-checkout": {
							"id": "documentation-biz-checkout",
							"title": "Buy",
							"category": "documentation",
							"description": "",
		  				"type": "",
							"url": "/#documentationbiz_checkout",
							"content": "Checkout Product Guide\n\nLast Updated: 04/03/2018Submit Feedback: API Doc Slack channel #nde-doc\n\n\nNike gives consumers fast and easy access to make purchases\n\nNike builds digital experiences that showcase its premium products and tell amazing stories. Powering those experiences is Nike Checkout, built to handle the massive scale of global e-commerce.\n\nDrive traffic and engagement in your app by leveraging Nike Checkout today!\n\n\n\n\n\nFeatures\n\nYour consumer finds a Nike a product they love in your app. What happens next?\n\n Shopping Cart &amp; Wish Lists: Add one or more products into a cart or Wish List, where it can be reviewed and edited before completing the purchase\n\n Shipping Options: Display available shipping methods, including costs and estimated delivery dates. Collect and confirm shipping address(es)\n\n Checkout Preview: Confirm product pricing, including sales tax/VAT, shipping fees and taxes, discounts, and value-added services (as applicable)\n\n Submit Order: Finalize and submit an order to Nike for fulfillment.\n\nYour users will experience the joy of receiving Nike products delivered to their door!\n\nConsiderations\n\nSecurity and Privacy are #1\n\nThe security and privacy of your consumer’s data is our #1 concern. Whether in-flight or at rest, your consumer’s personally-identifiable information are protected according to the latest standards.\n\nReliable and Scalable\n\nNike services are built for reliability and scalability, reaping the benefits of cloud network architecture as the backbone of our services.\n\nThe Latest Web Standards\n\nJoin the web economy by using the common language of the internet to interact with Nike services. Your developers will be familiar with issuing JSON-formatted requests to Nike’s REST web services using the standard HTTP protocol.\n\nConnect\n\nWe’re here to help.\n\n #Slack\n\n Email\n\nNext Steps\n\nThe journey begins now!\n\n Buy Domain Developer’s Guide\n\n Supported Countries and Currencies\n\n Get Started with Payment\n\n SLA Documentation\n\nRelated Links\n\nNDe Documentation Home\n\nGetting Started\n\nBusiness Guides\n\nDeveloper’s Guides"
						}

						"documentation-biz-merch-product": {
							"id": "documentation-biz-merch-product",
							"title": "Merchandised Product",
							"category": "documentation",
							"description": "",
		  				"type": "",
							"url": "/#documentationbiz_merch_product",
							"content": "Merchandised Product Guide (DRAFT)\n\n\nLast Updated: 04/03/2018Submit Feedback: API Doc Slack channel #nde-doc\n\n\nIn this guide:\n\n\n\nOverview\n\nFeatures\n\nConsiderations\n\nConnect\n\nNext Steps\n\nOverview\n\nNike products drive the e-commerce and brand experience\n\nThe Merchandised Product API provides access to product content and pricing that you can use to tailor your Nike experience to a global audience, making customers feel like they are shopping locally.  The number of ways to slice the data is limitless.\n\n\n\n\n\nFeatures\n\nThe Merchandised Product API supports the US, Japan, China and European Union geographies, allowing you to reach a wide customer base.\n\nHere is the kind of data accessible to you by using the Merchandised Product API.\n\n Merchandised Products: Provides detailed information about the product such as style, color, where it can be sold, and if it can be customized.\n\n Merchandised SKUs: Gives localized size data, the product a SKU is tied to, where it can be sold and much more.\n\n Merchandised Prices: Presents a complete picture of pricing for a product including full price, sale price, employee price, currency and promotion information.\n\n Merchandised Value-added Services: Includes add-ons associated with a product such as gift wrap, gift bags and personalization.\n\n Product Content: Lists localized content for a product including title, subtitle, description and color to give customers a custom-tailored product experience.\n\nUse the Merchandised Product API to tell your Nike product story.\n\nConsiderations\n\nReliable and Scalable\n\nNike services are built for reliability and scalability, reaping the benefits of cloud network architecture as the backbone of our services.\n\nThe Latest Web API Standards\n\nJoin the web API economy by using the common language of the internet to interact with Nike services. Your developers will be familiar with issuing JSON-formatted requests to Nike’s REST web services using the standard HTTP protocol.\n\nConnect\n\nWe’re here to help.\n\n #Slack\n\n Email\n\nNext Steps\n\nFrom here, explore the Merchandised Product API in detail through the Developer Guide.  Learn more about the product data.  Read about how the Product Feeds API consumes this data\n\n Merchandised Product API Developer’s Guide\n\n Merchandised Product Field Reference\n\n Get Started with the Product Feeds API\n\nRelated Links\n\nNDe Documentation Home\n\nGetting Started\n\nBusiness Guides\n\nDeveloper’s Guides"
						}

						"documentation-biz-product-feeds": {

							"content": "Product Feeds Guide (DRAFT)\n\nLast Updated: 04/03/2018Submit Feedback: API Doc Slack channel #nde-doc\n\n\nGreat apps like SNKRS, Nike+, Nike Training Club and Nike Running Club tell amazing stories while showcasing Nike products and making them available for purchase.\n\nBut how is all that visual content pulled together? It’s done with Product Feeds and you can use it, too.\n\nIn this guide:\n\nOverview\n\nFeatures\n\nConsiderations\n\nConnect\n\nNext Steps\n\nOverview\n\nUse Product Feeds to power compelling user experiences by accessing Nike digital product data and authored content in the form of Cards, Threads, and Feeds.\n\nWhat are Cards, Threads, and Feeds?\n\n Cards contain Nike product information or content such as notifications about upcoming Nike events.\n\n Related Cards are organized into Threads that tell a Nike story.\n\n Multiple Threads make up Feeds, customized for your users based on their chosen preferences.\n\n\n\nFeatures\n\nProduct Feeds is simple and easy to use: it does all the heavy lifting of gathering the content for you.\n\n Get all product feeds for your app, or a specific feed by its ID.\n\n Get all product threads for your app, or a specific thread by its ID. Since each thread includes its cards, no additional calls are required!\n\nConsiderations\n\nEasy adoption\n\nCommon implementations of Product Feeds involve only two calls: get all threads to display them to the user, then get a single thread when the user selects it.\n\nPrerequisites\n\nTo get started, you need a channel identifier for your app. Contact the Product Feeds Product Owner to get one.\n\nReliable and Scalable\n\nNike services are built for reliability and scalability, reaping the benefits of cloud network architecture as the backbone of our services.\n\nThe Latest Web Standards\n\nJoin the web economy by using the common language of the internet to interact with Nike services. Your developers will be familiar with issuing JSON-formatted requests to Nike’s REST web services using the standard HTTP web protocol.\n\nConnect\n\nWe’re here to help.\n\n #Slack\n\n Email\n\nNext Steps\n\nFrom here, explore the Product Feeds Developer Guide to get more details.\n\n Product Feeds Developer’s Guide\n\n Supported Countries and Languages\n\n SLA Documentation\n\nThe journey begins now!\n\nRelated Links\n\nNDe Documentation Home\n\nGetting Started\n\nBusiness Guides\n\nDeveloper’s Guides"
