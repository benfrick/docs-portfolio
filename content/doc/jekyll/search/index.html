    \"commerceStartDate\" : \"2017-10-01T10:00:00.000Z\",\n    \"softLaunchDate\" : \"2017-11-27T08:00:00.000Z\",\n    \"resourceType\" : \"merchProduct\",\n    \"links\" : {\n      \"self\" : {\n        \"ref\" : \"/merch/products/v2/b419ffdf-1a18-52d0-bfb1-a51a9763b83d\"\n      }\n    }\n  }, {\n    \"id\" : \"069f4950-12a9-554c-a645-b3e532ee30b2\",\n    \"snapshotId\" : \"1155fc28-6c12-4fe0-8441-e4288c528345\",\n    \"modificationDate\" : \"2017-11-14T11:17:26.158Z\",\n    \"status\" : \"ACTIVE\",\n    \"merchGroup\" : \"EU\",\n    \"styleCode\" : \"AJ8646\",\n    \"colorCode\" : \"600\",\n    \"styleColor\" : \"AJ8646-600\",\n    \"pid\" : \"12115145\",\n    \"catalogId\" : \"19352cdf-2b40-3cbc-b29e-066fb4829455\",\n    \"productGroupId\" : \"12263238\",\n    \"brand\" : \"Nike\",\n    \"channels\" : [ ],\n    \"legacyCatalogIds\" : [ \"300\" ],\n    \"genders\" : [ \"WOMEN\" ],\n    \"valueAddedServices\" : [ {\n      \"id\" : \"47bc9091-2965-5231-b5f1-a7216e249894\"\n    } ],\n    \"sportTags\" : [ \"Lifestyle\" ],\n    \"classificationConcepts\" : [ ],\n    \"commerceCountryInclusions\" : [ ],\n    \"commerceCountryExclusions\" : [ ],\n    \"quantityLimit\" : 10,\n    \"styleType\" : \"INLINE\",\n    \"productType\" : \"FOOTWEAR\",\n    \"publishType\" : \"LAUNCH\",\n    \"mainColor\" : false,\n    \"exclusiveAccess\" : false,\n    \"commercePublishDate\" : \"2017-11-14T11:13:02.000Z\",\n    \"commerceStartDate\" : \"2017-10-01T10:00:00.000Z\",\n    \"softLaunchDate\" : \"2017-11-27T08:00:00.000Z\",\n    \"resourceType\" : \"merchProduct\",\n    \"links\" : {\n      \"self\" : {\n        \"ref\" : \"/merch/products/v2/069f4950-12a9-554c-a645-b3e532ee30b2\"\n      }\n    }\n  } ],\n  \"errors\" : [ ]\n}\n\n\nSample Merchandised Product List 200 successful response when no products matching the filters are found:\n\n{\n  \"pages\" : {\n    \"next\" : \"/merch/products/v2?count=25&amp;anchor=0&amp;filter=merchgroup(US)&amp;filter=style(111111)\"\n  },\n  \"objects\" : [ ],\n  \"errors\" : [ ]\n}\n\n\nSample Merchandised Product List 400 error response:\n\n{\n    \"httpStatus\": 400,\n    \"code\": \"40000\",\n    \"timestamp\": \"2017-10-10T23:35:05.737+0000\",\n    \"service\": \"merchproductsv2\",\n    \"message\": \"Invalid request parameters\"\n}\n\n\n\n\n \n\nMerchandised Product By ID\n\n\n\nThis service returns product information for the id path parameter and snapshotId query parameter, if supplied. This endpoint returns the same fields as the Merchandised Product List endpoint except for the pages object, because the endpoint only returns one result.\n\nThe caller does not have to send an access token in the Authorization header (indicating the customer is logged in) to use this service.\n\n\n  TIP: If you know the product ID, this endpoint yields faster results than the Merchandised Product List endpoint does because it locates the product record directly by ID rather than filtering the results.\n\n\nEndpoint Details\n\n\n  \n    \n      HTTP Method\n      URI Path\n      Restricted?\n    \n  \n  \n    \n      GET\n      /merch/products/v2/{id}{?snapshotId}\n      No\n    \n  \n\n\nPath &amp; Query Parameters\n\n\n  \n    \n      Parameter\n      Type\n      Description\n      Data Type\n      Required?\n    \n  \n  \n    \n      id\n      path\n      ID of product\n      String\n      Required\n    \n    \n      snapshotId\n      query\n      ID representing the product version\n      String\n      Optional\n    \n  \n\n\nRequest Headers\n\n\n  \n    \n      Header Name\n      Description\n      Required?\n    \n  \n  \n    \n      Accept\n      Content type you will accept in response, application/json is only value allowed\n      Optional\n    \n    \n      Content-Type\n      Content type of the request, application/json is only value allowed\n      Optional\n    \n  \n\n\nRequest Body\n\nNo body is required for GET requests.\n\nSample request URI to list product information for ID 58aaa694-5889-5965-a781-6abcc3e4ff68 and Snapshot ID 34cec674-4200-4001-8632-1f4f3cec5078:\n\nhttps://api.nike.com/merch/products/v2/58aaa694-5889-5965-a781-6abcc3e4ff68?snapshotId=34cec674-4200-4001-8632-1f4f3cec5078 \n\n\nSample request URI to list product information for ID 30e88273-bc07-5a51-bb8a-9c58a789c504:\n\nhttps://api.nike.com/merch/products/v2/30e88273-bc07-5a51-bb8a-9c58a789c504\n\n\nResponse Body\n\nSee the Merchandised Product List endpoint to view the list of response body field definitions.\n\nSample Merchandised Product By ID 200 successful response:\n\n{\n    \"id\": \"30e88273-bc07-5a51-bb8a-9c58a789c504\",\n    \"snapshotId\": \"114d21ad-8fbf-49c9-b552-9173f279b8a9\",\n    \"modificationDate\": \"2017-10-09T16:51:54.050Z\",\n    \"status\": \"ACTIVE\",\n    \"merchGroup\": \"US\",\n    \"styleCode\": \"919704\",\n    \"colorCode\": \"006\",\n    \"styleColor\": \"919704-006\",\n    \"pid\": \"11825501\",\n    \"catalogId\": \"ac7cbede-de38-30d7-bb24-1c7ac8a975c1\",\n    \"productGroupId\": \"11937976\",\n    \"brand\": \"Jordan\",\n    \"channels\": [],\n    \"legacyCatalogIds\": [\n        \"1\"\n    ],\n    \"genders\": [\n        \"MEN\"\n    ],\n    \"valueAddedServices\": [\n        {\n            \"id\": \"47bc9091-2965-5231-b5f1-a7216e249894\"\n        }\n    ],\n    \"sportTags\": [\n        \"Lifestyle\"\n    ],\n    \"widthGroupIds\": [],\n    \"classificationConcepts\": [],\n    \"quantityLimit\": 1,\n    \"styleType\": \"INLINE\",\n    \"productType\": \"FOOTWEAR\",\n    \"publishType\": \"FLOW\",\n    \"mainColor\": false,\n    \"exclusiveAccess\": false,\n    \"hardLaunch\": true,\n    \"commercePublishDate\": \"2017-10-07T07:00:00.000Z\",\n    \"commerceStartDate\": \"2017-10-07T14:00:00.000Z\",\n    \"resourceType\": \"merchProduct\",\n    \"links\": {\n        \"self\": {\n            \"ref\": \"/merch/products/v2/30e88273-bc07-5a51-bb8a-9c58a789c504\"\n        }\n    }\n}\n\n\nSample 404 response:\n\n{\n    \"httpStatus\": 404,\n    \"timestamp\": \"2017-10-12T17:56:13.922+0000\",\n    \"service\": \"merchproductsv2\",\n    \"message\": \"Product not found.\"\n}\n\n\n\n\n\n\nUsing Merchandised Product SKUs\n\n\n  \n    MERCHANDISED PRODUCT SKU LIST\n  \n  \n    MERCHANDISED PRODUCT SKU BY ID\n  \n\n\nMerchandised Product SKU Overview\n\nUse this service to list, add, update and delete merchandised SKU information.\n\n\n  You can search for a specific version of the object by searching by ID and Snapshot ID, which represents a version of the object. Searching by a filter other than Snapshot ID returns the most recent version.\n  Filter field names are case insensitive.\n  One product’s SKU data is returned if searching by SKU ID.\n  If country is not specified, all countries are returned.\n  This is a synchronous service.\n\n\nThe following sections describe each endpoint of the Merchandised Product SKU API in detail.\n\nMerchandised Product SKU List\n\nUse this service to search for multiple SKUs by filter. Search results are sorted in ascending order by the displayOrder field and then stockKeepingUnitId. Note that the displayOrder field is not returned in the results.\n\nEndpoint Details\n\n\n  \n    \n      HTTP Method\n      URI Path\n      Restricted?\n    \n  \n  \n    \n      GET\n      /merch/skus/v2{?filter,snapshotId,count,anchor}\n      No\n    \n  \n\n\nPath &amp; Query Parameters\n\n\n  \n    \n      Parameter\n      Type\n      Description\n      Data Type\n      Required?\n    \n  \n  \n    \n      filter\n      query\n      id (SKU UUID), productid (product UUID from Merch Product endpoint), ‘gtin’ (from Merch Product endpoint) or stockkeepingunitid (from Merch Product endpoint) is requiredcountry is optional\n      String\n      Required\n    \n    \n      snapshotId\n      query\n      Unique ID in UUID format indicating a version of the SKU\n      String\n      Optional\n    \n    \n      count\n      query\n      Number of results to return. Max = 25\n      String\n      Optional\n    \n    \n      anchor\n      query\n      If the value is 10, results returned start with result 11\n      Integer\n      Optional\n    \n  \n\n\nRequest Headers\n\n\n  \n    \n      Header Name\n      Description\n      Required?\n    \n  \n  \n    \n      Accept\n      Content type you will accept in the response. The only accepted value is application/json\n      Optional\n    \n    \n      Content-Type\n      Content type of the request, application/json is only value allowed\n      Optional\n    \n  \n\n\nRequest Body\n\nNo request body is required for GET requests.\n\nLet’s take a look at some sample Merchandised Product SKU scenarios.\n\n\n  \n    \n      I Want to List SKUs for filter\n      Sample Query\n    \n  \n  \n    \n      Product ID 2c4282cc-9fd1-5250-94a5-0c74735443dc\n      https://api.nike.com/merch/skus/v2?filter=productid(2c4282cc-9fd1-5250-94a5-0c74735443dc)\n    \n    \n      GTIN 00887225865153\n      https://api.nike.com/merch/skus/v2/?filter=gtin(00887225865153)\n    \n    \n      Legacy SKU (stockkeepingunitid) 18925450\n      https://api.nike.com/merch/skus/v2/?filter=stockkeepingunitid(18925450)\n    \n  \n\n\nSample Merchandised Product SKU List request URI:\n\nhttps://api.nike.com/merch/skus/v2/?filter=productid(ab9c9789-1a35-503c-8a22-95a745c35df8)&amp;filter=country(US)\n\n\nResponse Body\n\n\n  \n    \n      Element Name\n      Required?\n      Description\n    \n  \n  \n    \n      id\n      Required\n      ID of the SKU\n    \n    \n      snapshotId\n      Required\n      ID of the most recent snapshot of the SKU\n    \n    \n      productId\n      Required\n      productid passed in the query parameter\n    \n    \n      parentId\n      Optional\n      same as the productId if the SKU’s product has no parent\n    \n    \n      parentType\n      Optional\n      type of parent product. In the current version, this is always merchProduct.\n    \n    \n      catalogSkuId\n      Optional\n      UUID of catalog product. See Product Catalog Service for more information.\n    \n    \n      modificationDate\n      Required\n      date the SKU was last modified\n    \n    \n      merchGroup\n      Optional\n      Merchandising group to which this SKU belongs. For more information on Merch Groups, see Merchandised Product Field Reference Guide for a complete list\n    \n    \n      stockKeepingUnitId\n      Optional\n      Deprecated SKU ID that is used for historical purposes by legacy systems.legacy SKUID\n    \n    \n      gtin\n      Required\n      global trade item number\n    \n    \n      nikeSize\n      Optional\n      internal size\n    \n    \n      countrySpecifcations\n      Required\n      array of specifications based on country parameter\n    \n    \n      countrySpecifications.country\n      Optional\n      country, matches the country filter\n    \n    \n      countrySpecifications.localizedSize\n      Optional\n      localized SKU size based on country filter\n    \n    \n      countrySpecifications.taxInfo.commodityCode\n      Optional\n      category code of SKU\n    \n    \n      countrySpecifications.taxtInfo.vat\n      Optional\n      value-added tax based on the country filter, 0 if none\n    \n    \n      resourceType\n      Required\n      type of resource, always merchSku\n    \n    \n      links.self.ref\n      Required\n      referrer link to result\n    \n    \n      errors.requested\n      Optional\n      error message indicating which field caused the error\n    \n    \n      errors.httpStatus\n      Optional\n      HTTP error response code\n    \n    \n      errors.message\n      Optional\n      detailed error message\n    \n  \n\n\nSample HTTP 200 success response from Merchandised Product SKU List:\n\n{\n    \"pages\": {},\n    \"objects\": [\n        {\n            \"id\": \"afb793c5-1bfe-5ec3-a7f7-63e7ea59db13\",\n            \"snapshotId\": \"1292dfcb-b817-4595-b9f9-2dd582c988f0\",\n            \"productId\": \"ab9c9789-1a35-503c-8a22-95a745c35df8\",\n            \"parentId\": \"ab9c9789-1a35-503c-8a22-95a745c35df8\",\n            \"parentType\": \"merchProduct\",\n            \"catalogSkuId\": \"227ccd8a-3b4c-3320-8888-5d2f535c7217\",\n            \"modificationDate\": \"2017-09-07T12:39:48.223Z\",\n            \"merchGroup\": \"US\",\n            \"stockKeepingUnitId\": \"19281872\",\n            \"gtin\": \"00885176589166\",\n            \"nikeSize\": \"7\",\n            \"countrySpecifications\": [\n                {\n                    \"country\": \"US\",\n                    \"localizedSize\": \"7\",\n                    \"taxInfo\": {\n                        \"commodityCode\": \"531119.100\",\n                        \"vat\": 0\n                    }\n                }\n            ],\n            \"resourceType\": \"merchSku\",\n            \"links\": {\n                \"self\": {\n                    \"ref\": \"/merch/skus/v2/afb793c5-1bfe-5ec3-a7f7-63e7ea59db13?country=US\"\n                }\n            }\n        },\n        {\n            \"id\": \"817e6fa3-fba3-52a2-b851-808218528775\",\n            \"snapshotId\": \"196fd2cb-76d0-4009-9764-aee7e16e7bce\",\n            \"productId\": \"ab9c9789-1a35-503c-8a22-95a745c35df8\",\n            \"parentId\": \"ab9c9789-1a35-503c-8a22-95a745c35df8\",\n            \"parentType\": \"merchProduct\",\n            \"catalogSkuId\": \"07306de8-1316-3e7c-895c-d237f21d35d3\",\n            \"modificationDate\": \"2017-09-07T12:39:48.223Z\",\n            \"merchGroup\": \"US\",\n            \"stockKeepingUnitId\": \"19281867\",\n            \"gtin\": \"00885176589180\",\n            \"nikeSize\": \"7.5\",\n            \"countrySpecifications\": [\n                {\n                    \"country\": \"US\",\n                    \"localizedSize\": \"7.5\",\n                    \"taxInfo\": {\n                        \"commodityCode\": \"531119.100\",\n                        \"vat\": 0\n                    }\n                }\n            ],\n            \"resourceType\": \"merchSku\",\n            \"links\": {\n                \"self\": {\n                    \"ref\": \"/merch/skus/v2/817e6fa3-fba3-52a2-b851-808218528775?country=US\"\n                }\n            }\n        }\n     ],\n    \"errors\":[]\n}\n\n\nSample 404 error response from Merchandised Product SKU List:\n\n{\n    \"pages\": {},\n    \"objects\": [],\n    \"errors\": [\n        {\n            \"requested\": \"productid(null)\",\n            \"httpStatus\": 404,\n            \"message\": \"Resource Not Found\"\n        }\n    ]\n}\n\n\n\n\n\n\nMerchandised Product SKU by ID\n\nUse this service to search for SKU information by SKU ID. This service returns the same data as the Merchandised Product SKU List endpoint returns except for the pages object because the endpoint only returns one result. In order to get a SKU ID, you can query the Merchandised Product SKU List endpoint filtering by productid.\n\n\n  TIP: If you know the SKU ID, this endpoint yields faster results than the Merchandised Product SKU List endpoint does because it locates the SKU record directly by ID rather than filtering the results.\n\n\nMerchandised Product SKU by ID Details\n\n\n  \n    \n      HTTP Method\n      URI Path\n      Restricted?\n    \n  \n  \n    \n      GET\n      /merch/skus/v2/{id}\n      No\n    \n  \n\n\nPath and Query Parameters\n\n\n  \n    \n      Parameter\n      Type\n      Description\n      Data Type\n      Required?\n    \n  \n  \n    \n      id\n      path\n      sku ID\n      string\n      Required\n    \n    \n      snapshotId\n      query\n      Unique ID in UUID format indicating a version of the SKU\n      string\n      Optional\n    \n    \n      fields\n      query\n      list of fields to return. if not sent, all fields are returned\n      string\n      Optional\n    \n    \n      country\n      query\n      country used to localize results\n      string\n      Optional\n    \n  \n\n\nRequest Headers\n\n\n  \n    \n      Header Name\n      Description\n      Required?\n    \n  \n  \n    \n      Accept\n      Content type you will accept in response, application/json is only value allowed\n      No\n    \n    \n      Content-Type\n      Content type of the request, application/json is only value allowed\n      No\n    \n  \n\n\nRequest Body\n\nRequired parts of the request body:\n\nNo body is required for a GET request.\n\n\n  \n    \n      I Want to List SKU UUID\n      Sample Query\n    \n  \n  \n    \n      036006d4-fdb7-55f6-9430-9eaf239ce22f\n      https://api.nike.com/merch/skus/v2/036006d4-fdb7-55f6-9430-9eaf239ce22f\n    \n    \n      036006d4-fdb7-55f6-9430-9eaf239ce22f in Finland\n      https://api.nike.com/merch/skus/v2/036006d4-fdb7-55f6-9430-9eaf239ce22f?country=FI\n    \n  \n\n\nSample Product SKU by ID request URI:\n\nhttps://api.nike.com/merch/skus/v2/afb793c5-1bfe-5ec3-a7f7-63e7ea59db13\n\n\nResponse Body\n\nSample Merchandised Product SKU By ID 200 successful response:\n\n\n  TIP: See the Merchandised Product SKU List endpoint to view the list of field definitions.\n\n\n{\n    \"id\": \"afb793c5-1bfe-5ec3-a7f7-63e7ea59db13\",\n    \"snapshotId\": \"1292dfcb-b817-4595-b9f9-2dd582c988f0\",\n    \"productId\": \"ab9c9789-1a35-503c-8a22-95a745c35df8\",\n    \"parentId\": \"ab9c9789-1a35-503c-8a22-95a745c35df8\",\n    \"parentType\": \"merchProduct\",\n    \"catalogSkuId\": \"227ccd8a-3b4c-3320-8888-5d2f535c7217\",\n    \"modificationDate\": \"2017-09-07T12:39:48.223Z\",\n    \"merchGroup\": \"US\",\n    \"stockKeepingUnitId\": \"19281872\",\n    \"gtin\": \"00885176589166\",\n    \"nikeSize\": \"7\",\n    \"countrySpecifications\": [\n        {\n            \"country\": \"US\",\n            \"localizedSize\": \"7\",\n            \"taxInfo\": {\n                \"commodityCode\": \"531119.100\",\n                \"vat\": 0\n            }\n        }\n    ],\n    \"resourceType\": \"merchSku\",\n    \"links\": {\n        \"self\": {\n            \"ref\": \"/merch/skus/v2/afb793c5-1bfe-5ec3-a7f7-63e7ea59db13\"\n        }\n    }\n}\n\n\n\n\n\n\nUsing Merchandised Product Prices\n\n\n  \n    MERCHANDISED PRICES LIST\n  \n  \n    MERCHANDISED PRICES BY ID\n  \n\n\nMerchandised Product Prices Overview\n\nUse this API to list, create and delete product prices.\n\n\n  You can search for a specific version of the object by searching by ID and Snapshot ID, which represents the version of the object. Searching by a filter other than ‘snapshotid returns the most recent version.\n  Filter field names are case insensitive.\n  One product’s price data is returned if searching by price ID.\n  All endpoints are synchronous.\n\n\nThe following sections describe each endpoint of the Merchandised Product Price API in detail.\n\nMerchandised Prices List\n\nUse this endpoint to list price data by price ID or by product ID and country. Because price values and currency are localized, both country and productid are required parameters when searching by productid. Country is not required when searching by price ID because the price record for a price ID is for a specific country. To get the price ID in the results, first search by productid and country. If you do not know the product id, use the Merchandised Product List endpoint to search by style-color or style. Product ID is returned in the results.\n\nNo special headers are required to use this endpoint so it can be executed in any browser, and the customer does not have to be logged in.\n\nEndpoint Details\n\n\n  \n    \n      HTTP Method\n      URI Path\n      Restricted?\n    \n  \n  \n    \n      GET\n      /merch/prices/v2{?filter,fields,anchor,count}\n      No\n    \n  \n\n\nPath &amp; Query Parameters\n\n\n  \n    \n      Parameter\n      Type\n      Description\n      Data Type\n      Required?\n    \n  \n  \n    \n      filter\n      query\n      productid + country or price ID\n      String\n      Required\n    \n    \n      snapshotId\n      query\n      ID representing the price version\n      String\n      Optional\n    \n    \n      count\n      query\n      Number of results to return, default = 25, max = 25\n      Integer\n      Optional\n    \n    \n      anchor\n      query\n      If the value is 10, results returned start with result 11\n      Integer\n      Optional\n    \n  \n\n\nRequest Headers\n\n\n  \n    \n      Header Name\n      Description\n      Required?\n    \n  \n  \n    \n      Accept\n      Content type you will accept in response, application/json is only value allowed\n      Optional\n    \n    \n      Content-Type\n      Content type of the request, application/json is only value allowed\n      Optional\n    \n  \n\n\nRequest Body\n\nThere is no request body for a GET request.\n\nLet’s take a look at Merchandised Price List scenarios.\n\n\n  \n    \n      I Want to List Prices for\n      Sample Query\n    \n  \n  \n    \n      Product UUID and a specific location (e.g. Ireland)\n      https://api.nike.com/merch/prices/v2/?filter=productid(58aaa694-5889-5965-a781-6abcc3e4ff68)&amp;filter=country(IE)\n    \n    \n      Price UUID 486d098c-a403-5fb7-8305-243d71625d4c and snapshotId 678408f9-0eea-4560-b537-e85c131e9495\n      https://api.nike.com/merch/prices/v2/?filter=id(486d098c-a403-5fb7-8305-243d71625d4c)&amp;filter=snapshotId(85ebb452-f61c-46a2-b0ce-14a89a542816)\n    \n  \n\n\nNote that for the productid + country price queries, there is a different price record for each country. Querying by ID is for a specific country.\n\nResponse Body\n\n\n  \n    \n      Element Name\n      Required?\n      Description\n    \n  \n  \n    \n      pages\n      Optional\n      object with a next and prev link used to paginate results\n    \n    \n      pages.prev\n      Optional\n      relative URL to the previous page of results\n    \n    \n      pages.next\n      Optional\n      relative URL to the next page of results\n    \n    \n      id\n      Required\n      ID of the price in UUID format, generated when product flows into Merchandised Price from Prodigy\n    \n    \n      snapshotId\n      Required\n      ID of the most recent snapshot of the price in UUID format\n    \n    \n      productId\n      Required\n      ID of product this price belongs to\n    \n    \n      parentId\n      Optional\n      ID of parent product this price belongs to, alias for productId\n    \n    \n      parentType\n      Optional\n      type of parent product, always merchProduct\n    \n    \n      modificationDate\n      Required\n      timestamp the price was last modified\n    \n    \n      country\n      Required\n      country of this price, see Merchandised Product Field Reference Guide for a complete list\n    \n    \n      msrp\n       \n      manufacturer’s recommended retail price. often not provided or may be 0\n    \n    \n      fullPrice\n      Required\n      Nike’s original, retail price used for display purposes when a product is discounted and the full retail price is displayed with a strikethrough (e.g. a clearance product) and used by the Buy API to calculate the difference between current retail price and full retail price to send to fufillment system\n    \n    \n      currentPrice\n      Required\n      purchase price of product. if discounted, price is calculated in Prodigy/PI\n    \n    \n      employeePrice\n      Required\n      employee price of product\n    \n    \n      currency\n      Required\n      localized currency according to country\n    \n    \n      discounted\n      Required\n      true or false indicating this product is on sale set by the Price Class field in Prodigy/PI\n    \n    \n      promoInclusions\n      Required\n      array of promotions associated with this price\n    \n    \n      promoExclusions\n      Required\n      array of true or false values indicating if promo exclusions apply to this price\n    \n    \n      resourceType\n      Required\n      type of resource, always merchSku\n    \n    \n      links.self.ref\n      Required\n      referrer link to result\n    \n    \n      errors.requested\n      Required\n      error message indicating which field caused the error\n    \n    \n      errors.httpStatus\n      Required\n      HTTP error response code\n    \n    \n      errors.message\n      Required\n      detailed error message\n    \n  \n\n\nSample Merchandised Prices List 200 successful response:\n\n{\n  \"pages\" : { },\n  \"objects\" : [ {\n    \"id\" : \"486d098c-a403-5fb7-8305-243d71625d4c\",\n    \"snapshotId\" : \"85ebb452-f61c-46a2-b0ce-14a89a542816\",\n    \"productId\" : \"58aaa694-5889-5965-a781-6abcc3e4ff68\",\n    \"parentId\" : \"58aaa694-5889-5965-a781-6abcc3e4ff68\",\n    \"parentType\" : \"merchProduct\",\n    \"modificationDate\" : \"2017-06-06T17:39:16.405Z\",\n    \"country\" : \"IE\",\n    \"msrp\" : 170,\n    \"fullPrice\" : 170,\n    \"currentPrice\" : 118.99,\n    \"currency\" : \"EUR\",\n    \"discounted\" : true,\n    \"promoInclusions\" : [ ],\n    \"promoExclusions\" : [ ],\n    \"resourceType\" : \"merchPrice\",\n    \"links\" : {\n      \"self\" : {\n        \"ref\" : \"/merch/prices/v2/486d098c-a403-5fb7-8305-243d71625d4c\"\n      }\n    }\n  } ],\n  \"errors\" : [ ]\n}\n\n\n\n\n\n\nMerchandised Prices by ID\n\nUse this endpoint to list price data by price ID. To get the price ID, search by productid and country using the Merchandised Prices List endpoint and Price ID is returned in the results. If you do not know the product id, use the Merchandised Product List endpoint to search by style-color or style. Product ID is returned in the results.\n\nResults from this endpoint are almost identical to those returned from the Merchandised Product List endpoint. The difference is no pagination data is returned and you can only search by one price ID at a time.\n\nNo special headers are required to use this endpoint so it can be executed in any browser, and the customer does not have to be logged in.\n\n\n  TIP: If you know the price ID, this endpoint yields faster results than the Merchandised Prices List endpoint does because it locates the price record directly by ID rather than filtering the results.\n\n\nEndpoint Details\n\n\n  \n    \n      HTTP Method\n      URI Path\n      Restricted?\n    \n  \n  \n    \n      GET\n      /merch/prices/v2/{id}?{snapshotId}\n      No\n    \n  \n\n\nPath &amp; Query Parameters\n\n\n  \n    \n      Parameter\n      Type\n      Description\n      Data Type\n      Required?\n    \n  \n  \n    \n      filter\n      Path\n      field list and values to search for. ID or productid + country is required.maximum of one country is supported\n      String\n      Required\n    \n    \n      snapshotId\n      Query\n      ID representing the product version, allowed in listing by price ID only\n      String\n      Optional\n    \n  \n\n\nRequest Headers\n\n\n  \n    \n      Header Name\n      Description\n      Required?\n    \n  \n  \n    \n      Accept\n      Content type you will accept in response, application/json is only value allowed\n      Optional\n    \n    \n      Content-Type\n      Content type of the request, application/json is only value allowed\n      Optional\n    \n  \n\n\nRequest Body\n\nThere is no request body for a GET request.\n\nLet’s take a look at some Merchandised Price by ID scenarios.\n\n\n  \n    \n      I Want to List Merchandised Price for\n      Sample Query\n    \n  \n  \n    \n      price ID 486d098c-a403-5fb7-8305-243d71625d4c\n      https://api.nike.com/merch/prices/v2/486d098c-a403-5fb7-8305-243d71625d4c\n    \n    \n      price ID 486d098c-a403-5fb7-8305-243d71625d4c and snapshotId 85ebb452-f61c-46a2-b0ce-14a89a542816\n      https://api.nike.com/merch/prices/v2/486d098c-a403-5fb7-8305-243d71625d4c?filter=snapshotId(85ebb452-f61c-46a2-b0ce-14a89a542816)\n    \n  \n\n\nSample Merchandised Price by ID request URI:\n\nhttps://api.nike.com/merch/prices/v2/486d098c-a403-5fb7-8305-243d71625d4c\n\n\nResponse Body\n\nSee the Merchandised Prices List endpoint for a description of response body field descriptions.\n\nSample 200 success response:\n\n{\n  \"id\" : \"486d098c-a403-5fb7-8305-243d71625d4c\",\n  \"snapshotId\" : \"85ebb452-f61c-46a2-b0ce-14a89a542816\",\n  \"productId\" : \"58aaa694-5889-5965-a781-6abcc3e4ff68\",\n  \"parentId\" : \"58aaa694-5889-5965-a781-6abcc3e4ff68\",\n  \"parentType\" : \"merchProduct\",\n  \"modificationDate\" : \"2017-06-06T17:39:16.405Z\",\n  \"country\" : \"IE\",\n  \"msrp\" : 170,\n  \"fullPrice\" : 170,\n  \"currentPrice\" : 118.99,\n  \"currency\" : \"EUR\",\n  \"discounted\" : true,\n  \"promoInclusions\" : [ ],\n  \"promoExclusions\" : [ ],\n  \"resourceType\" : \"merchPrice\",\n  \"links\" : {\n    \"self\" : {\n      \"ref\" : \"/merch/prices/v2/486d098c-a403-5fb7-8305-243d71625d4c\"\n    }\n  }\n}\n\n\n\n\n\n\nUsing Merchandised Value Added Services\n\n\n  \n    MERCHANDISED VALUE ADDED SERVICES LIST\n  \n  \n    MERCHANDISED VALUE ADDED SERVICES BY ID\n  \n\n\nMerchandised Value Added Services Overview\n\nProducts can be merchandised with one or more Value Added Services (VAS) such as gift wrap or personalization. Digital and physical gift cards are another example of VAS as customers can personalize the gift message and configure the amount. A VAS can be merchandised to an unlimited number of products. Use this service to list, add, and delete VAS.\n\n\n  You can search for a specific version of the object by searching by ID and Snapshot ID, which represents the version of the object. Searching by a filter other than snapshotId returns the most recent version.\n  Filter field names are case insensitive.\n  One VAS is returned if searching by VAS ID.\n  All endpoints are synchronous.\n\n\nNote that the VAS services return a field named pid.  Even though this field implies a one-to-one relationship between product and VAS, this field is a legacy ID used for reporting purposes in Prodigy. Products can have several Value-Added Service objects associated with them.\n\nThe following sections describe each endpoint of the Merchandised Value Added Services API in detail.\n\nMerchandised Value Added Services List\n\nUse this endpoint to list VAS by type or by VAS ID. Listing by multiple IDs is supported.\n\nIf you want to search by VAS ID but do not know it, call the Merchandised Product List endpoint first. The value_added_service ID will be returned in the search results for each product that has one or more value-added service attributes.\n\nThe customer does not have to be logged in to call this endpoint.\n\nThis endpoint requires no special headers so you can execute test calls in any browser.\n\nEndpoint Details\n\n\n  \n    \n      HTTP Method\n      URI Path\n      Restricted?\n    \n  \n  \n    \n      GET\n      /merch/value_added_services/v1{?filter,fields,count,anchor}\n      No\n    \n  \n\n\nPath &amp; Query Parameters\n\n\n  \n    \n      Parameter\n      Type\n      Description\n      Data Type\n      Required?\n    \n  \n  \n    \n      filter\n      Query\n      Values to search for, ID or type is supported\n      String\n      Optional\n    \n    \n      fields\n      query\n      List of fields to return. if not sent, all fields are returned\n      string\n      Optional\n    \n    \n      count\n      Query\n      Number of results to return, default = 25, max = 25\n      Integer\n      Optional\n    \n    \n      anchor\n      Query\n      If the value is 10, results returned start with result 11\n      Integer\n      Optional\n    \n  \n\n\nLet’s take a look at some Merchandised Value Added Services List scenarios.\n\n\n  \n    \n      I Want to List VAS Details for\n      Sample Query\n    \n  \n  \n    \n      VAS type DIGITAL_GIFT_CARD\n      https://api.nike.com/merch/value_added_services/v1?filter=type(DIGITAL_GIFT_CARD)\n    \n    \n      VAS ID 47bc9091-2965-5231-b5f1-a7216e249894\n      https://api.nike.com/merch/value_added_services/v1?filter=id(47bc9091-2965-5231-b5f1-a7216e249894)\n    \n    \n      VAS ID 124ae4cb-0506-5b52-98c0-06eaf7b7ea67 and VAS ID 47bc9091-2965-5231-b5f1-a7216e249894\n      https://api.nike.com/merch/value_added_services/v1?filter=id(124ae4cb-0506-5b52-98c0-06eaf7b7ea67,47bc9091-2965-5231-b5f1-a7216e249894)\n    \n    \n      VAS ID 47bc9091-2965-5231-b5f1-a7216e249894 and Snapshot ID 52ca6f5b-fde9-4daf-af65-3993ef7eb428\n      https://api.nike.com/merch/value_added_services/v1?filter=id(afd90c5b-230f-5fd3-b3a4-af36c5dbd55d)&amp;filter=snapshotId(e0861083-f3a3-4120-bc30-29888113e940)\n    \n    \n      all available VAS\n      https://api.nike.com/merch/value_added_services/v1\n    \n  \n\n\nRequest Headers\n\n\n  \n    \n      Header Name\n      Description\n      Required?\n    \n  \n  \n    \n      Accept\n      Content type you will accept in response, application/json is only value allowed\n      Optional\n    \n    \n      Content-Type\n      Content type of the request, application/json is only value allowed\n      Optional\n    \n  \n\n\nRequest Body\n\nThere is no body in a GET request.\n\nResponse Body\n\n\n  \n    \n      Element Name\n      Required or Optional\n      Description\n    \n  \n  \n    \n      pages\n      Optional\n      object with a next and prev link used to paginate results\n    \n    \n      pages.prev\n      Optional\n      relative URL to the previous page of results\n    \n    \n      pages.next\n      Optional\n      relative URL to the next page of results\n    \n    \n      id\n      Required\n      ID of the VAS in UUID format, generated when VAS flows into Merchandised VAS from Prodigy\n    \n    \n      snapshotId\n      Required\n      ID of the most recent snapshot of the VAS in UUID format\n    \n    \n      modificationDate\n      Required\n      timestamp the VAS was last modified\n    \n    \n      status\n      Required\n      VAS status, see Merchandised Product Field Reference Guide for a complete list\n    \n    \n      merchGroup\n      Required\n      merchandising group this VAS is merchandised to, see Merchandised Product Field Reference Guide for a complete list\n    \n    \n      pid\n      Required\n      legacy product id used to map to the product UUID\n    \n    \n      type\n      Required\n      VAS type\n    \n    \n      displayName\n      Optional\n      VAS display name\n    \n    \n      commercePublishDate\n      Optional\n      timestamp indicating when this VAS was published\n    \n    \n      commerceStartDate\n      Optional\n      timestamp indicating when the VAS is available\n    \n    \n      resourceType\n      Required\n      type of resource, always merchValueAddedService\n    \n    \n      links.self.ref\n      Required\n      referrer link to result\n    \n  \n\n\nSample Merchandised Value Added Services List 200 successful response:\n\n{\n  \"pages\" : {\n    \"prev\" : \"/merch/value_added_services/v1?count=25&amp;filter=type(PERSONALIZATION)\"\n  },\n  \"objects\" : [ {\n    \"id\" : \"4a5c81c4-840d-5672-9db0-958105676ead\",\n    \"snapshotId\" : \"798f7ea0-e100-4f9a-a9f9-566d147f6841\",\n    \"modificationDate\" : \"2017-02-01T03:38:30.741Z\",\n    \"status\" : \"ACTIVE\",\n    \"merchGroup\" : \"US\",\n    \"pid\" : \"11820995\",\n    \"type\" : \"PERSONALIZATION\",\n    \"displayName\" : \"VAS0011-996 MyPrint VAS - 20 USD\",\n    \"commercePublishDate\" : \"2016-12-15T21:19:18.000Z\",\n    \"commerceStartDate\" : \"2016-12-15T17:00:00.000Z\",\n    \"resourceType\" : \"merchValueAddedService\",\n    \"links\" : {\n      \"self\" : {\n        \"ref\" : \"/merch/value_added_services/v1/4a5c81c4-840d-5672-9db0-958105676ead\"\n      }\n    }\n  }, {\n    \"id\" : \"59277764-f748-5572-8195-f1958d9baccb\",\n    \"snapshotId\" : \"4b8c149f-0296-4cf9-b5a4-266aee02f00a\",\n    \"modificationDate\" : \"2017-05-22T01:33:46.744Z\",\n    \"status\" : \"CLOSEOUT\",\n    \"merchGroup\" : \"US\",\n    \"pid\" : \"11067215\",\n    \"type\" : \"PERSONALIZATION\",\n    \"displayName\" : \"VAS0007-996 PiD VAS - Black Text only\",\n    \"commercePublishDate\" : \"2015-09-21T18:29:32.000Z\",\n    \"commerceStartDate\" : \"2015-09-11T23:05:00.000Z\",\n    \"resourceType\" : \"merchValueAddedService\",\n    \"links\" : {\n      \"self\" : {\n        \"ref\" : \"/merch/value_added_services/v1/59277764-f748-5572-8195-f1958d9baccb\"\n      }\n    }\n  }\n\n\n\n\n\n\nMerchandised Value Added Services by ID\n\nUse this endpoint when you want to list the fields for one VAS ID. This endpoint returns almost identical results as the Merchandised Value Added Services List endpoint returns except that it does not return pagination information because it returns only one VAS object. This endpoint returns a quicker response than the Merchandised Value Added Services List endpoint because it does not filter or paginate the results.\n\nIf you do not know the VAS ID, call the Merchandised Product List endpoint first. The value_added_service ID will be returned in the search results for each product that has one or more VAS attributes.\n\nThe customer does not have to be logged in to call this endpoint.\n\nThis endpoint requires no special headers so you can execute test calls in any browser.\n\nEndpoint Details\n\n\n  \n    \n      HTTP Method\n      URI Path\n      Restricted?\n    \n  \n  \n    \n      GET\n      /merch/value_added_services/v1/{id}/{?snapshotId,fields}\n      No\n    \n  \n\n\nPath &amp; Query Parameters\n\n\n  \n    \n      Parameter\n      Type\n      Description\n      Data Type\n      Required?\n    \n  \n  \n    \n      id\n      Path\n      VAS ID\n      String\n      Required\n    \n    \n      snapshotId\n      Query\n      ID representing the product version, allowed in listing by price ID only\n      String\n      Optional\n    \n    \n      fields\n      Query\n      List of fields to return. If not supplied, all fields are returned\n      String\n      Optional\n    \n  \n\n\nLet’s take a look at some Merchandised Value Added Services by ID scenarios.\n\n\n  \n    \n      I Want to List VAS Details for\n      Sample Query\n    \n  \n  \n    \n      ID 56e48cf5-050f-51a7-b6ce-1ca5ab9d415b\n      https://api.nike.com/merch/value_added_services/v1?filter=id(47bc9091-2965-5231-b5f1-a7216e249894)\n    \n    \n      ID 56e48cf5-050f-51a7-b6ce-1ca5ab9d415b and Snapshot ID 52ca6f5b-fde9-4daf-af65-3993ef7eb428\n      https://api.nike.com/merch/value_added_services/v1/56e48cf5-050f-51a7-b6ce-1ca5ab9d415b?snapshotId=566ba45b-898b-4f19-a743-c12e8a753945\n    \n    \n      ID 56e48cf5-050f-51a7-b6ce-1ca5ab9d415b and only return pid and type fields\n      https://api.nike.com/merch/value_added_services/v1/56e48cf5-050f-51a7-b6ce-1ca5ab9d415b?fields=(status,pid,type)\n    \n  \n\n\nRequest Headers\n\n\n  \n    \n      Header Name\n      Description\n      Required?\n    \n  \n  \n    \n      Accept\n      Content type you will accept in response, application/json is only value allowed\n      Optional\n    \n    \n      Content-Type\n      Content type of the request, application/json is only value allowed\n      Optional\n    \n  \n\n\nRequest Body\n\nThere is no body in a GET request.\n\nResponse Body\n\nSee the Merchandised Value Added Services List Response Body endpoint for a list of VAS field descriptions returned in the response.\n\nSample Merchandised Value Added Services by ID 200 successful response:\n\n{\n  \"id\" : \"124ae4cb-0506-5b52-98c0-06eaf7b7ea67\",\n  \"snapshotId\" : \"99e78ccb-182c-4b65-9e21-bc7214d757d7\",\n  \"modificationDate\" : \"2017-02-03T07:04:15.797Z\",\n  \"status\" : \"CLOSEOUT\",\n  \"merchGroup\" : \"US\",\n  \"pid\" : \"10085087\",\n  \"type\" : \"DIGITAL_GIFT_CARD\",\n  \"displayName\" : \"Nike Gift Card\",\n  \"commerceStartDate\" : \"2010-12-01T00:00:00.000Z\",\n  \"resourceType\" : \"merchValueAddedService\",\n  \"links\" : {\n    \"self\" : {\n      \"ref\" : \"/merch/value_added_services/v1/124ae4cb-0506-5b52-98c0-06eaf7b7ea67\"\n    }\n  }\n}\n\n\n\n\n\n\nUsing Product Content\n\n\n  PRODUCT CONTENT BY STYLE COLOR\n  PRODUCT CONTENT BY STYLE COLOR LIST\n  PRODUCT CONTENT ITEM BY STYLE COLOR\n  PRODUCT CONTENT FIELD BY STYLE COLOR LIST\n  PRODUCT IMAGE SET BY STYLE COLOR\n  PRODUCT BASE IMAGE URL BY STYLE COLOR\n  PRODUCT IMAGE SET BY STYLE COLOR LIST\n  PRODUCT BASE IMAGE URL BY STYLE COLOR LIST\n\n\nProduct Content Overview\n\nUse these services to list product content such as title, subtitle, description, and images by country and locale.\n\nThere are two sets of Product Content services, internal and external. External services go through the public router (api.nike.com and snkrs.prod.commerce.nikecloud.com) and return product information for products in the ACTIVE and CLOSEOUT status. Internal services go through the frame router (frame.prod.commerce.nikecloud.com). These services return identical fields to the external services but they return all products regardless of status. When making service to service calls, use the internal Product Content endpoints.\n\nAll endpoints are synchronous.\n\nThe following sections describe each endpoint of the Product Content Services API in detail.\n\nProduct Content by Style Color\n\nUse this endpoint to list localized product content for a style-color, country and locale.\n\nEndpoint Details\n\n\n  \n    \n      HTTP Method\n      URI Path\n      Restricted?\n    \n  \n  \n    \n      GET\n      /merch/contents/v1/{style-color}/content{?country,locale}\n      No\n    \n  \n\n\nPath &amp; Query Parameters\n\n\n  \n    \n      Parameter\n      Type\n      Description\n      Data Type\n      Required?\n    \n  \n  \n    \n      style-color\n      Path\n      style-color code of content\n      String\n      Required\n    \n    \n      country\n      Query\n      country used to localize the content for the correct country, see Merchandised Product Field Reference Guide for a complete list\n      String\n      Required\n    \n    \n      locale\n      Query\n      locale used to localize the content for the correct language\n      String\n      Required\n    \n  \n\n\nLet’s take a look at some Product Content by Style Color scenarios.\n\n\n  \n    \n      I Want to List Product Content for\n      Sample Query\n    \n  \n  \n    \n      style-color code 919704-006 in Spain for locale es_ES\n      https://api.nike.com/merch/contents/v1/919704-006/content?country=ES&amp;locale=es_ES\n    \n  \n\n\nRequest Headers\n\n\n  \n    \n      Header Name\n      Description\n      Required?\n    \n  \n  \n    \n      Accept\n      Content type you will accept in response, application/json is only value allowed\n      Optional\n    \n    \n      Content-Type\n      Content type of the request, application/json is only value allowed\n      Optional\n    \n  \n\n\nRequest Body\n\nThere is no request body for a GET request.\n\nSample Product Content by Style Color URI:\n\nhttps://api.nike.com/merch/contents/v1/919704-006/content?country=ES&amp;locale=es_ES\n\n\nResponse Body\n\n\n  \n    \n      Element Name\n      Required?\n      Description\n    \n  \n  \n    \n      globalPid\n      Optional\n      global product ID from legacy system\n    \n    \n      parentId\n      Optional\n      ID of parent product in UUID format\n    \n    \n      parentType\n      Optional\n      type of parent product, always merchProduct\n    \n    \n      langLocale\n      Optional\n      locale of product content\n    \n    \n      colorDescription\n      Optional\n      localized color description\n    \n    \n      slug\n      Optional\n      slug ID of the product\n    \n    \n      fullTitle\n      Required\n      localized full title of product\n    \n    \n      title\n      Optional\n      localized short title of product\n    \n    \n      subtitle\n      Optional\n      localized subtitle of product\n    \n    \n      descriptionHeading\n      Optional\n      localized heading description\n    \n    \n      description\n      Optional\n      localized long description of product\n    \n    \n      headLine\n      Optional\n      localized headline of product\n    \n    \n      preOrder\n      Optional\n      localized preorder text\n    \n    \n      softLaunch\n      Optional\n      localized soft launch text\n    \n    \n      outOfStock\n      Optional\n      localized out of stock text\n    \n    \n      notifyMe\n      Optional\n      localized notify me text\n    \n    \n      accessCode\n      Optional\n      localized access code text\n    \n    \n      pdpGeneral\n      Optional\n      key for custom messaging e.g. preOrder or notifyMe\n    \n    \n      productName\n      Optional\n      localized product name\n    \n    \n      techSpec\n      Optional\n      localized technical specification text\n    \n    \n      benefitSummaryList\n      Optional\n      localized list of benefits text\n    \n    \n      benefitSummaryVideo\n      Optional\n      localized benefits video URI\n    \n    \n      manufacturingCountryOfOrigin\n      Optional\n      localized name of country where product was manufactured\n    \n    \n      shippingDelay\n      Optional\n      integer value representing when the customer must be notified of a shipping delay\n    \n    \n      sizeChart\n      Optional\n      key of size chart for this product\n    \n    \n      imageBadgeResource\n      Optional\n      relative URI to image such as “Editor’s Choice” image\n    \n    \n      colors\n      Optional\n      array of color items associated with this product\n    \n    \n      colors.type\n      Optional\n      type of color e.g. simple, primary or secondary\n    \n    \n      colors.name\n      Optional\n      localized color\n    \n    \n      colors.hex\n      Optional\n      color hex value\n    \n    \n      bestFor\n      Optional\n      array of bestFor items\n    \n    \n      bestFor.value\n      Optional\n      bestFor value such as surface best used on\n    \n    \n      bestFor.localizedValue\n      Optional\n      localized value such as surface best used on\n    \n    \n      bestFor.type\n      Optional\n      bestFor type\n    \n    \n      athletes\n      Optional\n      array of athlete items\n    \n    \n      athletes.value\n      Optional\n      athlete value, such as athlete’s name\n    \n    \n      athletes.localizedValue\n      Optional\n      athlete value, localized athlete name\n    \n    \n      widths\n      Optional\n      array of widths\n    \n    \n      widths.type\n      Optional\n      width type\n    \n    \n      widths.value\n      Optional\n      internal width value\n    \n    \n      widths.localizedValue\n      Optional\n      localized width value\n    \n  \n\n\nSample Product Content by Style Color response body:\n\n{\n  \"globalPid\" : \"11825501\",\n  \"parentId\" : \"d48fbb0b-4516-5075-8a8f-32401eed44af\",\n  \"parentType\" : \"merchProduct\",\n  \"langLocale\" : \"es_ES\",\n  \"colorDescription\" : \"Negro/Blanco/Royal juego\",\n  \"slug\" : \"air-jordan-1-retro-high-flyknit-zapatillas\",\n  \"fullTitle\" : \"Air Jordan 1 Retro High Flyknit Zapatillas - Hombre\",\n  \"title\" : \"Air Jordan 1 Retro High Flyknit\",\n  \"subtitle\" : \"Zapatillas - Hombre\",\n  \"descriptionHeading\" : \"AIRE RETRO. TOQUES MODERNOS.\",\n  \"description\" : \"&lt;div class=\\\"pi-tier3\\\"&gt;&lt;div class=\\\"pi-pdpmainbody\\\"&gt;&lt;p&gt;&lt;b&gt;AIRE RETRO. TOQUES MODERNOS.&lt;/b&gt;&lt;/p&gt;&lt;br&gt;&lt;p&gt;Las zapatillas Air Jordan 1 Retro High Flyknit para hombre actualizan el icónico diseño original con un tejido Flyknit ligero y flexible.&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;b&gt;Ventajas&lt;/b&gt;&lt;/p&gt;&lt;li&gt;Ligero material Flyknit para una mayor transpirabilidad y flexibilidad&lt;/li&gt;&lt;li&gt;Detalles de piel de cuero de cerdo para un look premium&lt;/li&gt;&lt;li&gt;Confección con cupsole de goma para proporcionar una sujeción resistente y una mayor tracción&lt;/li&gt;&lt;li&gt;Unidad Nike Air para disfrutar de una amortiguación ligera&lt;/li&gt;&lt;br&gt;&lt;p&gt;&lt;b&gt;Orígenes de Flyknit&lt;/b&gt;&lt;/p&gt;La tecnología Nike Flyknit se inspira en las opiniones de atletas que llevan tiempo buscando unas zapatillas con el ajuste ceñido y la sensación de no llevar nada, como la de un calcetín. Nike se embarcó en un proyecto de cuatro años con equipos de programadores, ingenieros y diseñadores para crear una tecnología que ayudase a confeccionar una parte superior tejida con propiedades estáticas que aportara estructura y durabilidad. Más adelante, se ajustó la distribución precisa de las partes que aportan sujeción, transpirabilidad y flexibilidad, todo en una sola capa. El resultado es una parte superior extremadamente ligera, ceñida y prácticamente sin costuras. Esta precisión sin precedentes multiplica el rendimiento y disminuye el desperdicio de materiales en un 60 % en comparación con la confección tradicional, lo que permite reducir drásticamente las enormes cantidades de materiales que se depositan en los vertederos.&lt;/div&gt;&lt;/div&gt;\",\n  \"headLine\" : null,\n  \"preOrder\" : null,\n  \"softLaunch\" : null,\n  \"outOfStock\" : null,\n  \"notifyMe\" : null,\n  \"accessCode\" : null,\n  \"pdpGeneral\" : null,\n  \"fit\" : null,\n  \"legal\" : null,\n  \"marketing\" : null,\n  \"shippingDelay\" : null,\n  \"productName\" : null,\n  \"techSpec\" : \"\",\n  \"benefitSummaryList\" : null,\n  \"benefitSummaryVideo\" : null,\n  \"manufacturingCountryOfOrigin\" : null,\n  \"sizeChart\" : \"mens-shoe-sizing-chart\",\n  \"imageBadgeResource\" : null,\n  \"colors\" : [ {\n    \"type\" : \"SIMPLE\",\n    \"name\" : \"Negro\",\n    \"hex\" : \"13161A\"\n  }, {\n    \"type\" : \"PRIMARY\",\n    \"name\" : \"Negro\",\n    \"hex\" : \"13161A\"\n  }, {\n    \"type\" : \"SECONDARY\",\n    \"name\" : \"Blanco\",\n    \"hex\" : \"FFFFFF\"\n  }, {\n    \"type\" : \"LOGO\",\n    \"name\" : \"Royal juego\",\n    \"hex\" : \"3F518E\"\n  } ],\n  \"bestFor\" : [ ],\n  \"athletes\" : [ ],\n  \"widths\" : [ {\n    \"type\" : null,\n    \"value\" : \"REGULAR\",\n    \"localizedValue\" : \"Normal\"\n  } ]\n}\n\n\n\n\n\n\nProduct Content by Style Color List\n\nUse this endpoin tyle Color List response body:\n\n{\n  \"852395-601\" : {\n    \"globalPid\" : \"11993007\",\n    \"parentId\" : \"78587369-2879-5dea-9b8e-adc1c389765a\",\n    \"parentType\" : \"merchProduct\",\n    \"langLocale\" : \"es_ES\",\n    \"colorDescription\" : \"Rojo universitario/Gris lobo/Rojo universitario\",\n    \"slug\" : \"kyrie-3-zapatillas-de-baloncesto\",\n    \"fullTitle\" : \"Kyrie 3 Zapatillas de baloncesto\",\n    \"title\" : \"Kyrie 3\",\n    \"subtitle\" : \"Zapatillas de baloncesto\",\n    \"descriptionHeading\" : \"DISEÑADAS PARA REALIZAR CORTES RÁPIDOS\",\n    \"description\" : \"&lt;div class=\\\"pi-tier3\\\"&gt;&lt;div class=\\\"pi-pdpmainbody\\\"&gt;&lt;p&gt;&lt;b&gt;DISEÑADAS PARA REALIZAR CORTES RÁPIDOS&lt;/b&gt;&lt;/p&gt;&lt;br&gt;&lt;p&gt;Las zapatillas de baloncesto Kyrie 3 para hombre combinan una excelente tracción, sujeción flexible y amortiguación de máxima respuesta para permitir cortes precisos y un juego rápido y fluido.&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;b&gt;Tracción excelente&lt;/b&gt;&lt;/p&gt;&lt;p&gt;La suela redondeada y la tracción adicional en los bordes de las zapatillas te permiten jugar desde cualquier ángulo. Las dos almohadillas debajo del antepié se agarran con firmeza al suelo cuando cambias rápidamente de dirección.&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;b&gt;Sujeción flexible&lt;/b&gt;&lt;/p&gt;&lt;p&gt;En la parte superior de las zapatillas, una resistente correa elástica se flexiona con el pie para ofrecer sujeción durante los recortes rápidos y los sprints. La tecnología Flywire, con cables ultraligeros y superresistentes que se integran con los cordones, añade aún más sujeción.&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;b&gt;Amortiguación de máxima respuesta&lt;/b&gt;&lt;/p&gt;&lt;p&gt;La amortiguación Nike Zoom Air de perfil bajo en el talón ofrece la máxima respuesta y comodidad durante todo el partido.&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;b&gt;Más información&lt;/b&gt;&lt;/p&gt;&lt;li&gt;Ligera espuma Phylon inyectada en el antepié que aumenta al máximo la sensación en la cancha&lt;/li&gt;&lt;li&gt;Construcción HyperFuse para una sujeción y transpirabilidad duraderas&lt;/li&gt;&lt;li&gt;Diseño moldeado de tres cuartos para una mayor cantidad de detalles texturizados&lt;/li&gt;&lt;/div&gt;&lt;/div&gt;\",\n    \"headLine\" : null,\n    \"preOrder\" : null,\n    \"softLaunch\" : null,\n    \"outOfStock\" : null,\n    \"notifyMe\" : null,\n    \"accessCode\" : null,\n    \"pdpGeneral\" : null,\n    \"fit\" : null,\n    \"legal\" : null,\n    \"marketing\" : null,\n    \"shippingDelay\" : null,\n    \"productName\" : null,\n    \"techSpec\" : \"\",\n    \"benefitSummaryList\" : null,\n    \"benefitSummaryVideo\" : null,\n    \"manufacturingCountryOfOrigin\" : null,\n    \"sizeChart\" : \"unisex-shoe-sizing-chart\",\n    \"imageBadgeResource\" : null,\n    \"colors\" : [ {\n      \"type\" : \"SIMPLE\",\n      \"name\" : \"Rojo\",\n      \"hex\" : \"B40033\"\n    }, {\n      \"type\" : \"PRIMARY\",\n      \"name\" : \"Rojo universitario\",\n      \"hex\" : \"982433\"\n    }, {\n      \"type\" : \"SECONDARY\",\n      \"name\" : \"Gris lobo\",\n      \"hex\" : \"A2A5AC\"\n    }, {\n      \"type\" : \"LOGO\",\n      \"name\" : \"Rojo universitario\",\n      \"hex\" : \"982433\"\n    } ],\n    \"bestFor\" : [ ],\n    \"athletes\" : [ {\n      \"type\" : null,\n      \"value\" : \"Kyrie Irving\",\n      \"localizedValue\" : \"Kyrie Irving\"\n    } ],\n    \"widths\" : [ {\n      \"type\" : null,\n      \"value\" : \"REGULAR\",\n      \"localizedValue\" : \"Normal\"\n    } ]\n  },\n  \"919704-006\" : {\n    \"globalPid\" : \"11825501\",\n    \"parentId\" : \"d48fbb0b-4516-5075-8a8f-32401eed44af\",\n    \"parentType\" : \"merchProduct\",\n    \"langLocale\" : \"es_ES\",\n    \"colorDescription\" : \"Negro/Blanco/Royal juego\",\n    \"slug\" : \"air-jordan-1-retro-high-flyknit-zapatillas\",\n    \"fullTitle\" : \"Air Jordan 1 Retro High Flyknit Zapatillas - Hombre\",\n    \"title\" : \"Air Jordan 1 Retro High Flyknit\",\n    \"subtitle\" : \"Zapatillas - Hombre\",\n    \"descriptionHeading\" : \"AIRE RETRO. TOQUES MODERNOS.\",\n    \"description\" : \"&lt;div class=\\\"pi-tier3\\\"&gt;&lt;div class=\\\"pi-pdpmainbody\\\"&gt;&lt;p&gt;&lt;b&gt;AIRE RETRO. TOQUES MODERNOS.&lt;/b&gt;&lt;/p&gt;&lt;br&gt;&lt;p&gt;Las zapatillas Air Jordan 1 Retro High Flyknit para hombre actualizan el icónico diseño original con un tejido Flyknit ligero y flexible.&lt;/p&gt;&lt;br&gt;&lt;p&gt;&lt;b&gt;Ventajas&lt;/b&gt;&lt;/p&gt;&lt;li&gt;Ligero material Flyknit para una mayor transpirabilidad y flexibilidad&lt;/li&gt;&lt;li&gt;Detalles de piel de cuero de cerdo para un look premium&lt;/li&gt;&lt;li&gt;Confección con cupsole de goma para proporcionar una sujeción resistente y una mayor tracción&lt;/li&gt;&lt;li&gt;Unidad Nike Air para disfrutar de una amortiguación ligera&lt;/li&gt;&lt;br&gt;&lt;p&gt;&lt;b&gt;Orígenes de Flyknit&lt;/b&gt;&lt;/p&gt;La tecnología Nike Flyknit se inspira en las opiniones de atletas que llevan tiempo buscando unas zapatillas con el ajuste ceñido y la sensación de no llevar nada, como la de un calcetín. Nike se embarcó en un proyecto de cuatro años con equipos de programadores, ingenieros y diseñadores para crear una tecnología que ayudase a confeccionar una parte superior tejida con propiedades estáticas que aportara estructura y durabilidad. Más adelante, se ajustó la distribución precisa de las partes que aportan sujeción, transpirabilidad y flexibilidad, todo en una sola capa. El resultado es una parte superior extremadamente ligera, ceñida y prácticamente sin costuras. Esta precisión sin precedentes multiplica el rendimiento y disminuye el desperdicio de materiales en un 60 % en comparación con la confección tradicional, lo que permite reducir drásticamente las enormes cantidades de materiales que se depositan en los vertederos.&lt;/div&gt;&lt;/div&gt;\",\n    \"headLine\" : null,\n    \"preOrder\" : null,\n    \"softLaunch\" : null,\n    \"outOfStock\" : null,\n    \"notifyMe\" : null,\n    \"accessCode\" : null,\n    \"pdpGeneral\" : null,\n    \"fit\" : null,\n    \"legal\" : null,\n    \"marketing\" : null,\n    \"shippingDelay\" : null,\n    \"productName\" : null,\n    \"techSpec\" : \"\",\n    \"benefitSummaryList\" : null,\n    \"benefitSummaryVideo\" : null,\n    \"manufacturingCountryOfOrigin\" : null,\n    \"sizeChart\" : \"mens-shoe-sizing-chart\",\n    \"imageBadgeResource\" : null,\n    \"colors\" : [ {\n      \"type\" : \"SIMPLE\",\n      \"name\" : \"Negro\",\n      \"hex\" : \"13161A\"\n    }, {\n      \"type\" : \"PRIMARY\",\n      \"name\" : \"Negro\",\n      \"hex\" : \"13161A\"\n    }, {\n      \"type\" : \"SECONDARY\",\n      \"name\" : \"Blanco\",\n      \"hex\" : \"FFFFFF\"\n    }, {\n      \"type\" : \"LOGO\",\n      \"name\" : \"Royal juego\",\n      \"hex\" : \"3F518E\"\n    } ],\n    \"bestFor\" : [ ],\n    \"athletes\" : [ ],\n    \"widths\" : [ {\n      \"type\" : null,\n      \"value\" : \"REGULAR\",\n      \"localizedValue\" : \"Normal\"\n    } ]\n  }\n}\n\n\n\n\n\n\nProduct Content Item by Style Color\n\nUse this endpoint to list one item (field) of product content for a style-color, country and locale. Only one style-color, itemName, country and locale is supported. You can use any valid itemName in the path parameter.\n\nEndpoint Details\n\n\n  \n    \n      HTTP Method\n      URI Path\n      Restricted?\n    \n  \n  \n    \n      GET\n      /merch/contents/v1/{styleColor}/content/{itemName}{?country,locale}\n      No\n    \n  \n\n\nPath &amp; Query Parameters\n\n\n  \n    \n      Parameter\n      Type\n      Description\n      Data Type\n      Required?\n    \n  \n  \n    \n      style-color\n      Path\n      style-color code\n      String\n      Required\n    \n    \n      itemName\n      Path\n      any product content item name e.g. colorDescription or title\n      String\n      Required\n    \n    \n      country\n      Query\n      country used to localize the content, see Merchandised Product Field Reference Guide for a complete list\n      String\n      Required\n    \n    \n      locale\n      Query\n      locale used to localize the content for the correct language\n      String\n      Required\n    \n  \n\n\nLet’s take a look at some Product Content Item by Style Color scenarios.\n\n\n  \n    \n      I Want to List Product Content for\n      Sample Query\n    \n  \n  \n    \n      title information for style-color code 919704-006, country Spain and locale es_ES\n      https://api.nike.com/merch/contents/v1/919704-006/content/title?country=ES&amp;locale=es_ES\n    \n  \n\n\nRequest Headers\n\n\n  \n    \n      Header Name\n      Description\n      Required?\n    \n  \n  \n    \n      Accept\n      Content type you will accept in response, application/json is only value allowed\n      Optional\n    \n    \n      Content-Type\n      Content type of the request, application/json is only value allowed\n      Optional\n    \n  \n\n\nRequest Body\n\nThere is no request body for a GET request.\n\nSample Product Content by Style Color List URI:\n\nhttps://api.nike.com/merch/contents/v1/919704-006/content/title?country=ES&amp;locale=es_ES\n\n\nResponse Body\n\nSample Product Content Item by Style Color List response body:\n\n\n  TIP: The response body returns the value of the itemName path parameter and the locale query parameter.\n\n\n{\n  \"locale\" : \"es_ES\",\n  \"title\" : \"Air Jordan 1 Retro High Flyknit\"\n}\n\n\n\n\n\n\nProduct Content Field by Style Color List\n\nUse this endpoint to list one item (field) of product content for a list of style-colors, country and locale. Only one itemName, country and locale is supported. You can use any valid itemName in the path parameter.\n\nEndpoint Details\n\n\n  \n    \n      HTTP Method\n      URI Path\n      Restricted?\n    \n  \n  \n    \n      GET\n      /merch/contents/v1/content/{fieldname}{?country,locale,stylecolors}\n      No\n    \n  \n\n\nPath &amp; Query Parameters\n\n\n  \n    \n      Parameter\n      Type\n      Description\n      Data Type\n      Required?\n    \n  \n  \n    \n      fieldname\n      Path\n      any product content item name e.g. colorDescription or title\n      String\n      Required\n    \n    \n      style-color\n      Query\n      comma-separated list of style-color codes\n      String\n      Required\n    \n    \n      country\n      Query\n      country used to localize the content for the correct country\n      String\n      Required\n    \n    \n      locale\n      Query\n      locale used to localize the content for the correct language\n      String\n      Required\n    \n  \n\n\nLet’s take a look at some Product Content Field by Style Color List scenarios.\n\n\n  \n    \n      I Want to List Product Content for\n      Sample Query\n    \n  \n  \n    \n      title information for style-color codes 852395-601 and 919704-006, country Spain and locale es_ES\n      https://api.nike.com/merch/contents/v1/content/descriptionHeading?country=ES&amp;locale=es_ES&amp;stylecolors=852395-601,919704-006\n    \n  \n\n\nRequest Headers\n\nRequired request headers:\n\n\n  \n    \n      Header Name\n      Description\n      Required?\n    \n  \n  \n    \n      Accept\n      Content type you will accept in response, application/json is only value allowed\n      Optional\n    \n    \n      Content-Type\n      Content type of the request, application/json is only value allowed\n      Optional\n    \n  \n\n\nRequest Body\n\nThere is no request body for a GET request.\n\nSample Product Content Item by Style Color List URI:\n\nhttps://api.nike.com/merch/contents/v1/content/descriptionHeading?country=ES&amp;locale=es_ES&amp;stylecolors=852395-601,919704-006\n\n\nResponse Body\n\nSample Product Content Item by Style Color List response body:\n\n\n  TIP: The response body returns the value of the itemName path parameter and the style-color query parameter.\n\n\n{\n  \"852395-601\" : \"DISEÑADAS PARA REALIZAR CORTES RÁPIDOS\",\n  \"919704-006\" : \"AIRE RETRO. TOQUES MODERNOS.\"\n}\n\n\n\n\n\n\nProduct Image Set by Style Color\n\nUse this endpoint to list the images associated with a style-color and country.\n\nProduct images are stored in Scene 7. A Nike product often has multiple images associated with it, each displaying the product from a different angle. This group of images is called an image set in Scene 7.\n\nEndpoint Details\n\n\n  \n    \n      HTTP Method\n      URI Path\n      Restricted?\n    \n  \n  \n    \n      GET\n      /merch/contents/v1/{styleColor}/images{?country}\n      No\n    \n  \n\n\nPath &amp; Query Parameters\n\n\n  \n    \n      Parameter\n      Type\n      Description\n      Data Type\n      Required?\n    \n  \n  \n    \n      style-color\n      Path\n      style-color code\n      String\n      Required\n    \n    \n      country\n      Query\n      image country\n      String\n      Required\n    \n  \n\n\nLet’s take a look at some Product Image Set by Style Color scenarios.\n\n\n  \n    \n      I Want to List Product Image Set for\n      Sample Query\n    \n  \n  \n    \n      style-color code 919704-006 and country Spain\n      hhttps://api.nike.com//merch/contents/v1/919704-006/images?country=ES\n    \n  \n\n\nRequest Headers\n\n\n  \n    \n      Header Name\n      Description\n      Required?\n    \n  \n  \n    \n      Accept\n      Content type you will accept in response, application/json is only value allowed\n      Optional\n    \n    \n      Content-Type\n      Content type of the request, application/json is only value allowed\n      Optional\n    \n  \n\n\nRequest Body\n\nThere is no request body for a GET request.\n\nSample Product Image Set by Style Color URI:\n\nhttps://api.nike.com//merch/contents/v1/919704-006/images?country=ES\n\n\nResponse Body\n\nSample Product Image Set by Style Color response body:\n\n\n  \n    \n      Element Name\n      Required?\n      Description\n    \n  \n  \n    \n      name\n      Required\n      image set name, usually the style-color code\n    \n    \n      type\n      Required\n      image set type, always img_set\n    \n    \n      title\n      Required\n      image set title e.g. Air-Jordan-1-Retro-High-Flyknit\n    \n    \n      defaultDomains\n      Required\n      array of domains the image set is served from\n    \n    \n      images\n      Required\n      array of image objects that make up the image set\n    \n    \n      images.company\n      Required\n      image company code\n    \n    \n      images.view\n      Required\n      key of image view of product, usually in the format stylecode_colorcode_imageletter_type\n    \n  \n\n\n{\n  \"name\" : \"919704_006\",\n  \"type\" : \"img_set\",\n  \"title\" : \"Air-Jordan-1-Retro-High-Flyknit\",\n  \"defaultDomains\" : [ \"images.nike.com/is/image\", \"images2.nike.com/is/image\", \"images3.nike.com/is/image\" ],\n  \"images\" : [ {\n    \"company\" : \"DotCom\",\n    \"view\" : \"919704_006_A_PREM\"\n  }, {\n    \"company\" : \"DotCom\",\n    \"view\" : \"919704_006_B_PREM\"\n  }, {\n    \"company\" : \"DotCom\",\n    \"view\" : \"919704_006_C_PREM\"\n  }, {\n    \"company\" : \"DotCom\",\n    \"view\" : \"919704_006_D_PREM\"\n  }, {\n    \"company\" : \"DotCom\",\n    \"view\" : \"919704_006_E_PREM\"\n  }, {\n    \"company\" : \"DotCom\",\n    \"view\" : \"919704_006_F_PREM\"\n  } ]\n}\n\n\n\n\n\n\nProduct Base Image URL by Style Color\n\nUse this endpoint to list the first image in the image set for a style-color. This is also known as the base image.\n\nEndpoint Details\n\n\n  \n    \n      HTTP Method\n      URI Path\n      Restricted?\n    \n  \n  \n    \n      GET\n      /merch/contents/v1/{styleColor}/images/base{?country}\n      No\n    \n  \n\n\nPath &amp; Query Parameters\n\n\n  \n    \n      Parameter\n      Type\n      Description\n      Data Type\n      Required?\n    \n  \n  \n    \n      style-color\n      Path\n      style-color code\n      String\n      Required\n    \n    \n      country\n      Query\n      image country\n      String\n      Required\n    \n  \n\n\nLet’s take a look at some Product Base Image URL by Style Color scenarios.\n\n\n  \n    \n      I Want to List the Base Product Image for\n      Sample Query\n    \n  \n  \n    \n      style-color code 919704-006 and country Spain\n      https://api.nike.com/merch/contents/v1/919704-006/images/base?country=ES\n    \n  \n\n\nRequest Headers\n\n\n  \n    \n      Header Name\n      Description\n      Required?\n    \n  \n  \n    \n      Accept\n      Content type you will accept in response, application/json is only value allowed\n      Optional\n    \n    \n      Content-Type\n      Content type of the request, application/json is only value allowed\n      Optional\n    \n  \n\n\nRequest Body\n\nThere is no request body for a GET request.\n\nSample Product Base Image URL by Style Color URI:\n\nhttps://api.nike.com//merch/contents/v1/919704-006/images?country=ES\n\n\nResponse Body\n\nSample Product Base Image URL by Style Color response body:\n\n\n  \n    \n      Element Name\n      Required?\n      Description\n    \n  \n  \n    \n      base\n      Required\n      URI of base image\n    \n  \n\n\n{\n  \"base\" : \"https://images.nike.com/is/image/DotCom/919704_006_A_PREM\"\n}\n\n\n\n\n\n\nProduct Image Set by Style Color List\n\nUse this endpoint to list the image set for a list of style-color codes and country. Only one country is supported.\n\nEndpoint Details\n\n\n  \n    \n      HTTP Method\n      URI Path\n      Restricted?\n    \n  \n  \n    \n      GET\n      /merch/contents/v1/images{?country,stylecolors}\n      No\n    \n  \n\n\nPath &amp; Query Parameters\n\n\n  \n    \n      Parameter\n      Type\n      Description\n      Data Type\n      Required?\n    \n  \n  \n    \n      country\n      Query\n      image country\n      String\n      Required\n    \n    \n      style-colors\n      Query\n      list of style-color codes separated by commas\n      String\n      Required\n    \n  \n\n\nLet’s take a look at some Product Image Set by Style Color List scenarios.\n\n\n  \n    \n      I Want to List the Image Set for\n      Sample Query\n    \n  \n  \n    \n      style-color codes 919704-006 and 852395-601 and country Spain\n      https://api.nike.com/merch/contents/v1/images%3Fcountry=ES&amp;stylecolors=919704-006,852395-601\n    \n  \n\n\nRequest Headers\n\n\n  \n    \n      Header Name\n      Description\n      Required?\n    \n  \n  \n    \n      Accept\n      Content type you will accept in response, application/json is only value allowed\n      Optional\n    \n    \n      Content-Type\n      Content type of the request, application/json is only value allowed\n      Optional\n    \n  \n\n\nRequest Body\n\nThere is no request body for a GET request.\n\nSample Product Image Set by Style Color List URI:\n\nhttps://api.nike.com/merch/contents/v1/images?country=ES&amp;stylecolors=919704-006,852395-601\n\n\nResponse Body\n\nSample Product Image Set by Style Color List response body:\n\nSee the Product Image Set by Style Color List Response Body for a list of response body field descriptions.\n\n{\n  \"919704-006\" : {\n    \"name\" : \"919704_006\",\n    \"type\" : \"img_set\",\n    \"title\" : \"Air-Jordan-1-Retro-High-Flyknit\",\n    \"defaultDomains\" : [ \"images.nike.com/is/image\", \"images2.nike.com/is/image\", \"images3.nike.com/is/image\" ],\n    \"images\" : [ {\n      \"company\" : \"DotCom\",\n      \"view\" : \"919704_006_A_PREM\"\n    }, {\n      \"company\" : \"DotCom\",\n      \"view\" : \"919704_006_B_PREM\"\n    }, {\n      \"company\" : \"DotCom\",\n      \"view\" : \"919704_006_C_PREM\"\n    }, {\n      \"company\" : \"DotCom\",\n      \"view\" : \"919704_006_D_PREM\"\n    }, {\n      \"company\" : \"DotCom\",\n      \"view\" : \"919704_006_E_PREM\"\n    }, {\n      \"company\" : \"DotCom\",\n      \"view\" : \"919704_006_F_PREM\"\n    } ]\n  },\n  \"852395-601\" : {\n    \"name\" : \"852395_601\",\n    \"type\" : \"img_set\",\n    \"title\" : \"Kyrie-3\",\n    \"defaultDomains\" : [ \"images.nike.com/is/image\", \"images2.nike.com/is/image\", \"images3.nike.com/is/image\" ],\n    \"images\" : [ {\n      \"company\" : \"DotCom\",\n      \"view\" : \"852395_601_A_PREM\"\n    }, {\n      \"company\" : \"DotCom\",\n      \"view\" : \"852395_601_B_PREM\"\n    }, {\n      \"company\" : \"DotCom\",\n      \"view\" : \"852395_601_C_PREM\"\n    }, {\n      \"company\" : \"DotCom\",\n      \"view\" : \"852395_601_D_PREM\"\n    }, {\n      \"company\" : \"DotCom\",\n      \"view\" : \"852395_601_E_PREM\"\n    }, {\n      \"company\" : \"DotCom\",\n      \"view\" : \"852395_601_F_PREM\"\n    }, {\n      \"company\" : \"DotCom\",\n      \"view\" : \"852395_601_G_PREM\"\n    } ]\n  }\n}\n\n\n\n\n\n\nProduct Base Image URL by Style Color List\n\nUse this endpoint to list the base image for a list of style-color codes and country. Only one country is supported.\n\nEndpoint Details\n\n\n  \n    \n      HTTP Method\n      URI Path\n      Restricted?\n    \n  \n  \n    \n      GET\n      /merch/contents/v1/images/base{?country,stylecolors}\n      No\n    \n  \n\n\nPath &amp; Query Parameters\n\n\n  \n    \n      Parameter\n      Type\n      Description\n      Data Type\n      Required?\n    \n  \n  \n    \n      country\n      Query\n      image country\n      String\n      Required\n    \n    \n      style-colors\n      Query\n      list of style-color codes separated by commas\n      String\n      Required\n    \n  \n\n\nLet’s take a look at some Product Base Image URL by Style Color List scenarios.\n\n\n  \n    \n      I Want to List the Base Product Image URL for\n      Sample Query\n    \n  \n  \n    \n      style-color codes 919704-006 and 852395-601 and country Spain\n      https://api.nike.com/merch/contents/v1/images/base?country=ES&amp;stylecolors=919704-006,852395-601\n    \n  \n\n\nRequest Headers\n\n\n  \n    \n      Header Name\n      Description\n      Required?\n    \n  \n  \n    \n      Accept\n      Content type you will accept in response, application/json is only value allowed\n      Optional\n    \n    \n      Content-Type\n      Content type of the request, application/json is only value allowed\n      Optional\n    \n  \n\n\nRequest Body\n\nThere is no request body for a GET request.\n\nSample Product Base Image URL by Style Color List URI:\n\nhttps://api.nike.com/merch/contents/v1/images/base?country=ES&amp;stylecolors=919704-006,852395-601\n\n\nResponse Body\n\nSample Product Image Set by Style Color List response body:\n\n{\n  \"919704-006\" : \"https://images.nike.com/is/image/DotCom/919704_006_A_PREM\",\n  \"852395-601\" : \"https://images.nike.com/is/image/DotCom/852395_601_A_PREM\"\n}\n\n\n\n\n\n\nUpgrading to the Latest Version\n\nAll clients are currently calling the most recent version of Merchandised Product services. There are no upgrade notes at this time.\n\nTroubleshooting\n\nListed below are ways to troubleshoot unexpected responses using this API.\n\nUse Troubleshooting Tools\n\nUse the Recently Published Merch Products Splunk dashboard to view product and VAS data recently loaded into the Merch v2 APIs. You can query products by time, environment, Merch Group and status. This is especially useful to get fresh data for testing.\n\nUse the Merch Products Publish Log Splunk dashboard to view the complete publish history of a style-color and Merch Group. Click a result to view all Splunk log entries associated with that publish event for a style-color and Merch Group. The results list the TraceId, useful if you need to contact the Merch Product Team for troubleshooting.\n\nCommon Questions\n\nI published a change in Prodigy but it is not returned when using the Merch Product API\n\nIt takes approximately 30 seconds for an add/update/delete record to flow to the Merchandised Products Database once it is published in Prodigy. If a change does not appear after 30 seconds by Merchandised Product API, it may be in the Prodigy queue behind other jobs with higher priority. Republish the change in Prodigy to push it again. Note that Prodigy gives a higher queue priority to an individual project change than to a change made to several products at once in a bulk update.\n\nThe fields I need are not returned by the Merch Product API\n\nThere could be several reasons why the product data you expect is not listed.\n\n\n  \n    You may not be calling the correct service.\nDepending upon the product data you are looking for, you may need to chain together services to get the input to the service that returns the data you need. See the Portrait of a Product section for the chain of calls you need to make to get all details for a product.\n  \n  \n    The data you are looking for is not set up in the upstream system.\nCheck the product in Prodigy to verify that it is merchandised as you expect.\n  \n  \n    The product data may be queued or in transit from Prodigy to the Merchandised Products database.\nWait 30 seconds and call the API again.\n  \n\n\nIf none of these scenarios apply, contact the Merchandised Product team on the #cic-merch Slack channel for help. Supply as much of the information below to the Team as possible to help them troubleshoot the issue:\n\n\n  date/time of request\n  URI, headers and body (if POST request)\n  context in which your request was executed (service-to-service, app, web)\n  environment in which your request was executed (test, prod, performance)\n  Splunk TraceId\n\n\nGlossary\n\n\n  \n    \n      Term\n      Definition\n    \n  \n  \n    \n      Image Base\n      Full path to a product image in an image set in Scene 7. Does not include resizing parameters.\n    \n    \n      Image Set\n      Set of product images stored in Scene 7 representing different views of the product.  Build the URI to the product image using domain + company + view from the list image results call.\n    \n    \n      GTIN\n      Global Trade Item Number. Nike leases a block of GTINs and recycles them seasonally. GTIN is commonly called UPC code, although the technical specification is slightly different for the two.\n    \n    \n      Master Product\n      A Nike iD product that has SKUs and is purchasable.\n    \n    \n      Merch Group\n      Merchandising Group representing a Nike geographical region. See a list of supported Merchandising Groups in the Enumerations section of the Merchandised Product service.\n    \n    \n      Prebuild Product\n      A non-purchasable Nike iD product that has no SKUs. Each Prebuild product is associated to one Master product that is purchasable.\n    \n    \n      Prodigy\n      System of record for all product data. All products are merchandised in this system and flow into the Merchandised Product database when they are published in Prodigy.\n    \n    \n      SLA\n      Service Level Agreement. Commitment to caller from the service regarding service response times and service availability\n    \n    \n      SKU\n      Stock Keeping Unit. Has unique ID associated with a SKU in the ATG legacy system. A product has one or more SKUs. A SKU represents one size and has inventory.\n    \n    \n      VAS\n      Value-Added Service associated with a product such as gift wrap and product customization\n    \n  \n\n\nRelease Notes\n\nThere are no release notes at this time.\n\nDocument Change Log\n\n\n  \n    \n      Summary\n      Date\n      Description\n    \n  \n  \n    \n      V1.0 Published\n      1 December, 2017\n      The initial, reviewed version of the document was published.\n    \n    \n      Edits, Internationalization, Product sections\n      7 December, 2017\n      Updated documentation with new content on how products flow, international considerations, and editing/formatting changes.\n    \n    \n      Clarification on count\n      12 February, 2018\n      Clarified that when count query parameter is supplied that the maximum number of products returned is 25.\n    \n    \n      Updated external links\n      3 April, 2018\n      Updated external links to open in new browser window\n    \n  \n\n\nRelated Links\n\nNDe Documentation Home\n\nGetting Started\n\nBusiness Guides\n\nDeveloper’s Guides\n\nMerchandised Product Field Reference Guide"
						}

						"api-api-product-feeds": {
